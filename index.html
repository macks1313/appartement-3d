<!DOCTYPE html>

<title>Appartement 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#111b18;
}

body{
    color:white;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#c9a27b;
}

/* =========================
   INTERFACE
========================= */

.top{
    position:absolute;
    z-index:20;
    top:16px;
    left:16px;
    right:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    background:rgba(248,244,235,.95);
    color:#19251f;
    padding:14px 20px;
    border-radius:18px;
    font-size:18px;
    font-weight:900;
    box-shadow:0 10px 30px #0004;
}

.buttons{
    display:flex;
    gap:6px;
    background:#f8f4ebee;
    padding:5px;
    border-radius:17px;
}

.buttons button{
    border:0;
    padding:10px 14px;
    border-radius:12px;
    background:transparent;
    color:#17231d;
    font-weight:800;
    cursor:pointer;
}

.buttons button.active{
    background:#17251f;
    color:white;
}

/* =========================
   SCENE
========================= */

#room{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transition:.7s;
}

#room.night{
    filter:brightness(.58) saturate(.85);
}

#room.zoom{
    transform:scale(1.06);
}

/* =========================
   OUTILS
========================= */

.tools{
    position:absolute;
    right:18px;
    top:105px;
    z-index:30;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.tools button{
    width:52px;
    height:52px;
    border:0;
    border-radius:17px;
    background:#f8f4ebee;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 8px 25px #0004;
}

/* =========================
   OBJETS INTERACTIFS
========================= */

.hotspot{
    position:absolute;
    z-index:15;
    width:52px;
    height:52px;
    border-radius:50%;
    border:2px solid white;
    background:#17251fcc;
    color:white;
    cursor:pointer;
    font-size:23px;
    box-shadow:
        0 0 0 7px #ffffff1c,
        0 10px 25px #0005;
    animation:pulse 2.3s infinite;
    transition:.2s;
}

.hotspot:hover{
    transform:scale(1.18);
    background:#d5ae63;
    color:#17251f;
}

.coffee{left:27%;top:53%}
.cat{left:67%;top:67%}
.plant{left:81%;top:47%}
.camera{left:52%;top:72%}
.window{left:65%;top:30%}
.music{left:20%;top:63%}

@keyframes pulse{
    0%{box-shadow:0 0 0 0 #fff5}
    70%{box-shadow:0 0 0 13px #fff0}
    100%{box-shadow:0 0 0 0 #fff0}
}

/* =========================
   MESSAGE
========================= */

.help{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    background:#f8f4ebf2;
    color:#17251f;
    padding:13px 19px;
    border-radius:17px;
    font-weight:800;
    white-space:nowrap;
    box-shadow:0 10px 30px #0004;
}

/* =========================
   PANNEAU
========================= */

.panel{
    position:absolute;
    right:20px;
    bottom:20px;
    z-index:100;
    width:min(390px,calc(100% - 40px));
    padding:23px;
    border-radius:25px;
    background:#14211ced;
    border:1px solid #ffffff2b;
    box-shadow:0 25px 70px #0009;
    backdrop-filter:blur(18px);
    transform:translateY(140%);
    transition:.4s;
}

.panel.open{
    transform:translateY(0);
}

.panel h2{
    margin-bottom:9px;
    font-size:23px;
}

.panel p{
    color:#d8ded9;
    line-height:1.5;
    margin-bottom:18px;
}

.close{
    position:absolute;
    top:9px;
    right:13px;
    border:0;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.actions button{
    border:1px solid #ffffff25;
    background:#293930;
    color:white;
    padding:10px 14px;
    border-radius:12px;
    font-weight:750;
    cursor:pointer;
}

.actions button:hover{
    background:#d5ae63;
    color:#17251f;
}

/* =========================
   NOTIFICATION
========================= */

.toast{
    position:absolute;
    z-index:200;
    top:90px;
    left:50%;
    transform:translate(-50%,-20px);
    opacity:0;
    background:#f8f4eb;
    color:#17251f;
    padding:12px 17px;
    border-radius:14px;
    font-weight:850;
    pointer-events:none;
    transition:.3s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

    .top{
        top:9px;
        left:9px;
        right:9px;
    }

    .logo{

        padding:10px 12px;
    }

    .buttons button{

    }

    }

        height:46px;
    }

        font-size:19px;
    }

    .help{
        font-size:12px;
        max-width:90%;
        overflow:hidden;
        text-overflow:ellipsis;
    }
}

<script>

/* =====================================================
   PANNEAU
===================================================== */

function openPanel(title,description,buttons=[]){

    document.getElementById("title").textContent =
        title;

    document.getElementById("description").textContent =
        description;

    const actions =
        document.getElementById("actions");

    actions.innerHTML = "";

    buttons.forEach(button => {

        const b =
            document.createElement("button");

        b.textContent =
            button[0];

        b.onclick =
            button[1];

        actions.appendChild(b);

    });

    document
        .getElementById("panel")
        .classList
        .add("open");
}


function closePanel(){

    document
        .getElementById("panel")
        .classList
        .remove("open");

}


/* =====================================================
   NOTIFICATION
===================================================== */

function toast(message){

    const t =
        document.getElementById("toast");

    t.textContent =
        message;

    t.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            t.classList.remove("show");

        },1800);
}

}

                "💻 Ouvrir l'ordinateur",

                () => {

                    toast(
                        "💻 Ordinateur allumé"
                    );

                }
            ]

        ]

    );

}

/* =====================================================
   SCÈNES
===================================================== */

function setScene(type,button){

    document
        .querySelectorAll(".buttons button")
        .forEach(b =>
            b.classList.remove("active")
        );

    if(button){

        button.classList.add("active");

    }

    setSceneByName(type);

}


function setSceneByName(type){

    const room =
        document.getElementById("room");

    room.classList.remove(
        "night"
    );


    if(type === "night"){

        room.classList.add(
            "night"
        );

        toast(
            "🌙 Ambiance nocturne"
        );

    }


    if(type === "magic"){

        room.style.filter =
            "saturate(1.3) hue-rotate(8deg) brightness(.92)";

        toast(
            "✨ Ambiance magique"
        );

    }


    if(type === "day"){

        room.style.filter =
            "";

        toast(
            "☀️ Journée"
        );

    }

}


/* =====================================================
   ZOOM
===================================================== */

function zoomRoom(){

    document
        .getElementById("room")
        .classList
        .toggle("zoom");

}


/* =====================================================
   NUIT
===================================================== */

function toggleNight(){

    const room =
        document.getElementById("room");

    room.classList.toggle(
        "night"
    );

    room.style.filter = "";

    toast(

        room.classList.contains("night")

        ?

        "🌙 Nuit"

        :

        "☀️ Jour"

    );

}


/* =====================================================
   RESET
===================================================== */

function resetRoom(){

    const room =
        document.getElementById("room");

    room.classList.remove(
        "night",
        "zoom"
    );

    room.style.filter = "";

    closePanel();

    toast(
        "🏠 Appartement réinitialisé"
    );

}

</script>
