<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Appartement–3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#17120f;
}

body{
    color:#fff;
}

/* =========================
   SCENE
========================= */

#scene{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(
            180deg,
            #25201e 0%,
            #59463a 38%,
            #c8794d 63%,
            #1e1714 100%
        );
    transition:filter .8s,background 1s;
}

/* lumière générale */

#scene::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle at 72% 38%,
            rgba(255,190,105,.30),
            transparent 24%
        ),
        linear-gradient(
            90deg,
            rgba(0,0,0,.45),
            transparent 35%,
            transparent 70%,
            rgba(0,0,0,.42)
        );
    z-index:20;
}

/* =========================
   FOND / FENÊTRE
========================= */

.wall{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            #332923 0%,
            #514037 18%,
            #6a5141 50%,
            #4b392f 82%,
            #2b211c 100%
        );
}

/* plafond */

.ceiling{
    position:absolute;
    left:-5%;
    top:-4%;
    width:110%;
    height:24%;
    background:linear-gradient(#3b302b,#241d1a);
    transform:perspective(900px) rotateX(-18deg);
    transform-origin:top;
}

/* grande baie vitrée */

.window{
    position:absolute;
    top:9%;
    right:10%;
    width:43%;
    height:48%;
    min-width:300px;
    border:14px solid #241b17;
    border-radius:5px;
    background:
        linear-gradient(
            180deg,
            #442e42 0%,
            #d07858 48%,
            #f5b069 70%,
            #39271e 100%
        );
    box-shadow:
        0 20px 50px rgba(0,0,0,.65),
        inset 0 0 30px rgba(255,170,90,.25);
    overflow:hidden;
    z-index:2;
}

/* ciel */

.sky{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 72% 57%,
            #ffd895 0 4%,
            #f7a766 8%,
            transparent 19%
        ),
        linear-gradient(
            #302942 0%,
            #76505a 35%,
            #d4785d 65%,
            #f1a160 100%
        );
}

/* soleil */

.sun{
    position:absolute;
    width:75px;
    height:75px;
    border-radius:50%;
    background:#ffd789;
    right:21%;
    top:51%;
    box-shadow:
        0 0 45px #ffc46c,
        0 0 90px rgba(255,177,90,.55);
}

/* montagnes */

.mountain{
    position:absolute;
    bottom:0;
    width:100%;
    height:40%;
    background:#322b35;
    clip-path:polygon(
        0 100%,
        0 60%,
        12% 40%,
        22% 65%,
        36% 28%,
        48% 58%,
        62% 18%,
        77% 55%,
        90% 32%,
        100% 55%,
        100% 100%
    );
}

.mountain.back{
    height:48%;
    opacity:.55;
    background:#58424a;
    transform:scale(1.1);
}

/* reflets vitres */

.glassReflection{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.15),
            transparent 25%,
            transparent 70%,
            rgba(255,255,255,.08)
        );
}

/* montants fenêtre */

.frameV{
    position:absolute;
    top:0;
    bottom:0;
    width:9px;
    background:#211915;
}

.frameV.one{left:33%}
.frameV.two{left:66%}

.frameH{
    position:absolute;
    left:0;
    right:0;
    height:8px;
    top:51%;
    background:#211915;
}

/* balcon */

.balcony{
    position:absolute;
    left:-5%;
    right:-5%;
    bottom:-3%;
    height:17%;
    background:#332823;
    border-top:8px solid #17120f;
}

.rail{
    position:absolute;
    top:-55%;
    left:0;
    right:0;
    height:55%;
    border-top:5px solid #211915;
    border-bottom:5px solid #211915;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 9%,
            #211915 9% 10%
        );
}

/* =========================
   SOL
========================= */

.floor{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-14%;
    height:58%;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(65,36,20,.12) 0 3px,
            transparent 3px 105px
        ),
        linear-gradient(
            180deg,
            #7a4d31,
            #40271b
        );
    transform:perspective(900px) rotateX(58deg);
    transform-origin:bottom;
    z-index:3;
}

/* =========================
   TAPIS
========================= */

.rug{
    position:absolute;
    width:43%;
    height:24%;
    left:27%;
    bottom:12%;
    background:
        repeating-linear-gradient(
            45deg,
            #69432e 0 10px,
            #80563a 10px 20px
        );
    border:8px solid #42291e;
    box-shadow:0 15px 25px rgba(0,0,0,.4);
    transform:skewX(-8deg);
    z-index:5;
}

.rug::after{
    content:"";
    position:absolute;
    inset:15px;
    border:3px solid rgba(218,174,123,.4);
}

/* =========================
   LIT
========================= */

.bed{
    position:absolute;
    width:43%;
    height:32%;
    left:43%;
    bottom:17%;
    z-index:8;
    transform:perspective(700px) rotateY(-8deg);
}

/* cadre */

.bedFrame{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:24%;
    background:#3a2419;
    border-radius:5px;
    box-shadow:0 20px 25px rgba(0,0,0,.45);
}

/* matelas */

.mattress{
    position:absolute;
    left:3%;
    right:3%;
    bottom:19%;
    height:48%;
    border-radius:14px;
    background:
        linear-gradient(
            135deg,
            #eadbc6,
            #c9b49b
        );
    box-shadow:
        0 12px 20px rgba(0,0,0,.3),
        inset 0 0 15px rgba(255,255,255,.3);
}

/* couverture */

.blanket{
    position:absolute;
    left:3%;
    right:3%;
    bottom:21%;
    height:30%;
    border-radius:8px 8px 15px 15px;
    background:
        linear-gradient(
            135deg,
            #42534e,
            #253833
        );
    box-shadow:0 6px 12px rgba(0,0,0,.25);
}

/* oreillers */

.pillow{
    position:absolute;
    width:27%;
    height:20%;
    bottom:51%;
    background:#f1e7d8;
    border-radius:15px;
    box-shadow:0 6px 10px rgba(0,0,0,.18);
}

.pillow.left{left:10%}
.pillow.right{left:42%}

/* tête de lit */

.headboard{
    position:absolute;
    left:-2%;
    right:-2%;
    top:0;
    height:26%;
    background:
        linear-gradient(
            90deg,
            #493022,
            #694735,
            #493022
        );
    border-radius:10px 10px 3px 3px;
    box-shadow:0 10px 20px rgba(0,0,0,.4);
}

/* =========================
   TABLE DE CHEVET
========================= */

.nightstand{
    position:absolute;
    width:8%;
    height:13%;
    left:35%;
    bottom:32%;
    background:#533521;
    border-radius:5px;
    box-shadow:0 10px 15px rgba(0,0,0,.35);
    z-index:9;
}

.nightstand::before{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:15%;
    height:4px;
    background:#b38359;
}

/* lampe */

.lamp{
    position:absolute;
    width:6%;
    height:15%;
    left:36%;
    bottom:44%;
    z-index:10;
}

.lampBase{
    position:absolute;
    bottom:0;
    left:45%;
    width:10%;
    height:65%;
    background:#211d1a;
}

.lampShade{
    position:absolute;
    top:0;
    left:5%;
    width:90%;
    height:45%;
    background:#d9ad6c;
    clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);
    filter:drop-shadow(0 0 12px #e7a95e);
}

/* =========================
   CANAPÉ
========================= */

.sofa{
    position:absolute;
    left:7%;
    bottom:19%;
    width:34%;
    height:27%;
    z-index:8;
}

.sofaBase{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:38%;
    border-radius:15px;
    background:
        linear-gradient(
            #765a48,
            #493326
        );
    box-shadow:0 15px 20px rgba(0,0,0,.45);
}

.sofaBack{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:67%;
    border-radius:18px 18px 5px 5px;
    background:
        linear-gradient(
            #7e6655,
            #584132
        );
}

.sofaCushion{
    position:absolute;
    bottom:24%;
    width:42%;
    height:27%;
    background:#a88c76;
    border-radius:10px;
}

.sofaCushion.one{left:8%}
.sofaCushion.two{left:52%}

/* =========================
   TABLE BASSE
========================= */

.coffee{
    position:absolute;
    width:18%;
    height:15%;
    left:28%;
    bottom:24%;
    z-index:11;
}

.coffeeTop{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:25%;
    border-radius:50%;
    background:#573522;
    box-shadow:0 7px 12px rgba(0,0,0,.45);
}

.coffeeLeg{
    position:absolute;
    width:7%;
    height:75%;
    top:18%;
    background:#332018;
}

.coffeeLeg.one{left:20%}
.coffeeLeg.two{right:20%}

/* tasse */

.cup{
    position:absolute;
    width:15%;
    height:22%;
    top:-9%;
    left:40%;
    border-radius:4px 4px 8px 8px;
    background:#ead9bf;
}

.cup::after{
    content:"";
    position:absolute;
    right:-45%;
    top:20%;
    width:45%;
    height:45%;
    border:3px solid #ead9bf;
    border-left:0;
    border-radius:0 8px 8px 0;
}

/* =========================
   MEUBLE / TV
========================= */

.tvUnit{
    position:absolute;
    right:7%;
    bottom:22%;
    width:27%;
    height:25%;
    z-index:7;
}

.tvCabinet{
    position:absolute;
    bottom:0;
    width:100%;
    height:35%;
    background:
        linear-gradient(
            #5b3824,
            #321f16
        );
    box-shadow:0 12px 20px rgba(0,0,0,.4);
}

.tv{
    position:absolute;
    width:82%;
    height:62%;
    left:9%;
    top:-38%;
    background:
        radial-gradient(
            circle at 55% 45%,
            #4c4655,
            #08090b 60%
        );
    border:7px solid #151414;
    border-radius:3px;
    box-shadow:0 10px 25px rgba(0,0,0,.55);
}

.tvStand{
    position:absolute;
    bottom:31%;
    left:44%;
    width:12%;
    height:13%;
    background:#151414;
}

/* =========================
   PLANTES
========================= */

.plant{
    position:absolute;
    bottom:19%;
    z-index:13;
}

.plant.left{
    left:3%;
    width:13%;
    height:34%;
}

.plant.right{
    right:2%;
    width:13%;
    height:37%;
}

.pot{
    position:absolute;
    bottom:0;
    left:28%;
    width:44%;
    height:27%;
    background:
        linear-gradient(
            #a96b43,
            #623b27
        );
    clip-path:polygon(8% 0,92% 0,80% 100%,20% 100%);
}

.leaf{
    position:absolute;
    width:32%;
    height:35%;
    background:
        linear-gradient(
            135deg,
            #476b42,
            #1e3d28
        );
    border-radius:100% 0 100% 0;
    transform-origin:bottom;
}

.leaf.l1{left:5%;top:25%;transform:rotate(-42deg)}
.leaf.l2{left:25%;top:5%;transform:rotate(-15deg)}
.leaf.l3{left:50%;top:12%;transform:rotate(18deg)}
.leaf.l4{left:67%;top:30%;transform:rotate(45deg)}
.leaf.l5{left:36%;top:35%;transform:rotate(5deg)}

/* =========================
   DÉCORATION MURALE
========================= */

.frames{
    position:absolute;
    left:8%;
    top:14%;
    width:27%;
    height:23%;
    z-index:4;
}

.frame{
    position:absolute;
    width:25%;
    height:40%;
    border:5px solid #b88a5b;
    background:
        linear-gradient(
            135deg,
            #d19b72,
            #5b3b31
        );
    box-shadow:0 7px 12px rgba(0,0,0,.35);
}

.frame:nth-child(1){left:0;top:20%;transform:rotate(-7deg)}
.frame:nth-child(2){left:32%;top:2%;transform:rotate(4deg)}
.frame:nth-child(3){left:65%;top:23%;transform:rotate(-3deg)}

/* étagère */

.shelf{
    position:absolute;
    left:18%;
    top:34%;
    width:20%;
    height:4px;
    background:#291b15;
    z-index:6;
    box-shadow:0 0 0 1px #8d6244;
}

.book{
    position:absolute;
    bottom:4px;
    width:12%;
    height:65px;
    background:#8a573d;
}

.book.b1{left:8%;height:50px}
.book.b2{left:23%;height:65px;background:#5f7567}
.book.b3{left:38%;height:45px;background:#a87648}
.book.b4{left:53%;height:58px;background:#74514b}

/* =========================
   OBJETS
========================= */

.vase{
    position:absolute;
    left:23%;
    bottom:36%;
    width:5%;
    height:9%;
    z-index:15;
    background:#d19a65;
    border-radius:20% 20% 40% 40%;
}

.candle{
    position:absolute;
    right:21%;
    bottom:42%;
    width:3%;
    height:6%;
    background:#ead8b8;
    z-index:15;
    border-radius:3px;
}

.candle::before{
    content:"";
    position:absolute;
    width:12px;
    height:18px;
    left:50%;
    top:-18px;
    transform:translateX(-50%);
    background:#ffb64d;
    border-radius:50% 50% 50% 0;
    box-shadow:0 0 15px #ff9e38;
}

/* =========================
   UI
========================= */

.top{
    position:absolute;
    top:22px;
    left:22px;
    right:22px;
    display:flex;
    justify-content:space-between;
    z-index:50;
}

.title,
.room{
    background:rgba(24,20,18,.82);
    border:1px solid rgba(255,220,170,.18);
    backdrop-filter:blur(15px);
    padding:14px 20px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    font-weight:800;
}

.title{
    font-size:19px;
}

.room{
    font-size:16px;
}

/* boutons */

.controls{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:50;
}

button{
    width:56px;
    height:56px;
    border:0;
    border-radius:18px;
    background:rgba(255,248,238,.94);
    color:#241c18;
    font-size:25px;
    font-weight:900;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
    cursor:pointer;
}

button:active{
    transform:scale(.92);
}

/* message */

.info{
    position:absolute;
    left:50%;
    bottom:35px;
    transform:translateX(-50%);
    z-index:60;
    background:rgba(25,20,17,.9);
    border:1px solid rgba(255,220,170,.25);
    backdrop-filter:blur(18px);
    border-radius:20px;
    padding:14px 22px;
    text-align:center;
    min-width:250px;
    max-width:85%;
    opacity:0;
    transition:.3s;
    box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.info.show{
    opacity:1;
}

/* mode nuit */

.night #scene{
    filter:brightness(.48) saturate(.85);
}

.night .lampShade{
    filter:drop-shadow(0 0 22px #ff9c3d);
}

/* petit reflet chaud */

.warmLight{
    position:absolute;
    width:45%;
    height:45%;
    right:5%;
    bottom:5%;
    background:radial-gradient(
        circle,
        rgba(255,157,75,.20),
        transparent 65%
    );
    pointer-events:none;
    z-index:18;
}

/* mobile */

@media(max-width:700px){

    .title{
        font-size:16px;
        padding:13px 16px;
    }

    .room{
        padding:13px 16px;
    }

    .window{
        right:-12%;
        width:65%;
        height:42%;
    }

    .bed{
        width:53%;
        left:38%;
        bottom:20%;
    }

    .sofa{
        left:3%;
        width:42%;
    }

    .tvUnit{
        right:1%;
        width:30%;
    }

    .plant.right{
        right:-2%;
    }

    .controls{
        right:14px;
    }

    button{
        width:52px;
        height:52px;
    }

    .info{
        bottom:25px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<div id="scene">

    <div class="wall"></div>
    <div class="ceiling"></div>

    <!-- GRANDE BAIE VITRÉE -->
    <div class="window">
        <div class="sky"></div>
        <div class="mountain back"></div>
        <div class="mountain"></div>
        <div class="sun"></div>
        <div class="balcony">
            <div class="rail"></div>
        </div>
        <div class="frameV one"></div>
        <div class="frameV two"></div>
        <div class="frameH"></div>
        <div class="glassReflection"></div>
    </div>

    <!-- SOL -->
    <div class="floor"></div>

    <!-- DÉCORATION -->
    <div class="frames">
        <div class="frame"></div>
        <div class="frame"></div>
        <div class="frame"></div>
    </div>

    <div class="shelf">
        <div class="book b1"></div>
        <div class="book b2"></div>
        <div class="book b3"></div>
        <div class="book b4"></div>
    </div>

    <!-- TAPIS -->
    <div class="rug"></div>

    <!-- CANAPÉ -->
    <div class="sofa" data-name="Canapé" data-info="Un grand canapé confortable avec coussins.">
        <div class="sofaBack"></div>
        <div class="sofaBase"></div>
        <div class="sofaCushion one"></div>
        <div class="sofaCushion two"></div>
    </div>

    <!-- LIT -->
    <div class="bed" data-name="Chambre" data-info="Une chambre chaleureuse avec lit double, couverture et oreillers.">
        <div class="headboard"></div>
        <div class="mattress"></div>
        <div class="blanket"></div>
        <div class="pillow left"></div>
        <div class="pillow right"></div>
        <div class="bedFrame"></div>
    </div>

    <!-- CHEVET -->
    <div class="nightstand"></div>

    <!-- LAMPE -->
    <div class="lamp" data-name="Lampe" data-info="Une lumière chaude pour créer une ambiance cosy.">
        <div class="lampBase"></div>
        <div class="lampShade"></div>
    </div>

    <!-- TABLE -->
    <div class="coffee" data-name="Table basse" data-info="Table basse en bois avec une tasse de café.">
        <div class="coffeeTop"></div>
        <div class="coffeeLeg one"></div>
        <div class="coffeeLeg two"></div>
        <div class="cup"></div>
    </div>

    <!-- TV -->
    <div class="tvUnit" data-name="Télévision" data-info="Une télévision installée sur un meuble en bois.">
        <div class="tv"></div>
        <div class="tvStand"></div>
        <div class="tvCabinet"></div>
    </div>

    <!-- PLANTE GAUCHE -->
    <div class="plant left" data-name="Grande plante" data-info="Une grande plante verte décorative.">
        <div class="pot"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
        <div class="leaf l4"></div>
        <div class="leaf l5"></div>
    </div>

    <!-- PLANTE DROITE -->
    <div class="plant right">
        <div class="pot"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
        <div class="leaf l4"></div>
        <div class="leaf l5"></div>
    </div>

    <div class="vase"></div>
    <div class="candle"></div>

    <div class="warmLight"></div>

</div>


<!-- INTERFACE -->

<div class="top">
    <div class="title">🏠 APPARTEMENT–3D</div>
    <div class="room">Salon</div>
</div>

<div class="controls">

    <button id="zoomIn">＋</button>

    <button id="zoomOut">−</button>

    <button id="night">☀️</button>

    <button id="reset">⌂</button>

</div>

<div class="info" id="info"></div>


<script>

const scene = document.getElementById("scene");
const info = document.getElementById("info");

let zoom = 1;

document.getElementById("zoomIn").onclick = () => {

    zoom = Math.min(1.35, zoom + .08);

    scene.style.transform =
        `scale(${zoom})`;

};

document.getElementById("zoomOut").onclick = () => {

    zoom = Math.max(.82, zoom - .08);

    scene.style.transform =
        `scale(${zoom})`;

};

document.getElementById("reset").onclick = () => {

    zoom = 1;

    scene.style.transform =
        "scale(1)";

};

document.getElementById("night").onclick = () => {

    document.body.classList.toggle("night");

    const night =
        document.body.classList.contains("night");

    document.getElementById("night").textContent =
        night ? "🌙" : "☀️";

};


/* objets interactifs */

document.querySelectorAll("[data-name]").forEach(object => {

    object.addEventListener("click", () => {

        info.innerHTML =
            "<strong>" +
            object.dataset.name +
            "</strong><br>" +
            object.dataset.info;

        info.classList.add("show");

        clearTimeout(window.infoTimer);

        window.infoTimer = setTimeout(() => {

            info.classList.remove("show");

        },3500);

    });

});


/* déplacement visuel très léger */

let startX = null;
let startY = null;

document.addEventListener("touchstart",e => {

    if(e.touches.length !== 1) return;

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;

});

document.addEventListener("touchmove",e => {

    if(startX === null || e.touches.length !== 1)
        return;

    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;

    const dx = x - startX;
    const dy = y - startY;

    const rotateY =
        Math.max(-3,Math.min(3,dx / 90));

    const rotateX =
        Math.max(-2,Math.min(2,-dy / 120));

    scene.style.transform =
        `scale(${zoom})
         rotateY(${rotateY}deg)
         rotateX(${rotateX}deg)`;

});

document.addEventListener("touchend",() => {

    startX = null;
    startY = null;

    scene.style.transform =
        `scale(${zoom})`;

});


/* souris */

document.addEventListener("mousemove",e => {

    if(window.innerWidth < 700)
        return;

    const x =
        (e.clientX / window.innerWidth - .5);

    const y =
        (e.clientY / window.innerHeight - .5);

    scene.style.transform =
        `scale(${zoom})
         rotateY(${x * 2}deg)
         rotateX(${-y * 1.5}deg)`;

});

document.addEventListener("mouseleave",() => {

    scene.style.transform =
        `scale(${zoom})`;

});

</script>
