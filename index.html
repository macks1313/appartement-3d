<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mon Appartement</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#bcd7e4;
    color:#18232e;
}

/* =========================
   FOND
========================= */

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(
            180deg,
            #b9d7e5 0%,
            #c8dfe9 55%,
            #aecbd8 100%
        );
}

/* =========================
   BARRE DU HAUT
========================= */

#header{
    position:absolute;
    z-index:20;
    top:18px;
    left:18px;
    right:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

#title{
    background:rgba(255,255,255,.94);
    border-radius:22px;
    padding:15px 21px;

    font-size:20px;
    font-weight:900;

    box-shadow:
        0 10px 30px rgba(0,0,0,.15);
}

#room{
    background:rgba(255,255,255,.94);
    border-radius:22px;
    padding:15px 22px;

    font-size:18px;
    font-weight:900;

    box-shadow:
        0 10px 30px rgba(0,0,0,.15);
}

/* =========================
   SCÈNE
========================= */

#viewport{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    touch-action:none;
}

#scene{
    width:850px;
    height:650px;

    position:relative;

    transform:
        translate3d(0,0,0)
        scale(1);

    transform-origin:center center;

    transition:transform .08s linear;
}

/* =========================
   APPARTEMENT
========================= */

#floor{
    position:absolute;

    width:720px;
    height:500px;

    left:65px;
    top:75px;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(100,65,40,.10) 0px,
            rgba(100,65,40,.10) 2px,
            transparent 2px,
            transparent 52px
        ),
        #c89b70;

    border:
        8px solid #8e684c;

    border-radius:8px;

    transform:
        perspective(1000px)
        rotateX(58deg)
        rotateZ(-1deg);

    box-shadow:
        0 35px 50px rgba(0,0,0,.25);
}

/* =========================
   PIÈCES
========================= */

.roomBox{
    position:absolute;

    border:
        5px solid #dedbd2;

    background:#eeeae1;

    box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.05);
}

#living{
    left:75px;
    top:90px;
    width:370px;
    height:235px;
}

#kitchen{
    left:75px;
    top:330px;
    width:300px;
    height:200px;
}

#bedroom{
    left:450px;
    top:90px;
    width:285px;
    height:255px;
}

#bathroom{
    left:450px;
    top:350px;
    width:285px;
    height:180px;
}

/* =========================
   NOMS DES PIÈCES
========================= */

.label{
    position:absolute;

    padding:7px 11px;

    background:rgba(255,255,255,.70);

    border-radius:10px;

    font-weight:900;
    font-size:15px;

    color:#53616d;

    pointer-events:none;
}

#living .label{
    left:20px;
    top:18px;
}

#kitchen .label{
    left:18px;
    top:15px;
}

#bedroom .label{
    left:18px;
    top:18px;
}

#bathroom .label{
    left:18px;
    top:15px;
}

/* =========================
   FENÊTRES
========================= */

.window{
    position:absolute;

    background:
        linear-gradient(
            135deg,
            #74b5cf,
            #a9d8e7
        );

    border:
        6px solid #f8f7f2;

    box-shadow:
        0 3px 7px rgba(0,0,0,.18);
}

.window:after{
    content:"";

    position:absolute;

    left:50%;
    top:0;
    bottom:0;

    width:5px;

    background:#f8f7f2;
}

.window:before{
    content:"";

    position:absolute;

    top:50%;
    left:0;
    right:0;

    height:5px;

    background:#f8f7f2;
}

.window1{
    width:120px;
    height:70px;

    left:210px;
    top:2px;
}

.window2{
    width:115px;
    height:70px;

    left:130px;
    top:2px;
}

.window3{
    width:115px;
    height:70px;

    right:25px;
    top:40px;
}

/* =========================
   CANAPÉ
========================= */

.sofa{
    position:absolute;

    left:100px;
    top:105px;

    width:190px;
    height:75px;

    background:#58686b;

    border-radius:18px;

    box-shadow:
        0 10px 12px rgba(0,0,0,.18);
}

.sofa:before{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:28px;

    background:#4d5c5e;

    border-radius:0 0 15px 15px;
}

.sofa:after{
    content:"";

    position:absolute;

    left:15px;
    right:15px;
    top:-28px;

    height:48px;

    background:#657779;

    border-radius:17px 17px 5px 5px;
}

.cushion{
    position:absolute;

    z-index:2;

    width:42px;
    height:32px;

    top:10px;

    background:#849b9d;

    border-radius:8px;
}

.c1{left:30px;}
.c2{left:75px;}
.c3{left:120px;}

/* =========================
   TABLE BASSE
========================= */

.table{
    position:absolute;

    left:140px;
    top:190px;

    width:125px;
    height:60px;

    background:#865b3d;

    border-radius:6px;

    box-shadow:
        0 8px 10px rgba(0,0,0,.2);
}

.table:after{

/* =========================
   TV
========================= */

.tvUnit{

.tvScreen{

/* =========================
   BIBLIOTHÈQUE

.bookshelf{

.shelf{

.s2{top:57px;}

.book{

.b1{

}

.b2{

.b3{

/* =========================

.cabinet{

.cab1{left:20px;}

.counter{

    left:15px;
    bottom:90px;

    height:18px;

}

.sink{
    position:absolute;

    left:65px;
    bottom:94px;

    width:55px;
    height:12px;

    background:#89959a;

    border-radius:8px;
}

.stove{
    position:absolute;

    left:145px;
    bottom:94px;

    width:70px;
    height:12px;

    background:#1c2022;

    border-radius:3px;
}

.burner{
    position:absolute;

    width:14px;
    height:14px;

    border-radius:50%;

    background:#090b0c;
}

.burner1{
    left:155px;
    bottom:105px;
}

.burner2{
    left:185px;
    bottom:105px;
}

.fridge{
    position:absolute;

    right:15px;
    bottom:15px;

    width:55px;
    height:140px;

    background:#dce1e3;

    border-radius:5px;

.fridge:after{

/* =========================
   LIT
========================= */

.bed{
    position:absolute;

    left:55px;
    top:80px;

    width:170px;
    height:125px;

    background:#634735;

    border-radius:5px;

    box-shadow:
        0 8px 12px rgba(0,0,0,.18);
}

.mattress{
    position:absolute;

    left:6px;
    top:6px;

    width:158px;
    height:113px;

    border-radius:6px;
}

.blanket{
    position:absolute;

    left:6px;
    bottom:5px;

    height:62px;

    background:#829ca0;

}

.pillow{
    position:absolute;

}

.pillow1{left:20px;}
.pillow2{right:20px;}

/* =========================
   TABLES DE NUIT
========================= */

.nightstand{
    position:absolute;

    width:42px;
    height:45px;

    background:#765039;

}

.night1{

}

.night2{

    top:115px;
}

/* =========================
   LAMPE
========================= */

.lamp{
    position:absolute;

    width:10px;
    height:55px;

    background:#34383a;
}

.lamp:before{
    content:"";

    position:absolute;

    width:38px;
    height:25px;

    left:-14px;

}

}

.lamp2{

/* =========================
   SALLE DE BAIN
========================= */

.bath{
    position:absolute;

}

.bathWater{
    position:absolute;

    left:8px;
    right:8px;
    top:8px;
    bottom:8px;

    border-radius:12px;
}

.bathTap{
    position:absolute;

    width:8px;
    height:30px;

    right:20px;
    top:-30px;

    background:#777f82;
}

/* =========================
   LAVABO
========================= */

.sinkBathroom{
    position:absolute;

    right:25px;
    top:65px;

    width:80px;
    height:50px;

    background:#f5f5f3;

    border-radius:8px;

    box-shadow:
        0 5px 8px rgba(0,0,0,.12);
}

.mirror{
    position:absolute;

    right:25px;
    top:15px;

    height:45px;

    background:#92c5d6;

}

/* =========================
   WC
========================= */

.toilet{
    position:absolute;

    right:40px;
    bottom:18px;

    width:50px;
    height:45px;

    background:white;

    border-radius:18px;
}

/* =========================
   PLANTES
========================= */

.plant{
    position:absolute;

    width:38px;
    height:38px;

    background:#47764e;

    border-radius:50%;

    box-shadow:
        0 4px 8px rgba(0,0,0,.15);
}

.plant:after{
    content:"";

    position:absolute;

    left:11px;
    bottom:-25px;

    width:18px;
    height:27px;

    background:#a66a47;

    border-radius:3px;
}

.plant1{
    left:330px;
    bottom:20px;
}

.plant2{
    right:15px;
    bottom:15px;
}

/* =========================
   DÉCORATION
========================= */

.picture{
    position:absolute;

    width:70px;
    height:48px;

    border:6px solid #674832;

    background:#c18d62;
}

.picture1{
    left:20px;
    top:15px;
}

.picture2{
    left:105px;
    top:15px;

    background:#7b9ca6;
}

/* =========================
   CONTRÔLES
========================= */

#controls{
    position:absolute;

    z-index:30;

    right:18px;
    bottom:100px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

button{
    width:58px;
    height:58px;

    border:0;

    border-radius:19px;

    background:rgba(255,255,255,.95);

    color:#18232e;

    font-size:28px;
    font-weight:800;

    box-shadow:
        0 8px 22px rgba(0,0,0,.18);
}

button:active{
    transform:scale(.92);
}

/* =========================
   INFO
========================= */

#info{
    position:absolute;

    z-index:50;

    left:50%;
    bottom:80px;

    transform:translateX(-50%);

    min-width:260px;
    max-width:80%;

    padding:16px 22px;

    background:rgba(255,255,255,.96);

    border-radius:22px;

    text-align:center;

    box-shadow:
        0 12px 35px rgba(0,0,0,.2);

    opacity:0;

    transition:opacity .25s;

    pointer-events:none;
}

#info strong{
    font-size:19px;
}

#info small{

}

/* =========================
   AIDE
========================= */

#help{
    position:absolute;

    z-index:20;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    background:rgba(255,255,255,.88);

    padding:10px 15px;

    border-radius:15px;

    color:#53616d;

    font-size:13px;

    font-weight:700;

    white-space:nowrap;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #title{
        font-size:17px;
        padding:13px 16px;
    }

    #room{
        font-size:15px;
        padding:13px 16px;
    }

    #scene{
        transform:scale(.72);
    }

    #help{
        max-width:88%;
        overflow:hidden;
        text-overflow:ellipsis;
    }
}

</style>
</head>

<body>

<div id="app">

    <div id="header">

        <div id="title">
            🏠 MON APPARTEMENT
        </div>

        <div id="room">
            Salon
        </div>

    </div>


    <div id="viewport">

        <div id="scene">

            <div id="floor">

                <!-- ================= SALON ================= -->

                <div
                    class="roomBox"
                    id="living"
                    data-name="Salon"
                    data-info="Un salon confortable avec canapé, télévision, bibliothèque et décoration."
                >

                    <div class="label">
                        SALON
                    </div>

                    <div class="window window1"></div>

                    <div class="sofa">

                        <div class="cushion c1"></div>
                        <div class="cushion c2"></div>
                        <div class="cushion c3"></div>

                    </div>

                    <div class="table"></div>

                    <div class="tv">
                        <div class="tvScreen"></div>
                    </div>

                    <div class="tvUnit"></div>

                    <div class="bookshelf">

                        <div class="shelf s1"></div>
                        <div class="shelf s2"></div>
                        <div class="shelf s3"></div>

                        <div class="book b1"></div>
                        <div class="book b2"></div>
                        <div class="book b3"></div>
                        <div class="book b4"></div>

                    </div>

                    <div class="picture picture1"></div>
                    <div class="picture picture2"></div>

                    <div class="plant plant1"></div>

                </div>


                <!-- ================= CUISINE ================= -->

                <div
                    class="roomBox"
                    id="kitchen"
                    data-name="Cuisine"
                    data-info="Cuisine équipée avec meubles, évier, plaque de cuisson et réfrigérateur."
                >

                    <div class="label">
                        CUISINE
                    </div>

                    <div class="window window2"></div>

                    <div class="counter"></div>

                    <div class="cabinet cab1"></div>
                    <div class="cabinet cab2"></div>
                    <div class="cabinet cab3"></div>

                    <div class="sink"></div>

                    <div class="stove"></div>

                    <div class="burner burner1"></div>
                    <div class="burner burner2"></div>

                    <div class="fridge"></div>

                </div>


                <!-- ================= CHAMBRE ================= -->

                <div
                    class="roomBox"
                    id="bedroom"
                    data-name="Chambre"
                    data-info="Chambre avec grand lit, oreillers, couverture, tables de nuit et lampes."
                >

                    <div class="label">
                        CHAMBRE
                    </div>

                    <div class="window window3"></div>

                    <div class="bed">

                        <div class="mattress"></div>

                        <div class="blanket"></div>

                        <div class="pillow pillow1"></div>
                        <div class="pillow pillow2"></div>

                    </div>

                    <div class="nightstand night1"></div>
                    <div class="nightstand night2"></div>

                    <div class="lamp lamp1"></div>
                    <div class="lamp lamp2"></div>

                </div>


                <!-- ================= SALLE DE BAIN ================= -->

                <div
                    class="roomBox"
                    id="bathroom"
                    data-name="Salle de bain"
                    data-info="Salle de bain avec baignoire, lavabo, miroir et toilettes."
                >

                    <div class="label">
                        SALLE DE BAIN
                    </div>

                    <div class="bath">

                        <div class="bathWater"></div>
                        <div class="bathTap"></div>

                    </div>

                    <div class="mirror"></div>

                    <div class="sinkBathroom"></div>

                    <div class="toilet"></div>

                </div>

            </div>

        </div>

    </div>


    <!-- ================= CONTRÔLES ================= -->

    <div id="controls">

        <button id="zoomIn">
            ＋
        </button>

        <button id="zoomOut">
            −
        </button>

        <button id="dayNight">
            ☀️
        </button>

        <button id="home">
            ⌂
        </button>

    </div>


    <div id="info"></div>


    <div id="help">
        👆 Glisse pour déplacer · 🤏 Pince pour zoomer · Touche les pièces
    </div>

</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

const viewport =
    document.getElementById("viewport");

const scene =
    document.getElementById("scene");

const info =
    document.getElementById("info");

const room =
    document.getElementById("room");

const app =
    document.getElementById("app");

let scale = 1;

let offsetX = 0;
let offsetY = 0;

let startX = 0;
let startY = 0;

let dragging = false;

let startOffsetX = 0;
let startOffsetY = 0;

let pinchDistance = 0;

let dark = false;


/* =========================================================
   TRANSFORMATION
========================================================= */

function updateScene(){

    scene.style.transform =
        "translate3d(" +
        offsetX +
        "px," +
        offsetY +
        "px,0) scale(" +
        scale +
        ")";

}


/* =========================================================
   SOURIS / DOIGT
========================================================= */

viewport.addEventListener(
    "pointerdown",
    function(e){

        dragging = true;

        startX = e.clientX;
        startY = e.clientY;

        startOffsetX = offsetX;
        startOffsetY = offsetY;

        viewport.setPointerCapture(e.pointerId);

    }
);


viewport.addEventListener(
    "pointermove",
    function(e){

        if(!dragging) return;

        const dx =
            e.clientX - startX;

        const dy =
            e.clientY - startY;

        offsetX =
            startOffsetX + dx;

        offsetY =
            startOffsetY + dy;

        updateScene();

    }
);


viewport.addEventListener(
    "pointerup",
    function(){

        dragging = false;

    }
);


/* =========================================================
   ZOOM
========================================================= */

viewport.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();

        if(e.deltaY < 0){

            scale += .08;

        }else{

            scale -= .08;

        }

        scale =
            Math.max(
                .55,
                Math.min(
                    1.8,
                    scale
                )
            );

        updateScene();

    },
    {passive:false}
);


/* =========================================================
   BOUTON ZOOM +
========================================================= */

document
.getElementById("zoomIn")
.addEventListener(
    "click",
    function(){

        scale += .12;

        scale =
            Math.min(
                1.8,
                scale
            );

        updateScene();

    }
);


/* =========================================================
   BOUTON ZOOM -
========================================================= */

document
.getElementById("zoomOut")
.addEventListener(
    "click",
    function(){

        scale -= .12;

        scale =
            Math.max(
                .55,
                scale
            );

        updateScene();

    }
);


/* =========================================================
   RETOUR POSITION INITIALE
========================================================= */

document
.getElementById("home")
.addEventListener(
    "click",
    function(){

        scale = 1;

        offsetX = 0;
        offsetY = 0;

        updateScene();

    }
);


/* =========================================================
   JOUR / NUIT
========================================================= */

document
.getElementById("dayNight")
.addEventListener(
    "click",
    function(){

        dark = !dark;

        if(dark){

            app.style.background =
                "linear-gradient(180deg,#182536,#26384a 60%,#17222e)";

            this.textContent = "🌙";

        }else{

            app.style.background =
                "linear-gradient(180deg,#b9d7e5 0%,#c8dfe9 55%,#aecbd8 100%)";

            this.textContent = "☀️";

        }

    }
);


/* =========================================================
   OBJETS / PIÈCES CLIQUABLES
========================================================= */

const rooms =
    document.querySelectorAll(".roomBox");


rooms.forEach(function(item){

    item.addEventListener(
        "click",
        function(e){

            e.stopPropagation();

            const name =
                item.dataset.name;

            const description =
                item.dataset.info;

            room.textContent =
                name;

            info.innerHTML =
                "<strong>" +
                name +
                "</strong><br>" +
                "<small>" +
                description +
                "</small>";

            info.style.opacity = "1";

            clearTimeout(
                window.infoTimer
            );

            window.infoTimer =
                setTimeout(
                    function(){

                        info.style.opacity = "0";

                    },
                    3500
                );

        }
    );

});


/* =========================================================
   DÉMARRAGE
========================================================= */

updateScene();

</script>

</body>
</html>
