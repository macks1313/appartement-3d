<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Appartement–3D</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#10131a;
    color:#fff;
    touch-action:none;
}

button{
    font:inherit;
    border:0;
    cursor:pointer;
}


/* =========================================================
   INTRO
========================================================= */

#intro{
    position:fixed;
    inset:0;
    z-index:1000;
    background:
        radial-gradient(circle at 50% 40%,#354154,#10131a 65%);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .8s,visibility .8s;
}

#intro.hidden{
    opacity:0;
    visibility:hidden;
}

.introBox{
    text-align:center;
    padding:35px;
}

.introIcon{
    font-size:90px;
    animation:float 2s ease-in-out infinite;
}

.introTitle{
    margin-top:15px;
    font-size:38px;
    font-weight:900;
    letter-spacing:-2px;
}

.introSub{
    margin-top:10px;
    opacity:.65;
}

.startBtn{
    margin-top:30px;
    padding:16px 28px;
    border-radius:18px;
    background:#fff;
    color:#111;
    font-weight:900;
    font-size:17px;
    box-shadow:0 12px 40px #0008;
}

.startBtn:active{
    transform:scale(.94);
}


/* =========================================================
   HEADER
========================================================= */

header{
    position:fixed;
    z-index:50;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.logo,
.roomName{
    background:#ffffffee;
    color:#151922;
    border-radius:18px;
    padding:14px 19px;
    box-shadow:0 10px 30px #0003;
    font-weight:900;
}

.logo{
    font-size:18px;
}

.roomName{
    font-size:15px;
}


/* =========================================================
   SCENE
========================================================= */

#world{
    position:absolute;
    inset:0;
    overflow:hidden;
    perspective:1000px;
    background:
        radial-gradient(
            ellipse at 50% 20%,
            #405066 0%,
            #1c2430 45%,
            #0e1218 100%
        );
}


/* lumière */

#world.day{
    background:
        radial-gradient(
            ellipse at 50% 10%,
            #b9ddf1 0%,
            #7198b0 42%,
            #263442 100%
        );
}

#world.day .room{
    filter:none;
}


/* =========================================================
   ROOM
========================================================= */

.room{
    position:absolute;
    width:760px;
    height:540px;
    left:50%;
    top:53%;
    transform:
        translate(-50%,-50%)
        rotateX(8deg)
        rotateZ(0deg);
    transform-style:preserve-3d;
    transition:transform .5s ease;
}


/* sol */

.floor{
    position:absolute;
    width:760px;
    height:420px;
    left:0;
    bottom:0;
    transform:
        rotateX(70deg)
        translateZ(-80px);
    transform-origin:bottom;
    background:
        repeating-linear-gradient(
            90deg,
            #654b3d 0px,
            #654b3d 58px,
            #765846 59px,
            #765846 62px
        );
    box-shadow:
        inset 0 0 80px #0008,
        0 20px 50px #0008;
}


/* mur gauche */

.wallLeft{
    position:absolute;
    left:0;
    top:0;
    width:190px;
    height:420px;
    transform-origin:right;
    transform:
        rotateY(65deg)
        translateZ(-35px);
    background:
        linear-gradient(
            90deg,
            #242c36,
            #4b5967
        );
    box-shadow:inset -30px 0 50px #0007;
}


/* mur droit */

.wallRight{
    position:absolute;
    right:0;
    top:0;
    width:190px;
    height:420px;
    transform-origin:left;
    transform:
        rotateY(-65deg)
        translateZ(-35px);
    background:
        linear-gradient(
            90deg,
            #4b5967,
            #242c36
        );
    box-shadow:inset 30px 0 50px #0007;
}


/* mur arrière */

.backWall{
    position:absolute;
    left:95px;
    top:0;
    width:570px;
    height:420px;
    background:
        linear-gradient(
            180deg,
            #586775,
            #394551
        );
    transform:translateZ(-100px);
    box-shadow:inset 0 -40px 70px #0005;
}


/* plafond */

.ceiling{
    position:absolute;
    left:95px;
    top:-35px;
    width:570px;
    height:150px;
    transform:
        rotateX(70deg)
        translateZ(20px);
    transform-origin:top;
    background:#677685;
}


/* =========================================================
   WINDOW
========================================================= */

.window{
    position:absolute;
    left:285px;
    top:50px;
    width:200px;
    height:145px;
    background:
        linear-gradient(
            135deg,
            #8ed8ff,
            #3e7398
        );
    border:10px solid #ddd5c5;
    box-shadow:
        0 0 0 5px #2d3540,
        0 15px 30px #0006;
    transform:translateZ(-88px);
}

.window:before,
.window:after{
    content:"";
    position:absolute;
    background:#eee7da;
}

.window:before{
    width:8px;
    top:0;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
}

.window:after{
    height:8px;
    left:0;
    right:0;
    top:50%;
    transform:translateY(-50%);
}


/* =========================================================
   PICTURES
========================================================= */

.picture{
    position:absolute;
    width:75px;
    height:95px;
    background:#b88b58;
    border:7px solid #30251f;
    box-shadow:0 8px 20px #0006;
    transform:translateZ(-90px);
}

.picture.one{
    left:145px;
    top:90px;
}

.picture.two{
    right:145px;
    top:80px;
    width:90px;
    height:70px;
}


/* =========================================================
   SOFA
========================================================= */

.sofa{
    position:absolute;
    left:115px;
    bottom:110px;
    width:285px;
    height:105px;
    transform:translateZ(20px);
    transform-style:preserve-3d;
}

.sofaBase{
    position:absolute;
    left:0;
    bottom:0;
    width:285px;
    height:65px;
    background:
        linear-gradient(
            145deg,
            #657b80,
            #394a50
        );
    border-radius:18px;
    box-shadow:0 18px 30px #0008;
}

.sofaBack{
    position:absolute;
    left:10px;
    top:-50px;
    width:265px;
    height:75px;
    background:#52676c;
    border-radius:22px 22px 10px 10px;
    transform:translateZ(-10px);
    box-shadow:0 10px 20px #0006;
}

.cushion{
    position:absolute;
    bottom:18px;
    width:110px;
    height:45px;
    border-radius:15px;
    background:#899da0;
    box-shadow:inset 0 -6px 10px #0002;
}

.cushion.a{
    left:25px;
}

.cushion.b{
    right:25px;
}


/* =========================================================
   TABLE
========================================================= */

.table{
    position:absolute;
    left:350px;
    bottom:125px;
    width:150px;
    height:100px;
    transform:translateZ(70px);
    transform-style:preserve-3d;
}

.tableTop{
    position:absolute;
    top:0;
    width:150px;
    height:75px;
    border-radius:12px;
    background:
        linear-gradient(145deg,#9a6b45,#5e3e2a);
    transform:
        rotateX(62deg)
        translateZ(18px);
    box-shadow:0 20px 25px #0007;
}

.tableLeg{
    position:absolute;
    width:12px;
    height:75px;
    bottom:0;
    background:#493020;
}

.tableLeg.a{
    left:15px;
}

.tableLeg.b{
    right:15px;
}


/* =========================================================
   TV
========================================================= */

.tv{
    position:absolute;
    right:120px;
    bottom:145px;
    width:190px;
    height:115px;
    transform:translateZ(35px);
}

.tvScreen{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 40%,#344d6b,#070b11 70%);
    border:9px solid #111;
    border-radius:5px;
    box-shadow:
        0 15px 30px #0009,
        inset 0 0 25px #3e6386;
}

.tvScreen:after{
    content:"APPARTEMENT–3D";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    letter-spacing:2px;
    color:#7ea5c5;
}

.tvStand{
    position:absolute;
    bottom:-22px;
    left:70px;
    width:50px;
    height:25px;
    background:#161a20;
}


/* =========================================================
   LAMP
========================================================= */

.lamp{
    position:absolute;
    left:540px;
    bottom:125px;
    width:45px;
    height:170px;
    transform:translateZ(40px);
}

.lampBase{
    position:absolute;
    bottom:0;
    left:14px;
    width:17px;
    height:115px;
    background:#24282d;
}

.lampShade{
    position:absolute;
    top:0;
    left:-5px;
    width:55px;
    height:50px;
    background:#d9a95f;
    clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);
    box-shadow:0 0 35px #ffc96b;
}


/* =========================================================
   PLANTE
========================================================= */

.plant{
    position:absolute;
    right:55px;
    bottom:90px;
    width:100px;
    height:170px;
    transform:translateZ(20px);
}

.pot{
    position:absolute;
    bottom:0;
    left:28px;
    width:50px;
    height:55px;
    background:#a96245;
    border-radius:5px 5px 15px 15px;
}

.leaf{
    position:absolute;
    width:65px;
    height:25px;
    background:#49784e;
    border-radius:100%;
    transform-origin:left center;
    box-shadow:0 4px 10px #0005;
}

.leaf:nth-child(1){
    left:30px;
    top:75px;
    transform:rotate(-50deg);
}

.leaf:nth-child(2){
    left:25px;
    top:55px;
    transform:rotate(10deg);
}

.leaf:nth-child(3){
    left:40px;
    top:35px;
    transform:rotate(-70deg);
}

.leaf:nth-child(4){
    left:15px;
    top:20px;
    transform:rotate(30deg);
}

.leaf:nth-child(5){
    left:45px;
    top:5px;
    transform:rotate(-30deg);
}


/* =========================================================
   TABLEAU / OBJETS
========================================================= */

.book{
    position:absolute;
    left:375px;
    bottom:208px;
    width:55px;
    height:12px;
    background:#6d3540;
    transform:rotate(-5deg) translateZ(90px);
    box-shadow:0 5px 8px #0005;
}

.cup{
    position:absolute;
    left:430px;
    bottom:215px;
    width:18px;
    height:20px;
    background:#e4d2af;
    border-radius:3px 3px 7px 7px;
    transform:translateZ(90px);
}


/* =========================================================
   CHAT
========================================================= */

.cat{
    position:absolute;
    left:280px;
    bottom:190px;
    width:58px;
    height:45px;
    z-index:20;
    transform:translateZ(100px);
    transition:
        left 1.2s ease,
        bottom 1.2s ease;
}

.catBody{
    position:absolute;
    left:8px;
    bottom:0;
    width:43px;
    height:30px;
    background:#20242a;
    border-radius:50% 55% 40% 40%;
    box-shadow:0 8px 10px #0006;
}

.catHead{
    position:absolute;
    right:0;
    bottom:20px;
    width:30px;
    height:28px;
    background:#252a30;
    border-radius:50%;
}

.catHead:before,
.catHead:after{
    content:"";
    position:absolute;
    top:-8px;
    width:12px;
    height:13px;
    background:#252a30;
}

.catHead:before{
    left:2px;
    transform:skew(-15deg);
}

.catHead:after{
    right:2px;
    transform:skew(15deg);
}

.catEye{
    position:absolute;
    top:10px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#e7cf68;
}

.catEye.a{
    left:8px;
}

.catEye.b{
    right:8px;
}

.tail{
    position:absolute;
    left:0;
    bottom:22px;
    width:35px;
    height:12px;
    border:6px solid #20242a;
    border-right:0;
    border-bottom:0;
    border-radius:30px 0 0 0;
    transform:rotate(-20deg);
}


/* =========================================================
   HUD
========================================================= */

.hud{
    position:fixed;
    z-index:60;
    left:18px;
    bottom:18px;
    right:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.hint{
    background:#ffffffec;
    color:#18202a;
    border-radius:16px;
    padding:12px 15px;
    font-size:13px;
    font-weight:800;
    box-shadow:0 10px 30px #0003;
    max-width:70%;
}

.actions{
    display:flex;
    gap:8px;
}

.action{
    width:52px;
    height:52px;
    border-radius:16px;
    background:#ffffffee;
    color:#141a22;
    font-size:22px;
    box-shadow:0 10px 30px #0004;
}

.action:active{
    transform:scale(.9);
}


/* =========================================================
   POPUP
========================================================= */

#popup{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:95px;
    transform:translate(-50%,20px);
    background:#fffffff5;
    color:#151a22;
    border-radius:20px;
    padding:18px 22px;
    min-width:230px;
    max-width:85%;
    text-align:center;
    box-shadow:0 20px 50px #0006;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

#popup.show{
    opacity:1;
    transform:translate(-50%,0);
}

#popup strong{
    display:block;
    font-size:18px;
    margin-bottom:5px;
}


/* =========================================================
   CHAOS
========================================================= */

.chaos .sofa{
    animation:shake .35s infinite;
}

.chaos .tv{
    animation:shake .2s infinite;
}

.chaos .lamp{
    animation:swing .5s infinite alternate;
}

.chaos .picture{
    animation:shake .3s infinite;
}

.chaos .cat{
    animation:catRun .7s infinite alternate;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

@keyframes shake{
    0%{transform:translateZ(40px) rotate(-2deg)}
    50%{transform:translateZ(40px) rotate(2deg)}
    100%{transform:translateZ(40px) rotate(-2deg)}
}

@keyframes swing{
    from{transform:translateZ(40px) rotate(-8deg)}
    to{transform:translateZ(40px) rotate(8deg)}
}

@keyframes catRun{
    from{transform:translateZ(100px) translateX(-20px)}
    to{transform:translateZ(100px) translateX(130px)}
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .room{
        width:680px;
        height:500px;
        top:51%;
        transform:
            translate(-50%,-50%)
            scale(.76)
            rotateX(8deg);
    }

    .logo{
        font-size:15px;
        padding:13px 15px;
    }

    .roomName{
        font-size:14px;
        padding:13px 15px;
    }

    .hint{
        font-size:11px;
    }

    .action{
        width:48px;
        height:48px;
    }

}

</style>
</head>

<body>


<!-- =====================================================
     INTRO
===================================================== -->

<div id="intro">

    <div class="introBox">

        <div class="introIcon">🏠</div>

        <div class="introTitle">
            APPARTEMENT–3D
        </div>

        <div class="introSub">
            Un appartement complètement inutile.
            Mais beaucoup trop amusant.
        </div>

        <button class="startBtn" onclick="startGame()">
            ENTRER DANS L'APPARTEMENT
        </button>

    </div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        🏠 APPARTEMENT–3D
    </div>

    <div class="roomName" id="roomName">
        Salon
    </div>

</header>


<!-- =====================================================
     MONDE
===================================================== -->

<div id="world">

    <div class="room" id="room">

        <div class="backWall"></div>

        <div class="wallLeft"></div>

        <div class="wallRight"></div>

        <div class="ceiling"></div>

        <div class="floor"></div>

        <div class="window"></div>

        <div class="picture one"></div>

        <div class="picture two"></div>


        <!-- CANAPE -->

        <div class="sofa">

            <div class="sofaBack"></div>

            <div class="sofaBase"></div>

            <div class="cushion a"></div>

            <div class="cushion b"></div>

        </div>


        <!-- TABLE -->

        <div class="table">

            <div class="tableTop"></div>

            <div class="tableLeg a"></div>

            <div class="tableLeg b"></div>

        </div>


        <!-- OBJETS TABLE -->

        <div class="book"></div>

        <div class="cup"></div>


        <!-- TV -->

        <div class="tv">

            <div class="tvScreen"></div>

            <div class="tvStand"></div>

        </div>


        <!-- LAMPE -->

        <div class="lamp">

            <div class="lampShade"></div>

            <div class="lampBase"></div>

        </div>


        <!-- PLANTE -->

        <div class="plant">

            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>

            <div class="pot"></div>

        </div>


        <!-- CHAT -->

        <div class="cat" id="cat">

            <div class="tail"></div>

            <div class="catBody"></div>

            <div class="catHead">

                <div class="catEye a"></div>

                <div class="catEye b"></div>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     POPUP
===================================================== -->

<div id="popup">

    <strong id="popupTitle">
        Appartement
    </strong>

    <span id="popupText">
        Bienvenue chez toi.
    </span>

</div>


<!-- =====================================================
     HUD
===================================================== -->

<div class="hud">

    <div class="hint" id="hint">
        👆 Touche les objets · 🌙 Change l'ambiance
    </div>

    <div class="actions">

        <button
            class="action"
            onclick="toggleDay()"
            title="Jour / nuit"
        >
            🌙
        </button>

        <button
            class="action"
            onclick="moveCat()"
            title="Chat"
        >
            🐈
        </button>

        <button
            class="action"
            onclick="chaos()"
            title="Chaos"
        >
            🌀
        </button>

    </div>

</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

const world =
    document.getElementById("world");

const room =
    document.getElementById("room");

const popup =
    document.getElementById("popup");

const popupTitle =
    document.getElementById("popupTitle");

const popupText =
    document.getElementById("popupText");

const cat =
    document.getElementById("cat");

let isDay = false;
let isChaos = false;
let catPosition = 0;


/* =========================================================
   DEMARRAGE
========================================================= */

function startGame(){

    document
        .getElementById("intro")
        .classList.add("hidden");

    showPopup(
        "Bienvenue 👋",
        "Explore ton appartement. Touche les objets et essaie le bouton 🌀."
    );

}


/* =========================================================
   POPUP
========================================================= */

function showPopup(title,text){

    popupTitle.textContent = title;

    popupText.textContent = text;

    popup.classList.add("show");

    clearTimeout(window.popupTimer);

    window.popupTimer =
        setTimeout(function(){

            popup.classList.remove("show");

        },3500);

}


/* =========================================================
   JOUR / NUIT
========================================================= */

function toggleDay(){

    isDay = !isDay;

    if(isDay){

        world.classList.add("day");

        showPopup(
            "☀️ Mode journée",
            "Les volets sont ouverts. Enfin... presque."
        );

    }else{

        world.classList.remove("day");

        showPopup(
            "🌙 Mode nuit",
            "Ambiance beaucoup plus suspecte."
        );

    }

}


/* =========================================================
   CHAT
========================================================= */

function moveCat(){

    catPosition++;

    if(catPosition > 3){

        catPosition = 0;

    }

    const positions = [

        ["280px","190px"],
        ["420px","160px"],
        ["510px","230px"],
        ["350px","120px"]

    ];

    cat.style.left =
        positions[catPosition][0];

    cat.style.bottom =
        positions[catPosition][1];

    const messages = [

        "Le chat vient de changer de place. 🐈",

        "Il cherche probablement quelque chose.",

        "Il te juge silencieusement.",

        "Il a décidé que cet appartement était le sien."

    ];

    showPopup(
        "🐈 Peka",
        messages[catPosition]
    );

}


/* =========================================================
   CHAOS
========================================================= */

function chaos(){

    isChaos = !isChaos;

    if(isChaos){

        document.body.classList.add("chaos");

        showPopup(
            "🌀 MODE CHAOS",
            "Personne ne sait pourquoi. Mais maintenant tout bouge."
        );

    }else{

        document.body.classList.remove("chaos");

        showPopup(
            "😌 Retour au calme",
            "L'appartement a miraculeusement survécu."
        );

    }

}


/* =========================================================
   OBJETS CLIQUABLES
========================================================= */

document
    .querySelector(".sofa")
    .addEventListener("click",function(){

        showPopup(
            "🛋️ Canapé",
            "Confort : 97%. Productivité : 0%."
        );

    });


document
    .querySelector(".tv")
    .addEventListener("click",function(){

        showPopup(
            "📺 Télévision",
            "Elle ne fonctionne pas. Comme dans la vraie vie."
        );

    });


document
    .querySelector(".lamp")
    .addEventListener("click",function(){

        showPopup(
            "💡 Lampe",
            "Elle éclaire beaucoup trop pour une lampe aussi petite."
        );

    });


document
    .querySelector(".plant")
    .addEventListener("click",function(){

        showPopup(
            "🌱 Plante",

/* =========================================================
   MOUVEMENT 3D
========================================================= */

let startX = null;
let startY = null;

world.addEventListener(
    "pointerdown",
    function(e){

        startX = e.clientX;
        startY = e.clientY;

    }
);


world.addEventListener(
    "pointermove",
    function(e){

        if(startX === null) return;

        const dx =
            e.clientX - startX;

        const dy =
            e.clientY - startY;

        if(Math.abs(dx) < 5 &&
           Math.abs(dy) < 5){

            return;

        }

        const rotateY =
            Math.max(
                -12,
                Math.min(12,dx / 35)
            );

        const rotateX =
            Math.max(
                2,
                Math.min(15,8 - dy / 50)
            );

        room.style.transform =
            `
            translate(-50%,-50%)
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            `;

    }
);


world.addEventListener(
    "pointerup",
    function(){

        startX = null;
        startY = null;

    }
);

let lastTap = 0;

world.addEventListener(
    "pointerup",
    function(){

        const now =
            Date.now();

        if(now-lastTap < 300){

        }

        lastTap = now;

    }
);
