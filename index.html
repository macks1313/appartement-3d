<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Appartement-3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#15120f;
    color:#fff;
}

body{
    touch-action:none;
}

/* =====================================================
   INTERFACE
===================================================== */

#ui{
    position:fixed;
    inset:0;
    z-index:100;
    pointer-events:none;
}

.logo{
    position:absolute;
    top:24px;
    left:22px;
    padding:15px 22px;
    border-radius:20px;
    background:rgba(255,250,242,.94);
    color:#20252a;
    font-size:19px;
    font-weight:900;
    letter-spacing:.3px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.roomName{
    position:absolute;
    top:24px;
    right:22px;
    padding:15px 21px;
    border-radius:20px;
    background:rgba(255,250,242,.94);
    color:#20252a;
    font-size:17px;
    font-weight:800;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.help{
    position:absolute;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    padding:12px 20px;
    border-radius:18px;
    background:rgba(255,250,242,.9);
    color:#30363a;
    font-size:13px;
    font-weight:750;
    white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.22);
}

.controls{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    pointer-events:auto;
}

.control{
    width:54px;
    height:54px;
    border:0;
    border-radius:18px;
    background:rgba(255,250,242,.95);
    color:#20252a;
    font-size:26px;
    font-weight:800;
    box-shadow:0 10px 28px rgba(0,0,0,.25);
}

.control:active{
    transform:scale(.92);
}

#info{
    position:absolute;
    left:50%;
    bottom:78px;
    transform:translateX(-50%) translateY(15px);
    min-width:230px;
    max-width:85%;
    padding:15px 20px;
    text-align:center;
    border-radius:19px;
    background:rgba(255,250,242,.95);
    color:#252a2d;
    box-shadow:0 12px 35px rgba(0,0,0,.3);
    opacity:0;
    transition:.25s;
}

#info.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

#info strong{
    font-size:17px;
}

#info span{
    display:block;
    margin-top:4px;
    font-size:13px;
    color:#64615b;
}

/* =====================================================
   MONDE 3D
===================================================== */

#viewport{
    position:absolute;
    inset:0;
    overflow:hidden;
    perspective:1100px;
    background:
        radial-gradient(circle at 50% 42%,#624936 0,#211a16 48%,#0d0b0a 100%);
}

#world{
    position:absolute;
    left:50%;
    top:50%;
    width:900px;
    height:620px;
    transform-style:preserve-3d;
    transform:
        translate(-50%,-46%)
        rotateX(8deg)
        rotateY(-18deg)
        scale(.95);
    transition:transform .08s linear;
}

/* =====================================================
   PIÈCE
===================================================== */

.room{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
}

/* sol */

.floor{
    position:absolute;
    left:0;
    top:300px;
    width:900px;
    height:620px;
    transform:
        rotateX(90deg)
        translateZ(-40px);
    transform-origin:top center;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(100,58,32,.15) 0,
            rgba(100,58,32,.15) 2px,
            transparent 2px,
            transparent 110px
        ),
        linear-gradient(
            90deg,
            #7b4f35,
            #a06a47 50%,
            #70462f
        );

    box-shadow:
        inset 0 0 80px rgba(35,18,10,.55);
}

/* mur arrière */

.backWall{
    position:absolute;
    left:0;
    top:0;
    width:900px;
    height:380px;
    transform:translateZ(-310px);

    background:
        radial-gradient(
            circle at 65% 45%,
            rgba(255,195,120,.17),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #4a3028,
            #6d4938 55%,
            #4a3028
        );

    box-shadow:inset 0 -40px 80px rgba(20,10,5,.45);
}

/* mur gauche */

.leftWall{
    position:absolute;
    left:0;
    top:0;
    width:620px;
    height:380px;
    transform:
        rotateY(90deg)
        translateZ(-310px);
    transform-origin:left center;

    background:
        linear-gradient(
            180deg,
            #473029,
            #68473a
        );
}

/* mur droit */

.rightWall{
    position:absolute;
    right:0;
    top:0;
    width:620px;
    height:380px;
    transform:
        rotateY(-90deg)
        translateZ(-310px);
    transform-origin:right center;

    background:
        linear-gradient(
            180deg,
            #4b3028,
            #69473a
        );
}

/* =====================================================
   FENÊTRE
===================================================== */

.window{
    position:absolute;
    left:270px;
    top:55px;
    width:390px;
    height:270px;
    transform:translateZ(-322px);
    border:12px solid #2d211b;
    background:
        linear-gradient(
            180deg,
            #f4a56f 0%,
            #e7785d 35%,
            #714f68 67%,
            #263d55 100%
        );
    box-shadow:
        0 0 0 3px #9b6844,
        0 20px 60px rgba(0,0,0,.5);
    overflow:hidden;
}

.window:before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:48%;
    background:
        linear-gradient(
            160deg,
            transparent 0 25%,
            #24303a 25% 31%,
            transparent 31%
        ),
        linear-gradient(
            20deg,
            transparent 0 36%,
            #182631 36% 46%,
            transparent 46%
        ),
        linear-gradient(
            180deg,
            transparent,
            rgba(10,20,30,.65)
        );
}

.window:after{
    content:"";
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#ffd47c;
    left:165px;
    top:110px;
    box-shadow:
        0 0 35px #ffc46d,
        0 0 70px rgba(255,160,70,.5);
}

.windowFrameV{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:8px;
    transform:translateX(-50%);
    background:#3b2921;
    z-index:5;
}

.windowFrameH{
    position:absolute;
    left:0;
    right:0;
    top:52%;
    height:7px;
    background:#3b2921;
    z-index:5;
}

/* =====================================================
   TAPIS
===================================================== */

.rug{
    position:absolute;
    left:260px;
    top:370px;
    width:430px;
    height:250px;
    transform:
        rotateX(90deg)
        translateZ(-20px);

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.05) 0 8px,
            transparent 8px 16px
        ),
        #a78362;

    border:10px solid #4b3428;
    border-radius:8px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
}

/* =====================================================
   LIT
===================================================== */

.bed{
    position:absolute;
    left:520px;
    top:275px;
    width:290px;
    height:190px;
    transform:translateZ(-80px);
    transform-style:preserve-3d;
}

.bedFrame{
    position:absolute;
    width:290px;
    height:190px;
    background:#432d25;
    border-radius:12px;
    box-shadow:0 20px 30px rgba(0,0,0,.4);
}

.mattress{
    position:absolute;
    left:12px;
    top:12px;
    width:266px;
    height:166px;
    background:
        linear-gradient(
            135deg,
            #eee5d6,
            #d6c9b7
        );
    border-radius:13px;
    transform:translateZ(17px);
    box-shadow:inset 0 0 15px rgba(0,0,0,.12);
}

.blanket{
    position:absolute;
    left:18px;
    bottom:10px;
    width:250px;
    height:95px;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.04) 0 3px,
            transparent 3px 7px
        ),
        #45564f;
    border-radius:15px;
    transform:translateZ(25px);
}

.pillow{
    position:absolute;
    top:28px;
    width:82px;
    height:48px;
    background:#f5efe5;
    border-radius:15px;
    transform:translateZ(25px);
    box-shadow:0 5px 10px rgba(0,0,0,.12);
}

.pillow.one{left:35px}
.pillow.two{left:137px}

/* =====================================================
   CANAPÉ
===================================================== */

.sofa{
    position:absolute;
    left:65px;
    top:300px;
    width:270px;
    height:125px;
    transform:translateZ(-30px);
    transform-style:preserve-3d;
}

.sofaSeat{
    position:absolute;
    left:0;
    bottom:0;
    width:270px;
    height:65px;
    border-radius:20px;
    background:#394c4a;
    transform:translateZ(30px);
    box-shadow:0 20px 30px rgba(0,0,0,.4);
}

.sofaBack{
    position:absolute;
    left:0;
    top:0;
    width:270px;
    height:100px;
    border-radius:22px 22px 10px 10px;
    background:#465c59;
}

.sofaArm{
    position:absolute;
    top:15px;
    width:35px;
    height:105px;
    border-radius:15px;
    background:#334542;
}

.sofaArm.left{left:-10px}
.sofaArm.right{right:-10px}

.cushion{
    position:absolute;
    width:92px;
    height:65px;
    border-radius:15px;
    background:#9b7556;
    transform:translateZ(42px);
    bottom:8px;
}

.cushion.one{left:25px}
.cushion.two{right:25px}

/* =====================================================
   TABLE
===================================================== */

.table{
    position:absolute;
    left:345px;
    top:370px;
    width:180px;
    height:115px;
    transform:translateZ(40px);
    transform-style:preserve-3d;
}

.tableTop{
    position:absolute;
    left:0;
    top:0;
    width:180px;
    height:100px;
    border-radius:50%;
    background:
        radial-gradient(
            ellipse,
            #9b6846,
            #68432f
        );
    transform:rotateX(72deg) translateZ(55px);
    box-shadow:0 10px 15px rgba(0,0,0,.35);
}

.tableLeg{
    position:absolute;
    left:86px;
    top:38px;
    width:10px;
    height:105px;
    background:#4b3024;
    transform:translateZ(0);
}

.coffee{
    position:absolute;
    left:67px;
    top:5px;
    width:43px;
    height:43px;
    border-radius:50%;
    background:#e2d1b4;
    transform:translateZ(80px);
}

.coffee:after{
    content:"";
    position:absolute;
    width:28px;
    height:28px;
    left:7px;
    top:7px;
    border-radius:50%;
    background:#55321f;
}

/* =====================================================
   PLANTES
===================================================== */

.plant{
    position:absolute;
    width:100px;
    height:180px;
    transform-style:preserve-3d;
}

.plant.one{
    left:40px;
    top:100px;
    transform:translateZ(-270px);
}

.plant.two{
    right:30px;
    top:90px;
    transform:translateZ(-260px);
}

.pot{
    position:absolute;
    left:27px;
    bottom:0;
    width:48px;
    height:52px;
    background:
        linear-gradient(
            90deg,
            #72452e,
            #a96b47,
            #70412c
        );
    border-radius:7px 7px 18px 18px;
    transform:translateZ(20px);
}

.leaf{
    position:absolute;
    width:48px;
    height:90px;
    border-radius:100% 0 100% 0;
    background:
        linear-gradient(
            135deg,
            #78966c,
            #263f31
        );
    transform-origin:bottom;
}

.leaf.a{left:5px;bottom:35px;transform:rotate(-30deg)}
.leaf.b{left:27px;bottom:40px;transform:rotate(15deg)}
.leaf.c{left:42px;bottom:60px;transform:rotate(40deg)}
.leaf.d{left:12px;bottom:75px;transform:rotate(-55deg)}
.leaf.e{left:47px;bottom:90px;transform:rotate(55deg)}
.leaf.f{left:30px;bottom:100px;transform:rotate(5deg)}

/* =====================================================
   BIBLIOTHÈQUE
===================================================== */

.library{
    position:absolute;
    left:25px;
    top:65px;
    width:175px;
    height:240px;
    transform:translateZ(-315px);
    background:#38251e;
    box-shadow:0 20px 35px rgba(0,0,0,.4);
}

.shelf{
    position:absolute;
    left:12px;
    width:151px;
    height:8px;
    background:#9b6543;
}

.shelf.s1{top:70px}
.shelf.s2{top:130px}
.shelf.s3{top:190px}

.book{
    position:absolute;
    bottom:0;
    width:18px;
    border-radius:2px 2px 0 0;
}

.b1{height:55px;left:20px;background:#a25a45}
.b2{height:70px;left:42px;background:#536d63}
.b3{height:48px;left:65px;background:#c18c52}
.b4{height:62px;left:90px;background:#705276}
.b5{height:51px;left:116px;background:#b5a06b}

/* =====================================================
   LAMPE
===================================================== */

.lamp{
    position:absolute;
    left:735px;
    top:185px;
    width:90px;
    height:180px;
    transform:translateZ(-180px);
}

.lampShade{
    position:absolute;
    left:12px;
    top:0;
    width:68px;
    height:50px;
    background:#d9a765;
    clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);
    box-shadow:0 0 35px rgba(255,180,80,.35);
}

.lampStem{
    position:absolute;
    left:43px;
    top:45px;
    width:6px;
    height:120px;
    background:#27221e;
}

.lampGlow{
    position:absolute;
    left:-30px;
    top:-25px;
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(255,185,90,.12);
    filter:blur(20px);
}

/* =====================================================
   DÉCORATIONS
===================================================== */

.frame{
    position:absolute;
    width:100px;
    height:120px;
    background:#b58b60;
    border:9px solid #30221c;
    transform:translateZ(-318px);
}

.frame.one{
    left:225px;
    top:90px;
    transform:translateZ(-319px) rotate(-4deg);
}

.frame.two{
    left:770px;
    top:70px;
    width:80px;
    height:105px;
    transform:translateZ(-319px) rotate(5deg);
}

.art{
    position:absolute;
    inset:7px;
    background:
        radial-gradient(circle at 30% 30%,#e9b26d 0 9%,transparent 10%),
        radial-gradient(circle at 65% 70%,#45604f 0 15%,transparent 16%),
        linear-gradient(135deg,#6f4b37,#d39b68);
}

/* =====================================================
   BOUTONS / ÉLÉMENTS INTERACTIFS
===================================================== */

.clickable{
    cursor:pointer;
}

.clickable:active{
    filter:brightness(1.25);
}

/* =====================================================
   MODE NUIT
===================================================== */

.night #viewport{
    background:
        radial-gradient(circle at 50% 45%,#241c2d,#08090d 80%);
}

.night .backWall{
    background:
        linear-gradient(
            180deg,
            #171824,
            #292334
        );
}

.night .leftWall,
.night .rightWall{
    background:#1d1921;
}

.night .window{
    background:
        linear-gradient(
            180deg,
            #111a38,
            #202c52 50%,
            #080c16
        );
}

.night .window:after{
    background:#fff4ce;
    box-shadow:0 0 30px #fff0ad;
}

.night .lampGlow{
    background:rgba(255,180,80,.28);
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:700px){

    #world{
        width:760px;
        height:560px;
        transform:
            translate(-50%,-45%)
            rotateX(10deg)
            rotateY(-18deg)
            scale(.68);
    }

    .logo{
        top:18px;
        left:15px;
        font-size:15px;
        padding:13px 16px;
    }

    .roomName{
        top:18px;
        right:15px;
        font-size:15px;
        padding:13px 16px;
    }

    .controls{
        right:13px;
    }

    .control{
        width:51px;
        height:51px;
    }

    .help{
        bottom:18px;
        max-width:82%;
        overflow:hidden;
        text-overflow:ellipsis;
        font-size:12px;
    }
}
</style>
</head>

<body>

<div id="viewport">

    <div id="world">

        <div class="room">

            <div class="backWall"></div>
            <div class="leftWall"></div>
            <div class="rightWall"></div>
            <div class="floor"></div>

            <div class="window">
                <div class="windowFrameV"></div>
                <div class="windowFrameH"></div>
            </div>

            <div class="rug"></div>

            <!-- BIBLIOTHÈQUE -->

            <div class="library clickable" data-name="Bibliothèque" data-text="Quelques livres, des souvenirs et beaucoup de choses à découvrir.">
                <div class="shelf s1"></div>
                <div class="shelf s2"></div>
                <div class="shelf s3"></div>

                <div class="book b1"></div>
                <div class="book b2"></div>
                <div class="book b3"></div>
                <div class="book b4"></div>
                <div class="book b5"></div>
            </div>

            <!-- CADRES -->

            <div class="frame one clickable"
                 data-name="Photo"
                 data-text="Une photo accrochée au mur.">
                <div class="art"></div>
            </div>

            <div class="frame two clickable"
                 data-name="Tableau"
                 data-text="Une petite œuvre qui donne du caractère à la pièce.">

            </div>

            <!-- CANAPÉ -->

            <div class="sofa clickable"
                 data-name="Canapé"
                 data-text="Le coin parfait pour regarder un film.">

                <div class="sofaBack"></div>
                <div class="sofaSeat"></div>

                <div class="sofaArm left"></div>
                <div class="sofaArm right"></div>

                <div class="cushion two"></div>
            </div>

            <!-- TABLE -->

            <div class="table clickable"
                 data-name="Table basse"
                 data-text="Une table en bois avec un café encore chaud.">

                <div class="tableTop"></div>
                <div class="tableLeg"></div>
                <div class="coffee"></div>

            </div>

            <!-- LIT -->

            <div class="bed clickable"
                 data-name="Lit"
                 data-text="Un grand lit confortable avec une couverture toute douce.">

                <div class="bedFrame"></div>
                <div class="mattress"></div>
                <div class="blanket"></div>

                <div class="pillow one"></div>
                <div class="pillow two"></div>
            </div>

            <!-- PLANTE 1 -->

            <div class="plant one clickable"
                 data-name="Monstera"
                 data-text="Une grande plante qui donne vie à l'appartement.">

                <div class="leaf a"></div>
                <div class="leaf b"></div>
                <div class="leaf c"></div>

                <div class="leaf e"></div>
                <div class="leaf f"></div>

                <div class="pot"></div>
            </div>

            <!-- PLANTE 2 -->

            <div class="plant two clickable"
                 data-name="Plante"
                 data-text="Une jolie plante décorative.">

                <div class="leaf a"></div>
                <div class="leaf b"></div>
                <div class="leaf c"></div>
                <div class="leaf d"></div>
                <div class="leaf e"></div>
                <div class="leaf f"></div>

                <div class="pot"></div>
            </div>

            <!-- LAMPE -->

            <div class="lamp clickable"
                 data-name="Lampe"
                 data-text="Une lumière chaude pour les soirées tranquilles.">

                <div class="lampGlow"></div>
                <div class="lampShade"></div>
                <div class="lampStem"></div>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     INTERFACE
===================================================== -->

<div id="ui">

    <div class="logo">
        🏠 APPARTEMENT-3D
    </div>

    <div class="roomName" id="roomName">
        Salon
    </div>

    <div class="controls">

        <button class="control" id="zoomIn">
            +
        </button>

        <button class="control" id="zoomOut">
            −
        </button>

        <button class="control" id="night">
            ☀️
        </button>

        <button class="control" id="reset">
            ⌂
        </button>

    </div>

    <div id="info">
        <strong></strong>
        <span></span>
    </div>

    <div class="help">
        👆 Glisse pour regarder · 🤏 Pince pour zoomer · ✨ Touche les objets
    </div>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

const world = document.getElementById("world");
const viewport = document.getElementById("viewport");
const info = document.getElementById("info");

let rotationX = 8;
let rotationY = -18;
let zoom = .95;

let dragging = false;
let lastX = 0;
let lastY = 0;

let pinchStart = 0;
let pinchZoom = .95;

let nightMode = false;


/* =====================================================
   AFFICHAGE
===================================================== */

function updateWorld(){

    world.style.transform =
        "translate(-50%,-46%) " +
        "rotateX(" + rotationX + "deg) " +
        "rotateY(" + rotationY + "deg) " +
        "scale(" + zoom + ")";
}


/* =====================================================
   SOURIS / TOUCH
===================================================== */

viewport.addEventListener("pointerdown",function(e){

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

    viewport.setPointerCapture(e.pointerId);
});


viewport.addEventListener("pointermove",function(e){

    if(!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    rotationY += dx * .18;
    rotationX -= dy * .12;

    rotationX = Math.max(-8,Math.min(30,rotationX));

    lastX = e.clientX;
    lastY = e.clientY;

    updateWorld();
});


viewport.addEventListener("pointerup",function(){

    dragging = false;

});


viewport.addEventListener("pointercancel",function(){

    dragging = false;

});


/* =====================================================
   ZOOM MOLETTE
===================================================== */

viewport.addEventListener("wheel",function(e){

    e.preventDefault();

    zoom += e.deltaY * -.0008;

    zoom = Math.max(.55,Math.min(1.35,zoom));

    updateWorld();

},{passive:false});


/* =====================================================
   ZOOM BOUTONS
===================================================== */

document.getElementById("zoomIn").onclick = function(){

    zoom += .1;

    zoom = Math.min(1.35,zoom);

    updateWorld();

};


document.getElementById("zoomOut").onclick = function(){

    zoom -= .1;

    zoom = Math.max(.55,zoom);

    updateWorld();

};


/* =====================================================
   RESET
===================================================== */

document.getElementById("reset").onclick = function(){

    rotationX = 8;
    rotationY = -18;
    zoom = .95;

    updateWorld();

};


/* =====================================================
   MODE NUIT
===================================================== */

document.getElementById("night").onclick = function(){

    nightMode = !nightMode;

    document.body.classList.toggle("night",nightMode);

    document.getElementById("night").textContent =
        nightMode ? "🌙" : "☀️";

};


/* =====================================================
   OBJETS CLIQUABLES
===================================================== */

document.querySelectorAll(".clickable").forEach(function(object){

    object.addEventListener("pointerup",function(e){

        if(Math.abs(e.clientX-lastX)>8) return;

        const name =
            object.dataset.name || "Objet";

        const text =
            object.dataset.text || "";

        info.querySelector("strong").textContent = name;
        info.querySelector("span").textContent = text;

        info.classList.add("show");

        clearTimeout(window.infoTimeout);

        window.infoTimeout =
            setTimeout(function(){

                info.classList.remove("show");

            },3500);

    });

});


/* =====================================================
   DOUBLE TAP
===================================================== */

let lastTap = 0;

viewport.addEventListener("pointerup",function(){

    const now = Date.now();

    if(now-lastTap < 300){

        zoom += .15;

        zoom = Math.min(1.35,zoom);

        updateWorld();

    }

    lastTap = now;

});


/* =====================================================
   INITIALISATION
===================================================== */

updateWorld();

</script>

</body>
</html>
