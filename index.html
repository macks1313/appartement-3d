<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mon Appartement 3D</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#111;
  touch-action:none;
}

#app{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

.topbar{
  position:fixed;
  top:14px;
  left:14px;
  right:14px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

.title{
  background:rgba(255,255,255,.94);
  color:#111;
  padding:13px 18px;
  border-radius:18px;
  font-size:18px;
  font-weight:800;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.room{
  background:rgba(255,255,255,.94);
  color:#222;
  padding:12px 16px;
  border-radius:18px;
  font-weight:700;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.help{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:10;
  background:rgba(255,255,255,.93);
  color:#222;
  padding:12px 18px;
  border-radius:18px;
  text-align:center;
  font-size:13px;
  font-weight:600;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
  pointer-events:none;
  white-space:nowrap;
}

.info{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  z-index:20;
  width:min(88%,360px);
  background:rgba(20,20,20,.94);
  color:white;
  padding:18px;
  border-radius:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.4);
  display:none;
}

.info h2{
  margin:0 0 7px;
  font-size:20px;
}

.info p{
  margin:0;
  line-height:1.45;
  color:#ddd;
}

.close{
  position:absolute;
  right:10px;
  top:8px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#333;
  color:white;
  font-size:20px;
}

.controls{
  position:fixed;
  right:15px;
  bottom:85px;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.controls button{
  width:48px;
  height:48px;
  border:0;
  border-radius:16px;
  background:rgba(255,255,255,.94);
  color:#111;
  font-size:22px;
  box-shadow:0 7px 20px rgba(0,0,0,.2);
}

#loading{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#d9eaf1;
  color:#111;
  font-size:20px;
  font-weight:800;
}
</style>
</head>

<body>

<div id="loading">🏠 Construction de l’appartement…</div>

<div id="app"></div>

<div class="topbar">
  <div class="title">🏠 MON APPARTEMENT</div>
  <div class="room" id="roomName">Salon</div>
</div>

<div class="controls">
  <button id="plus">＋</button>
  <button id="minus">−</button>
  <button id="light">☀️</button>
  <button id="reset">⌖</button>
</div>

<div class="help">
  👆 Glisse pour regarder · 🤏 Pince pour zoomer · 👇 Touche les objets
</div>

<div class="info" id="info">
  <button class="close" id="close">×</button>
  <h2 id="infoTitle"></h2>
  <p id="infoText"></p>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import {OrbitControls} from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';


// ======================================================
// SCÈNE
// ======================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xb8d4df);

scene.fog = new THREE.Fog(0xb8d4df,18,38);


// ======================================================
// CAMÉRA
// ======================================================

const camera = new THREE.PerspectiveCamera(
  55,
  innerWidth/innerHeight,
  .1,
  100
);

camera.position.set(9,8,11);


// ======================================================
// RENDERER
// ======================================================

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;

document.getElementById("app").appendChild(renderer.domElement);


// ======================================================
// CONTROLES
// ======================================================

const controls=new OrbitControls(camera,renderer.domElement);

controls.enableDamping=true;
controls.dampingFactor=.06;

controls.target.set(0,1,0);

controls.minDistance=4;
controls.maxDistance=22;

controls.maxPolarAngle=Math.PI*.48;


// ======================================================
// LUMIÈRES
// ======================================================

const ambient=new THREE.HemisphereLight(
  0xffffff,
  0x777777,
  2
);

scene.add(ambient);


const sun=new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(7,12,5);

sun.castShadow=true;

sun.shadow.mapSize.set(2048,2048);

scene.add(sun);


// ======================================================
// MATÉRIAUX
// ======================================================

const matFloor=new THREE.MeshStandardMaterial({
  color:0xc7a37c,
  roughness:.85
});

const matWall=new THREE.MeshStandardMaterial({
  color:0xf0eee7,
  roughness:.8
});

const matWood=new THREE.MeshStandardMaterial({
  color:0x70452c,
  roughness:.75
});

const matDarkWood=new THREE.MeshStandardMaterial({
  color:0x39251b,
  roughness:.7
});

const matFabric=new THREE.MeshStandardMaterial({
  color:0x6f7774,
  roughness:1
});

const matCarpet=new THREE.MeshStandardMaterial({
  color:0x819894,
  roughness:1
});

const matMetal=new THREE.MeshStandardMaterial({
  color:0x777777,
  metalness:.7,
  roughness:.3
});

const matGlass=new THREE.MeshPhysicalMaterial({
  color:0x9bd7ed,
  transparent:true,
  opacity:.35,
  roughness:.05
});


// ======================================================
// UTILITAIRE CUBE
// ======================================================

function cube(
  name,
  x,y,z,
  sx,sy,sz,
  material,
  clickable=false
){

  const g=new THREE.BoxGeometry(sx,sy,sz);

  const m=new THREE.Mesh(g,material);

  m.position.set(x,y,z);

  m.castShadow=true;
  m.receiveShadow=true;

  m.name=name;

  if(clickable){
    m.userData.clickable=true;
  }

  scene.add(m);

  return m;
}


// ======================================================
// SOL
// ======================================================

cube(
  "Sol",
  0,-.12,0,
  18,.2,14,
  matFloor
);


// ======================================================
// MURS
// ======================================================

cube(
  "Mur arrière",
  0,2.5,-7,
  18,5,.25,
  matWall
);

cube(
  "Mur gauche",
  -9,2.5,0,
  .25,5,14,
  matWall
);

cube(
  "Mur droit",
  9,2.5,0,
  .25,5,14,
  matWall
);


// séparation chambre
cube(
  "Mur chambre",
  -2.5,2.5,1.5,
  .2,5,4,
  matWall
);


// ======================================================
// TAPIS SALON
// ======================================================

cube(
  "Grand tapis du salon",
  2,.02,2.2,
  6,.08,4,
  matCarpet,
  true
);


// ======================================================
// CANAPÉ
// ======================================================

cube(
  "Canapé",
  2,1.05,-1.3,
  4,.9,1.1,
  matFabric,
  true
);

cube(
  "Dossier canapé",
  2,1.75,-1.75,
  4,1.4,.35,
  matFabric
);

cube(
  "Accoudoir gauche",
  0,1.35,-1.3,
  .35,1.2,1.1,
  matFabric
);

cube(
  "Accoudoir droit",
  4,1.35,-1.3,
  .35,1.2,1.1,
  matFabric
);


// ======================================================
// TABLE BASSE
// ======================================================

cube(
  "Table basse",
  2,.7,1,
  2.8,.18,1.3,
  matWood,
  true
);

for(let x of [.8,3.2]){
  for(let z of [.55,1.45]){
    cube(
      "Pied table",
      x,.35,z,
      .12,.7,.12,
      matDarkWood
    );
  }
}


// ======================================================
// TÉLÉVISION
// ======================================================

cube(
  "Meuble TV",
  2,.55,-6.4,
  4,.8,.7,
  matDarkWood,
  true
);

const tv=cube(
  "Télévision",
  2,2.2,-6.05,
  3.8,2.1,.12,
  new THREE.MeshStandardMaterial({
    color:0x080b0d,
    roughness:.2,
    metalness:.3,
    emissive:0x071b2b
  }),
  true
);


// ======================================================
// MEUBLE TV DÉTAILS
// ======================================================

cube(
  "Console",
  1.1,.9,-6.1,
  .8,.3,.5,
  matMetal,
  true
);

cube(
  "Enceinte gauche",
  -.3,1,-6.1,
  .45,.8,.45,
  matDarkWood
);

cube(
  "Enceinte droite",
  4.3,1,-6.1,
  .45,.8,.45,
  matDarkWood
);


// ======================================================
// PLANTE
// ======================================================

cube(
  "Pot plante",
  -6,.7,-4.5,
  .9,1.2,.9,
  matWood,
  true
);

for(let i=0;i<8;i++){

  const leaf=new THREE.Mesh(
    new THREE.SphereGeometry(.55,.16,.12),
    new THREE.MeshStandardMaterial({
      color:0x3c7944
    })
  );

  leaf.position.set(
    -6+Math.cos(i)*.8,
    1.7+Math.sin(i)*.4,
    -4.5+Math.sin(i)*.6
  );

  leaf.scale.y=1.5;

  leaf.castShadow=true;

  scene.add(leaf);
}


// ======================================================
// TABLE À MANGER
// ======================================================

cube(
  "Table à manger",
  -5,.9,2.8,
  3.2,.18,1.5,
  matWood,
  true
);

for(let x of [-6.2,-3.8]){
  for(let z of [2.1,3.5]){

    cube(
      "Chaise",
      x,.65,z,
      .65,1.2,.65,
      matDarkWood,
      true
    );

  }
}


// ======================================================
// CUISINE
// ======================================================

cube(
  "Plan de travail cuisine",
  -5,1.25,-5.5,
  6,1.2,1.2,
  matDarkWood,
  true
);

cube(
  "Évier",
  -5.5,1.9,-5.5,
  1.2,.08,.7,
  matMetal,
  true
);

cube(
  "Réfrigérateur",
  -1.5,2.4,-5.5,
  1.3,4.8,1.2,
  matMetal,
  true
);

cube(
  "Four",
  -4,1.8,-5.5,
  1.1,1.2,1,
  matMetal,
  true
);


// ======================================================
// LIT
// ======================================================

cube(
  "Lit",
  -5,1,5,
  4, .45, 5,
  matDarkWood,
  true
);

cube(
  "Matelas",
  -5,1.45,5,
  3.8,.55,4.7,
  new THREE.MeshStandardMaterial({
    color:0xe7e2d7,
    roughness:1
  }),
  true
);

cube(
  "Oreiller 1",
  -6,1.85,6.4,
  1.2,.3,.7,
  matWall
);

cube(
  "Oreiller 2",
  -4,1.85,6.4,
  1.2,.3,.7,
  matWall
);


// ======================================================
// ARMOIRE
// ======================================================

cube(
  "Armoire",
  -8,2.3,4.8,
  1.3,4.5,3,
  matWood,
  true
);


// ======================================================
// FENÊTRE
// ======================================================

cube(
  "Fenêtre",
  5,3,-6.82,
  4,2.4,.08,
  matGlass,
  true
);


// cadre
for(const x of [3,7]){
  cube(
    "Cadre fenêtre",
    x,3,-6.7,
    .12,2.7,.15,
    matWood
  );
}

cube(
  "Cadre fenêtre horizontal",
  5,3,-6.7,
  4,.12,.15,
  matWood
);


// ======================================================
// LAMPES
// ======================================================

function lamp(x,y,z){

  const bulb=new THREE.Mesh(
    new THREE.SphereGeometry(.25,20,20),
    new THREE.MeshStandardMaterial({
      color:0xffe7a3,
      emissive:0xffb52e,
      emissiveIntensity:2
    })
  );

  bulb.position.set(x,y,z);

  scene.add(bulb);

  const light=new THREE.PointLight(
    0xffd89a,
    4,
    8
  );

  light.position.set(x,y,z);

  light.castShadow=true;

  scene.add(light);

  return light;
}

const lamp1=lamp(2,4,-1);

const lamp2=lamp(-5,4,4);


// ======================================================
// LIVRES
// ======================================================

for(let i=0;i<5;i++){

  cube(
    "Livre",
    -7+i*.35,
    1.4,
    -6,
    .25,
    .8,
    .7,
    matDarkWood,
    true
  );
}


// ======================================================
// RAYCASTER POUR OBJETS CLIQUABLES
// ======================================================

const raycaster=new THREE.Raycaster();

const pointer=new THREE.Vector2();

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

    pointer.x=(e.clientX/innerWidth)*2-1;
    pointer.y=-(e.clientY/innerHeight)*2+1;

    raycaster.setFromCamera(pointer,camera);

    const hits=raycaster.intersectObjects(
      scene.children,
      true
    );

    const hit=hits.find(
      h=>h.object.userData.clickable
    );

    if(hit){

      const name=hit.object.name;

      const descriptions={

        "Canapé":
          "Un grand canapé confortable. Tu peux l'inspecter et imaginer une soirée devant la télévision.",

        "Table basse":
          "La table basse du salon. Quelques objets pourraient être ajoutés dessus.",

        "Télévision":
          "📺 Télévision — elle pourrait devenir interactive avec une vraie interface.",

        "Console":
          "🎮 Console de jeux.",

        "Grand tapis du salon":
          "Un grand tapis placé au centre du salon.",

        "Plante":
          "🌿 Une plante décorative.",

        "Table à manger":
          "🍽️ La table à manger.",

        "Évier":
          "🚰 Évier de la cuisine.",

        "Réfrigérateur":
          "🧊 Réfrigérateur. On pourrait ajouter un inventaire à l'intérieur.",

        "Four":
          "🔥 Four de la cuisine.",

        "Lit":
          "🛏️ Ton lit.",

        "Matelas":
          "Un matelas confortable.",

        "Armoire":
          "👕 Armoire. Elle pourrait s'ouvrir dans une prochaine version.",

        "Fenêtre":
          "🪟 Fenêtre donnant sur l'extérieur.",

        "Livre":
          "📖 Un livre posé dans la bibliothèque."
      };

      document.getElementById("infoTitle").textContent=name;

      document.getElementById("infoText").textContent=
        descriptions[name] ||
        "Objet interactif de l'appartement.";

      document.getElementById("info").style.display="block";
    }

  }
);


// ======================================================
// BOUTONS
// ======================================================

document.getElementById("close").onclick=()=>{
  document.getElementById("info").style.display="none";
};


document.getElementById("plus").onclick=()=>{

  camera.position.multiplyScalar(.85);

};


document.getElementById("minus").onclick=()=>{

  camera.position.multiplyScalar(1.15);

};


document.getElementById("reset").onclick=()=>{

  camera.position.set(9,8,11);

  controls.target.set(0,1,0);

};


let night=false;

document.getElementById("light").onclick=()=>{

  night=!night;

  if(night){

    scene.background.set(0x101827);

    scene.fog.color.set(0x101827);

    ambient.intensity=.35;

    sun.intensity=.5;

    lamp1.intensity=7;

    lamp2.intensity=7;

  }else{

    scene.background.set(0xb8d4df);

    scene.fog.color.set(0xb8d4df);

    ambient.intensity=2;

    sun.intensity=3;

    lamp1.intensity=4;

    lamp2.intensity=4;

  }

};


// ======================================================
// REDIMENSIONNEMENT
// ======================================================

addEventListener("resize",()=>{

  camera.aspect=innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});


// ======================================================
// ANIMATION
// ======================================================

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene,camera);

}

animate();


// ======================================================
// FIN CHARGEMENT
// ======================================================

setTimeout(()=>{

  document.getElementById("loading").style.display="none";

},1000);

</script>

</body>
</html>
