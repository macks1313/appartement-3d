<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appartement 3D</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    color:white;
}

#app{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}


/* =====================================================
   UI
===================================================== */

.interface{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
}

.topbar{
    position:absolute;
    top:22px;
    left:22px;
    right:22px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    pointer-events:none;
}

.logo{
    pointer-events:auto;

    padding:13px 18px;

    border-radius:18px;

    background:
        rgba(255,248,235,.82);

    color:#18231e;

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.22);

    font-weight:900;

    letter-spacing:.4px;
}

.controls{
    pointer-events:auto;

    display:flex;
    gap:6px;

    padding:6px;

    border-radius:18px;

    background:
        rgba(255,248,235,.78);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.2);
}

.controls button{
    border:0;

    padding:
        10px
        13px;

    border-radius:13px;

    background:transparent;

    color:#18231e;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.controls button:hover{
    background:#e4d2ae;
}

.controls button.active{
    background:#18231e;
    color:white;
}


/* =====================================================
   OBJECT INFO
===================================================== */

.object-panel{

    position:absolute;

    right:24px;
    bottom:24px;

    width:
        min(
            380px,
            calc(100vw - 48px)
        );

    padding:23px;

    border-radius:25px;

    background:
        rgba(20,31,27,.88);

    border:
        1px solid
        rgba(255,255,255,.14);

    backdrop-filter:
        blur(22px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45);

    transform:
        translateY(
            calc(100% + 50px)
        );

    transition:
        transform .45s
        cubic-bezier(.2,.8,.2,1);

    pointer-events:auto;
}

.object-panel.open{
    transform:
        translateY(0);
}

.object-panel h2{
    font-size:25px;

    margin-bottom:8px;
}

.object-panel p{
    color:#d9e0da;

    line-height:1.55;

    margin-bottom:18px;
}

.close{
    position:absolute;

    right:12px;
    top:9px;

    width:35px;
    height:35px;

    border:0;

    background:transparent;

    color:white;

    font-size:27px;

    cursor:pointer;
}

.panel-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.panel-buttons button{

    border:
        1px solid
        rgba(255,255,255,.12);

    background:#2d4036;

    color:white;

    border-radius:12px;

    padding:
        10px
        13px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.panel-buttons button:hover{

    background:#d5ad68;

    color:#18231e;
}


/* =====================================================
   CENTER MESSAGE
===================================================== */

.center-message{

    position:absolute;

    left:50%;
    bottom:25px;

    transform:
        translateX(-50%);

    padding:
        11px
        17px;

    border-radius:16px;

    background:
        rgba(255,248,235,.8);

    color:#18231e;

    backdrop-filter:
        blur(16px);

    font-size:13px;

    font-weight:800;

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);

    white-space:nowrap;
}


/* =====================================================
   CROSSHAIR
===================================================== */

.crosshair{

    position:absolute;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:white;

    opacity:.4;

    pointer-events:none;
}


/* =====================================================
   NOTIFICATION
===================================================== */

.toast{

    position:absolute;

    top:90px;

    left:50%;

    transform:
        translate(-50%,-15px);

    padding:
        11px
        17px;

    border-radius:14px;

    background:#fff8eb;

    color:#18231e;

    font-weight:850;

    box-shadow:
        0 12px 35px rgba(0,0,0,.25);

    opacity:0;

    transition:.3s;

    pointer-events:none;
}

.toast.visible{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .topbar{

        top:10px;
        left:10px;
        right:10px;

    }

    .logo{

        font-size:12px;

        padding:
            10px
            12px;

    }

    .controls button{

        font-size:10px;

        padding:
            8px
            8px;

    }

    .center-message{

        font-size:10px;

        max-width:
            90vw;

        overflow:hidden;

        text-overflow:ellipsis;

    }

}

</style>
</head>


<body>

<div id="app"></div>


<div class="interface">

    <div class="topbar">

        <div class="logo">
            🏠 APPARTEMENT 03
        </div>

        <div class="controls">

            <button
                class="active"
                onclick="setEnvironment('day',this)">
                ☀️
            </button>

            <button
                onclick="setEnvironment('sunset',this)">
                🌅
            </button>

            <button
                onclick="setEnvironment('night',this)">
                🌙
            </button>

            <button
                onclick="toggleCamera()">
                🎥
            </button>

        </div>

    </div>


    <div
        id="toast"
        class="toast">
    </div>


    <div
        class="crosshair">
    </div>


    <div
        class="center-message">

        🖱️ Déplace la caméra · Clique sur les objets · Explore l'appartement

    </div>


    <div
        id="panel"
        class="object-panel">

        <button
            class="close"
            onclick="closePanel()">
            ×
        </button>

        <h2 id="panelTitle"></h2>

        <p id="panelText"></p>

        <div
            id="panelButtons"
            class="panel-buttons">
        </div>

    </div>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>


<script>

/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0xcaa27c
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        52,
        window.innerWidth /
        window.innerHeight,
        .1,
        100
    );

camera.position.set(
    9,
    6.2,
    11
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.1;

document
    .getElementById("app")
    .appendChild(renderer.domElement);


/* =====================================================
   CONTROLS
===================================================== */

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping=true;

controls.dampingFactor=.06;

controls.minDistance=5;

controls.maxDistance=18;

controls.maxPolarAngle=
    Math.PI*.48;

controls.target.set(
    0,
    2,
    0
);


/* =====================================================
   LIGHTING
===================================================== */

const ambient =
    new THREE.HemisphereLight(
        0xffe9c5,
        0x27332d,
        2.2
    );

scene.add(
    ambient
);


const sun =
    new THREE.DirectionalLight(
        0xffd39b,
        4
    );

sun.position.set(
    -5,
    10,
    5
);

sun.castShadow=true;

sun.shadow.mapSize.set(
    2048,
    2048
);

sun.shadow.camera.left=-15;
sun.shadow.camera.right=15;
sun.shadow.camera.top=15;
sun.shadow.camera.bottom=-15;

scene.add(
    sun
);


/* =====================================================
   MATERIALS
===================================================== */

function material(
    color,
    roughness=.7,
    metalness=0
){

    return new THREE.MeshStandardMaterial({

        color,

        roughness,

        metalness

    });

}


const wallMat =
    material(
        0xe4c9a5
    );

const floorMat =
    material(
        0x765039,
        .85
    );

const woodMat =
    material(
        0x704a32
    );

const darkWoodMat =
    material(
        0x403027
    );

const creamMat =
    material(
        0xe7dfce,
        .9
    );

const greenMat =
    material(
        0x496c54,
        .9
    );

const terracottaMat =
    material(
        0xa86647,
        .9
    );


/* =====================================================
   HELPERS
===================================================== */

function box(
    w,
    h,
    d,
    mat,
    x,
    y,
    z
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            mat
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow=true;

    mesh.receiveShadow=true;

    scene.add(
        mesh
    );

    return mesh;

}


function cylinder(
    radius,
    height,
    mat,
    x,
    y,
    z
){

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                32
            ),
            mat
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow=true;

    mesh.receiveShadow=true;

    scene.add(
        mesh
    );

    return mesh;

}


/* =====================================================
   ROOM
===================================================== */

const room =
    new THREE.Group();

scene.add(
    room
);


/* floor */

const floor =
    box(
        18,
        .3,
        14,
        floorMat,
        0,
        -.15,
        0
    );


/* back wall */

box(
    18,
    8,
    .25,
    wallMat,
    0,
    4,
    -6
);


/* left wall */

box(
    .25,
    8,
    14,
    wallMat,
    -9,
    4,
    0
);


/* =====================================================
   FLOOR BOARDS
===================================================== */

for(
    let x=-8.5;
    x<=8.5;
    x+=.8
){

    const line =
        box(
            .018,
            .012,
            13.8,
            darkWoodMat,
            x,
            .012,
            0
        );

    line.material.opacity=.18;

}


/* =====================================================
   WINDOW
===================================================== */

const windowFrame =
    new THREE.Group();

scene.add(
    windowFrame
);


box(
    9,
    .18,
    .22,
    darkWoodMat,
    1.3,
    5.8,
    -5.75
);

box(
    9,
    .18,
    .22,
    darkWoodMat,
    1.3,
    1.7,
    -5.75
);

box(
    .18,
    4.3,
    .22,
    darkWoodMat,
    -3.0,
    3.75,
    -5.75
);

box(
    .18,
    4.3,
    .22,
    darkWoodMat,
    5.6,
    3.75,
    -5.75
);


/* glass */

const glass =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            8.4,
            4
        ),
        new THREE.MeshBasicMaterial({
            color:0x78b8cf,
            transparent:true,
            opacity:.7
        })
    );

glass.position.set(
    1.3,
    3.75,
    -5.62
);

scene.add(
    glass
);


/* =====================================================
   MOUNTAINS
===================================================== */

function mountain(
    x,
    width,
    height,
    color,
    z
){

    const geo =
        new THREE.ConeGeometry(
            width,
            height,
            5
        );

    const mesh =
        new THREE.Mesh(
            geo,
            material(
                color,
                1
            )
        );

    mesh.position.set(
        x,
        height/2+.8,
        z
    );

    mesh.rotation.y=
        Math.random();

    scene.add(
        mesh
    );

    return mesh;

}


mountain(
    -3,
    3.5,
    4,
    0x567171,
    -5.35
);

mountain(
    .3,
    4,
    5,
    0x405e61,
    -5.3
);

mountain(
    4,
    3.4,
    4.2,
    0x536b6c,
    -5.25
);


/* =====================================================
   SUN
===================================================== */

const sunMesh =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .65,
            32,
            32
        ),
        new THREE.MeshBasicMaterial({
            color:0xffd98d
        })
    );

sunMesh.position.set(
    2.5,
    5.5,
    -5.35
);

scene.add(
    sunMesh
);


/* =====================================================
   SOFA
===================================================== */

const sofa =
    new THREE.Group();

scene.add(
    sofa
);


const sofaBase =
    box(
        6,
        1.4,
        2.2,
        creamMat,
        1.8,
        1.45,
        -1.4
    );

sofa.add(
    sofaBase
);


const back =
    box(
        6,
        2.4,
        .65,
        creamMat,
        1.8,
        2.7,
        -2.2
    );

sofa.add(
    back
);


function cushion(
    x,
    color
){

    const c =
        box(
            1.25,
            .7,
            .55,
            material(color,.95),
            x,
            2.0,
            -2.05
        );

    c.rotation.z=
        (Math.random()-.5)*.15;

    sofa.add(
        c
    );

}


cushion(
    .2,
    0xb77b5c
);

cushion(
    1.8,
    0x58725f
);

cushion(
    3.4,
    0xc8b18c
);


/* =====================================================
   TABLE
===================================================== */

const table =
    new THREE.Group();

scene.add(
    table
);

const top =
    cylinder(
        2,
        .35,
        woodMat,
        -1,
        1.45,
        1.2
    );

table.add(
    top
);

const leg =
    cylinder(
        .25,
        2,
        darkWoodMat,
        -1,
        .45,
        1.2
    );

table.add(
    leg
);


/* =====================================================
   RUG
===================================================== */

const rug =
    box(
        7,
        .05,
        4,
        material(
            0x755347,
            1
        ),
        0,
        .04,
        .9
    );

rug.rotation.y=
    -.08;


/* =====================================================
   BOOKSHELF
===================================================== */

const shelf =
    new THREE.Group();

scene.add(
    shelf
);

box(
    3,
    5,
    .5,
    greenMat,
    -6.8,
    2.5,
    -4.8
);

for(
    let y=1;
    y<5;
    y+=1
){

    box(
        2.6,
        .08,
        .6,
        darkWoodMat,
        -6.8,
        y,
        -4.45
    );

}


/* books */

const bookColors=[
    0xb87853,
    0xd1aa65,
    0x728a71,
    0x96715d,
    0xd5c7a8
];

for(
    let row=0;
    row<4;
    row++
){

    let x=-7.9;

    for(
        let i=0;
        i<5;
        i++
    ){

        const b=
            box(
                .28,
                .72,
                .3,
                material(
                    bookColors[
                        (row+i) %
                        bookColors.length
                    ]
                ),
                x,
                1.42+
                row,
                -4.25
            );

        b.rotation.z=
            (Math.random()-.5)*.12;

        x+=.45;

    }

}


/* =====================================================
   PLANT
===================================================== */

function createPlant(
    x,
    z,
    scale=1
){

    const g=
        new THREE.Group();

    scene.add(g);

    const pot=
        cylinder(
            .65*scale,
            .8*scale,
            terracottaMat,
            x,
            .4*scale,
            z
        );

    g.add(pot);

    for(
        let i=0;
        i<9;
        i++
    ){

        const leaf=
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .35*scale,
                    16,
                    10
                ),
                greenMat
            );

        leaf.scale.y=1.8;

        leaf.position.set(
            x+
            Math.sin(i*2.1)*
            .5*
            scale,

            .9*scale+
            (i%3)*.3,

            z+
            Math.cos(i*1.7)*
            .5*
            scale
        );

        leaf.rotation.z=
            (Math.random()-.5);

        leaf.castShadow=true;

        scene.add(
            leaf
        );

    }

    return g;

}


createPlant(
    7,
    -3.8,
    1.3
);


/* =====================================================
   LAMP
===================================================== */

const lamp =
    new THREE.Group();

scene.add(
    lamp
);

box(
    .12,
    3,
    .12,
    darkWoodMat,
    -3.8,
    3.5,
    1.8
);

const shade =
    new THREE.Mesh(
        new THREE.ConeGeometry(
            .8,
            .8,
            32,
            1,
            true
        ),
        material(
            0x2b302b
        )
    );

shade.position.set(
    -3.8,
    5,
    1.8
);

lamp.add(
    shade
);


const lampLight =
    new THREE.PointLight(
        0xffd98c,
        2,
        7
    );

lampLight.position.set(
    -3.8,
    4.6,
    1.8
);

lamp.add(
    lampLight
);


/* =====================================================
   COFFEE CUP
===================================================== */

const cup =
    cylinder(
        .28,
        .25,
        material(
            0xf0e4d1,
            .9
        ),
        -.25,
        1.78,
        1
    );

cup.userData.interactive=true;
cup.userData.type="coffee";


/* =====================================================
   LAPTOP
===================================================== */

const laptop =
    new THREE.Group();

scene.add(
    laptop
);

box(
    1.4,
    .08,
    .9,
    material(
        0x222622,
        .5,
        .5
    ),
    -1,
    1.8,
    1
);

box(
    1.2,
    .75,
    .06,
    material(
        0x161916,
        .4,
        .6
    ),
    -1,
    2.2,
    .62
);


/* =====================================================
   GUITAR
===================================================== */

const guitar =
    new THREE.Group();

scene.add(
    guitar
);

const body =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .8,
            32,
            20
        ),
        material(
            0xa96040,
            .75
        )
    );

body.scale.set(
    .9,
    1.1,
    .4
);

body.position.set(
    -5,
    .95,
    .5
);

guitar.add(
    body
);

const neck =
    box(
        .25,
        3.3,
        .15,
        darkWoodMat,
        -5,
        2.3,
        .5
    );

neck.rotation.z=
    -.12;

guitar.add(
    neck
);


/* =====================================================
   CAT
===================================================== */

const cat =
    new THREE.Group();

scene.add(
    cat
);

const catBody =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .65,
            24,
            16
        ),
        material(
            0x51443d,
            .95
        )
    );

catBody.scale.set(
    1.4,
    .8,
    .8
);

catBody.position.set(
    3,
    2.35,
    -1.7
);

cat.add(
    catBody
);


const catHead =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .48,
            24,
            16
        ),
        material(
            0x5d4b42,
            .95
        )
    );

catHead.position.set(
    2.45,
    2.65,
    -1.7
);

cat.add(
    catHead
);


/* ears */

function ear(x){

    const e=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .2,
                .45,
                4
            ),
            material(
                0x5d4b42
            )
        );

    e.position.set(
        x,
        3.05,
        -1.7
    );

    cat.add(
        e
    );

}


ear(2.2);
ear(2.7);


/* eyes */

const eyeMat =
    new THREE.MeshBasicMaterial({
        color:0xd7b461
    });

const eye1 =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .055,
            12,
            12
        ),
        eyeMat
    );

eye1.position.set(
    2.28,
    2.72,
    -2.12
);

cat.add(
    eye1
);


const eye2 =
    eye1.clone();

eye2.position.x=
    2.58;

cat.add(
    eye2
);


/* tail */

const tail =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            .55,
            .08,
            12,
            30,
            Math.PI*1.5
        ),
        material(
            0x51443d
        )
    );

tail.position.set(
    3.9,
    2.45,
    -1.65
);

tail.rotation.y=
    Math.PI/2;

cat.add(
    tail
);


/* =====================================================
   INTERACTION SYSTEM
===================================================== */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

const interactiveObjects=[];


function register(
    object,
    type
){

    object.userData.type=
        type;

    interactiveObjects.push(
        object
    );

}


register(
    catBody,
    "cat"
);

register(
    catHead,
    "cat"
);

register(
    cup,
    "coffee"
);

register(
    laptop,
    "computer"
);

register(
    guitar,
    "guitar"
);

register(
    shade,
    "lamp"
);


/* =====================================================
   CLICK
===================================================== */

renderer.domElement.addEventListener(
    "click",
    event => {

        mouse.x=
            (event.clientX/
            window.innerWidth)*2-1;

        mouse.y=
            -(event.clientY/
            window.innerHeight)*2+1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const hits =
            raycaster.intersectObjects(
                interactiveObjects,
                true
            );

        if(
            !hits.length
        ) return;

        const object=
            hits[0].object;

        interact(
            object.userData.type
        );

    }
);


/* =====================================================
   INTERACTIONS
===================================================== */

function interact(type){

                        cat.rotation.y+=.35;
                        toast(
                            "😺 Prrrrrrrr..."
                        );
                    }
                ],
                [
                    "🥩 Friandise",
                    ()=>{
                        cat.position.x+=.15;
                        toast(
                            "🐈 Miam !"
                        );
                    }
                ]
            ]
        );

    }


    if(type==="coffee"){

        openPanel(
            "☕ Café",

            [
                [
                    "☕ Préparer",
                    ()=>{
                        toast(
                            "☕ Café en préparation..."
                        );
                    }
                ]
            ]
        );

    }


    if(type==="computer"){

        openPanel(
            "💻 Ordinateur",
            "Ton espace de travail est prêt.",
            [
                [
                    "🖥️ Ouvrir",
                    ()=>{
                        toast(
                            "💻 Interface ouverte"
                        );
                    }
                ],
                [
                    "📷 Galerie",
                    ()=>{
                        toast(
                            "📷 Galerie ouverte"
                        );
                    }
                ]
            ]
        );

    }


    if(type==="guitar"){

        openPanel(
            "🎸 Guitare",
            "Une guitare attend sur le côté de la pièce.",
            [
                [
                    "🎵 Jouer",
                    ()=>{
                        toast(
                            "🎵 Quelques accords résonnent..."
                        );
                    }
                ]
            ]
        );

    }


    if(type==="lamp"){

        openPanel(
            "💡 Lampe",
            "L'éclairage chaud transforme complètement l'atmosphère.",
            [

                    "💡 Allumer",
                    ()=>{

                    "🌑 Éteindre",

/* =====================================================
   PANEL
===================================================== */

function openPanel(
    title,
    text,
    buttons=[]
){

    document
        .getElementById(
            "panelTitle"
        )
        .textContent=
        title;

    document
        .getElementById(
            "panelText"
        )
        .textContent=
        text;

    const container =
        document
        .getElementById(
            "panelButtons"
        );

    container.innerHTML="";

    buttons.forEach(
        ([label,fn])=>{

            const b=
                document.createElement(
                    "button"
                );

            b.textContent=
                label;

            b.onclick=
                fn;

            container.appendChild(
                b
            );

        }
    );

    document
        .getElementById(
            "panel"
        )
        .classList
        .add("open");

}


function closePanel(){

    document
        .getElementById(
            "panel"
        )
        .classList
        .remove("open");

}


/* =====================================================
   ENVIRONMENT
===================================================== */

function setEnvironment(
    mode,
    button
){

    document
        .querySelectorAll(
            ".controls button"
        )
        .forEach(
            b=>
            b.classList.remove(
                "active"
            )
        );

    if(button)
        button.classList.add(
            "active"
        );


    if(mode==="day"){

        sun.intensity=4;

        ambient.intensity=2.2;

        scene.background=
            new THREE.Color(
                0xcaa27c
            );

        lampLight.intensity=
            1;

    }


    if(mode==="sunset"){

        sun.intensity=2.2;

        sun.color.set(
            0xff9c5a
        );

        ambient.intensity=1.3;

        scene.background=
            new THREE.Color(
                0x8b5848
            );

        lampLight.intensity=
            2.5;

    }


    if(mode==="night"){

        sun.intensity=.25;

        sun.color.set(
            0x718bc4
        );

        ambient.intensity=.45;

        scene.background=
            new THREE.Color(
                0x101923
            );

        lampLight.intensity=
            3.5;

    }

}


/* =====================================================
   CAMERA
===================================================== */

let cameraMode=false;

function toggleCamera(){

    cameraMode=
        !cameraMode;

    controls.enabled=
        !cameraMode;

    toast(
        cameraMode
        ?
        "🎥 Mode caméra libre"
        :
        "🖱️ Mode exploration"
    );

}


/* =====================================================
   ANIMATION
===================================================== */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const t=
        clock.getElapsedTime();


    /* chat breathing */

    catBody.scale.y=
        .8+
        Math.sin(t*2)*.015;


    /* tail */

    tail.rotation.z=
        Math.sin(t*1.7)*.18;


    /* subtle plant movement */

    /* camera */

    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
