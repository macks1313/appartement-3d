*{

html,body{

.title{
    padding:15px 21px;

.modes{

}

.modes button.active{

}

.help{

    left:50%;
    bottom:20px;
    transform:translateX(-50%);

    max-width:calc(100% - 35px);
    padding:13px 20px;
    border-radius:20px;
    background:rgba(244,239,226,.9);
    color:#18231f;
    font-size:13px;
    font-weight:800;

}

.panel{
    position:absolute;
    left:18px;
    right:18px;
    bottom:85px;
    max-width:430px;
    margin:auto;
    padding:22px;
    border-radius:27px;
    background:rgba(24,35,31,.94);
    color:white;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.12);
    transform:translateY(150%);

    pointer-events:auto;
}

.panel.open{
    transform:translateY(0);
}

.panel h2{
    font-size:24px;
    margin-bottom:7px;
}

.panel p{
    color:#d7ded8;
    line-height:1.5;
    margin-bottom:17px;
}

.close{

    right:12px;
    top:10px;
    border:0;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;

.actions button{
    border:0;
    padding:11px 14px;
    border-radius:13px;
    background:#d5b478;
    color:#17211d;
    font-weight:850;
    cursor:pointer;

.toast{
    position:absolute;
    top:85px;
    left:50%;
    transform:translate(-50%,-15px);

    border-radius:16px;
    background:#f4efe2;
    color:#18231f;

function cube(

    material,
    x,y,z
){

    m.castShadow=true;
    m.receiveShadow=true;

}


function cyl(
    radius,
    height,
    material,
    x,y,z,
    segments=32
){

            material
        );

    m.position.set(x,y,z);

    m.castShadow=true;
    m.receiveShadow=true;

    scene.add(m);

    return m;
}

        z

            Math.sin(i*1.8)*.55*s,

            Math.cos(i*1.7)*.45*s
        );

        leaf.rotation.z=
            (Math.random()-.5);

        leaf.castShadow=true;

        scene.add(leaf);
    }

/* =========================================================
   CLIC / TOUCH
========================================================= */

const raycaster=
    new THREE.Raycaster();

const pointer=
    new THREE.Vector2();

function pointerDown(event){

    const rect=
        renderer.domElement
        .getBoundingClientRect();

    const clientX=
        event.clientX ??
        event.touches?.[0]?.clientX;

    const clientY=
        event.clientY ??
        event.touches?.[0]?.clientY;

    if(clientX==null)return;

    pointer.x=
        ((clientX-rect.left)/rect.width)*2-1;

    pointer.y=
        -((clientY-rect.top)/rect.height)*2+1;

    raycaster.setFromCamera(
        pointer,
        camera
    );

    const hits=
        raycaster.intersectObjects(
            interactive,
            true
        );

    if(!hits.length)return;

    interact(
        hits[0].object.userData.type
    );
}

renderer.domElement.addEventListener(
    "pointerup",
    pointerDown
);

    if(type==="computer"){

        panel(
            "💻 Ordinateur",
            "Ton espace de travail donne directement sur la baie vitrée.",
            [
                [
                    "💻 Travailler",
                    ()=>{
                        toast(
                            "⌨️ Session de travail lancée."
                        );
                    }
                ],
                [
                    "🎵 Musique",
                    ()=>{
                        toast(
                            "🎵 Playlist lancée."
                        );
                    }
                ]
            ]
        );

    }


    if(type==="guitar"){

        panel(
            "🎸 Guitare",
            "Une vieille guitare en bois est posée près de la bibliothèque.",
            [
                [
                    "🎵 Jouer",
                    ()=>{
                        toast(
                            "🎶 Quelques accords résonnent dans la pièce."
                        );
                    }
                ]
            ]
        );

    }


    if(type==="lamp"){

        panel(
            "💡 Lampe",
            "Cette lampe crée une lumière chaude et transforme complètement l'ambiance.",
            [
                [
                    "💡 Allumer",
                    ()=>{
                        lampLight.intensity=4;
                        toast("💡 Lumière allumée.");
                    }
                ],
                [
                    "🌑 Éteindre",
                    ()=>{
                        lampLight.intensity=0;
                        toast("🌑 Lumière éteinte.");
                    }
                ]
            ]
        );

    }


    if(type==="book"){

        panel(
            "📖 Livre",
            "Un livre abandonné sur la table basse.",
            [
                [
                    "📖 Lire",
                    ()=>{
                        toast(
                            "📚 Tu commences à lire..."
                        );
                    }
                ]
            ]
        );

    }

}


/* =========================================================
   PANNEAU
========================================================= */

function panel(
    title,
    text,
    buttons
){

    document
        .getElementById("panelTitle")
        .textContent=title;

    document
        .getElementById("panelText")
        .textContent=text;

    const actions=
        document.getElementById(
            "actions"
        );

    actions.innerHTML="";

    buttons.forEach(
        ([label,fn])=>{

            const button=
                document.createElement(
                    "button"
                );

            button.textContent=label;

            button.onclick=fn;

            actions.appendChild(
                button
            );

        }
    );

    document
        .getElementById("panel")
        .classList.add("open");
}


function closePanel(){

    document
        .getElementById("panel")
        .classList.remove("open");
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

    const el=
        document.getElementById(
            "toast"
        );

    el.textContent=message;

    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=
        setTimeout(()=>{
            el.classList.remove("show");
        },2300);
}


/* =========================================================
   AMBIANCES
========================================================= */

function environment(
    mode,
    button
){

    document
        .querySelectorAll(
            ".modes button"
        )
        .forEach(
            b=>b.classList.remove("active")
        );

    button.classList.add("active");


    if(mode==="day"){

        scene.background=
            new THREE.Color(
                0xc8a982
            );

        ambient.intensity=2.4;

        sun.intensity=4;

        sun.color.set(
            0xffd5a0
        );

        lampLight.intensity=1;

        sunDisk.visible=true;

    }


    if(mode==="sunset"){

        scene.background=
            new THREE.Color(
                0x825649
            );

        ambient.intensity=1.25;

        sun.intensity=2;

        sun.color.set(
            0xff8554
        );

        lampLight.intensity=2.7;

        sunDisk.visible=true;

    }


    if(mode==="night"){

        scene.background=
            new THREE.Color(
                0x0e1821
            );

        ambient.intensity=.5;

        sun.intensity=.2;

        sun.color.set(
            0x657da9
        );

        lampLight.intensity=4;

        sunDisk.visible=false;

    }

}


/* =========================================================
   RESET CAMERA
========================================================= */

function resetCamera(){

    camera.position.set(
        9,
        5.7,
        10
    );

    controls.target.set(
        0,
        2.2,
        -1
    );

    controls.update();

    toast(
        "🎥 Vue de départ restaurée."
    );
}


/* =========================================================
   ANIMATION
========================================================= */

const clock=
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const t=
        clock.getElapsedTime();


    /* respiration du chat */

    catBody.scale.y=
        .8+
        Math.sin(t*2)*.012;


    /* queue */

    tail.rotation.z=
        Math.sin(t*1.8)*.12;


    /* légère oscillation des plantes */

    scene.traverse(
        object=>{

            if(
                object.geometry &&
                object.geometry.type===
                "SphereGeometry" &&
                object!==catBody &&
                object!==catHead
            ){

                object.rotation.z+=
                    Math.sin(t*.5)*.00015;

            }

        }
    );


    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>
