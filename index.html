<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111214">

<title>Kitchen Copilot</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#101114;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    max-width:900px;
    margin:auto;
    min-height:100vh;
    padding-bottom:100px;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(16,17,20,.95);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #292c31;
    padding:15px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:950;
}

.logo span{
    color:#ff7900;
}

.restaurant{
    color:#8f939c;
    font-size:13px;
    margin-top:2px;
}

/* NAV */

.nav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    padding:10px 14px;
}

.nav button{
    border:0;
    border-radius:13px;
    padding:11px 4px;
    background:#202328;
    color:#999da5;
    font-weight:850;
}

.nav button.active{
    background:#ff7900;
    color:white;
}

/* GENERAL */

.content{
    padding:4px 15px 20px;
}

.sectionHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin:18px 0 12px;
}

.sectionHeader h2{
    margin:0;
    font-size:19px;
}

.smallButton{
    border:0;
    border-radius:11px;
    background:#272a30;
    color:#fff;
    padding:9px 12px;
    font-weight:800;
}

/* QUICK GRID */

.quickGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

/* TIMER BUTTONS */

.timerButton{
    border:1px solid #30343b;
    background:linear-gradient(145deg,#202329,#181a1e);
    color:#fff;
    border-radius:19px;
    min-height:145px;
    padding:15px;
    text-align:left;
    position:relative;
}

.timerButton:active{
    transform:scale(.98);
}

.timerEmoji{
    font-size:42px;
}

.timerName{
    font-size:17px;
    font-weight:950;
    margin-top:5px;
}

.timerDuration{
    color:#92969f;
    font-size:13px;
    margin-top:3px;
}

.editIcon{
    position:absolute;
    top:10px;
    right:10px;
    border:0;
    background:#2c2f35;
    color:#fff;
    width:34px;
    height:34px;
    border-radius:10px;
}

/* ACTIVE TIMER */

.activeGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.activeCard{
    background:#181a1e;
    border:1px solid #34373e;
    border-radius:18px;
    padding:14px;
}

.activeTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.activeEmoji{
    font-size:30px;
}

.activeName{
    font-weight:900;
    margin-top:4px;
}

.activeTime{
    font-size:37px;
    font-weight:950;
    margin:8px 0;
}

.activeActions{
    display:flex;
    gap:7px;
}

.activeActions button{
    flex:1;
    border:0;
    border-radius:10px;
    padding:9px;
    background:#2b2e34;
    color:#fff;
    font-weight:800;
}

/* PRODUCTS */

.productGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.productCard{
    background:#1b1d21;
    border:1px solid #2c2f35;
    border-radius:17px;
    padding:13px;
    position:relative;
}

.productEmoji{
    font-size:30px;
}

.productName{
    font-weight:900;
    margin:4px 0 10px;
}

.productActions{
    display:flex;
    gap:6px;
}

.refillButton{
    flex:1;
    border:0;
    border-radius:10px;
    padding:9px 5px;
    background:#292c32;
    color:#fff;
    font-weight:850;
}

.productEdit{
    border:0;
    border-radius:10px;
    background:#292c32;
    color:#fff;
    width:42px;
}

/* TO DO LIST */

.todoList{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.todoItem{
    display:flex;
    align-items:center;
    gap:10px;
    background:#1b1d21;
    border:1px solid #2d3036;
    border-radius:14px;
    padding:11px;
}

.todoEmoji{
    font-size:25px;
}

.todoName{
    flex:1;
    font-weight:850;
}

.doneButton{
    border:0;
    background:#263c2b;
    color:#7cf09c;
    border-radius:9px;
    padding:8px 10px;
    font-weight:850;
}

/* CHECKLIST */

.checklist{
    background:#191b1f;
    border:1px solid #2b2e34;
    border-radius:18px;
    padding:14px;
    margin-bottom:10px;
}

.checkHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
}

.checkHeader strong{
    font-size:17px;
}

.task{
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #292c31;
    padding:11px 0;
}

.task:last-child{
    border-bottom:0;
}

.checkbox{
    width:26px;
    height:26px;
    border:2px solid #666a72;
    border-radius:8px;
    display:grid;
    place-items:center;
    flex:none;
}

.task.checked .checkbox{
    background:#ff7900;
    border-color:#ff7900;
}

.task.checked .taskText{
    color:#777;
    text-decoration:line-through;
}

.taskText{
    flex:1;
}

/* RECIPES */

.recipe{
    background:#191b1f;
    border:1px solid #2b2e34;
    border-radius:18px;
    padding:15px;
    margin-bottom:10px;
}

.recipeHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.recipeName{
    font-size:17px;
    font-weight:900;
}

.recipeText{
    color:#999da5;
    margin-top:10px;
    line-height:1.5;
    white-space:pre-wrap;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:flex-end;
    z-index:100;
}

.modal.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:900px;
    margin:auto;
    max-height:93vh;
    overflow:auto;
    background:#1b1d21;
    border-radius:25px 25px 0 0;
    padding:20px;
}

.sheet h2{
    margin:0 0 18px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:#a0a4ac;
    font-size:13px;
    margin-bottom:6px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #383b43;
    border-radius:11px;
    background:#101114;
    color:white;
    padding:12px;
    outline:none;
}

textarea{
    min-height:120px;
}

.primary{
    width:100%;
    border:0;
    border-radius:12px;
    background:#ff7900;
    color:white;
    padding:13px;
    font-weight:900;
}

.secondary{
    width:100%;
    border:0;
    border-radius:12px;
    background:#2a2d33;
    color:white;
    padding:12px;
    margin-top:8px;
    font-weight:800;
}

.danger{
    width:100%;
    border:0;
    border-radius:12px;
    background:#45201e;
    color:#ff7770;
    padding:12px;
    margin-top:8px;
    font-weight:800;
}

/* FAB */

.fab{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:80;
    width:62px;
    height:62px;
    border:0;
    border-radius:50%;
    background:#ff7900;
    color:white;
    font-size:32px;
    box-shadow:0 8px 30px #000c;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:white;
    color:#111;
    border-radius:12px;
    padding:11px 16px;
    font-weight:850;
    display:none;
    z-index:200;
}

/* EMPTY */

.empty{
    padding:30px 15px;
    text-align:center;
    color:#777b84;
    background:#191b1f;
    border-radius:17px;
}

/* MOBILE */

@media(max-width:520px){

    .quickGrid,
    .activeGrid{
        grid-template-columns:1fr 1fr;
    }

    .productGrid{
        grid-template-columns:1fr 1fr;
    }

    .timerButton{
        min-height:135px;
    }

    .timerEmoji{
        font-size:35px;
    }

    .activeTime{
        font-size:31px;
    }

    .nav button{
        font-size:11px;
    }

}

@media(min-width:700px){

    .quickGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .productGrid{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="header">

<div>

<div class="logo">
Kitchen <span>Copilot</span>
</div>

<div class="restaurant" id="restaurantName">
Cuisine · Anastasiia
</div>

</div>

<button
class="smallButton"
onclick="openSettings()"
>
⚙️
</button>

</div>

</header>


<nav class="nav">

<button
class="active"
onclick="page('service',this)"
>
🔥 Service
</button>

<button
onclick="page('products',this)"
>
🛒 Produits
</button>

<button
onclick="page('lists',this)"
>
📋 Checklists
</button>

<button
onclick="page('recipes',this)"
>
🍳 Prépas
</button>

</nav>


<main class="content">


<!-- ==================================================
SERVICE
================================================== -->

<section id="service">

<div class="sectionHeader">

<h2>⚡ Cuissons rapides</h2>

<button
class="smallButton"
onclick="editTimer()"
>
＋ Ajouter
</button>

</div>

<div
id="timerButtons"
class="quickGrid"
></div>


<div class="sectionHeader">

<h2>⏱️ En cours</h2>

</div>

<div
id="activeTimers"
class="activeGrid"
></div>

</section>


<!-- ==================================================
PRODUITS
================================================== -->

<section
id="products"
style="display:none"
>

<div class="sectionHeader">

<h2>🛒 Produits</h2>

<button
class="smallButton"
onclick="editProduct()"
>
＋ Produit
</button>

</div>


<div
id="productsGrid"
class="productGrid"
></div>


<div class="sectionHeader">

<h2>🔴 À refaire</h2>

</div>

<div
id="refillList"
class="todoList"
></div>

</section>


<!-- ==================================================
CHECKLISTS
================================================== -->

<section
id="lists"
style="display:none"
>

<div class="sectionHeader">

<h2>📋 Checklists</h2>

<button
class="smallButton"
onclick="editChecklist()"
>
＋ Liste
</button>

</div>

<div
id="checklists"
></div>

</section>


<!-- ==================================================
RECETTES
================================================== -->

<section
id="recipes"
style="display:none"
>

<div class="sectionHeader">

<h2>🍳 Préparations</h2>

<button
class="smallButton"
onclick="editRecipe()"
>
＋ Prépa
</button>

</div>

<div
id="recipesContainer"
></div>

</section>

</main>


<button
class="fab"
onclick="quickAdd()"
>
+
</button>

</div>


<div
id="modal"
class="modal"
>
<div
id="sheet"
class="sheet"
></div>
</div>


<div
id="toast"
class="toast"
></div>


<script>

/* ======================================================
DONNÉES
====================================================== */

const STORAGE_KEY =
"kitchen_copilot_anastasiia_v3";


const DEFAULT_DATA = {

settings:{
    name:"Anastasiia",
    subtitle:"Cuisine"
},


timers:[

{
    id:"t1",
    emoji:"🥩",
    name:"Steak saignant",
    duration:180,
    alarms:[
        {before:60,sound:"double"},
        {before:0,sound:"long"}
    ]
},

{
    id:"t2",
    emoji:"🍟",
    name:"Frites",
    duration:210,
    alarms:[
        {before:30,sound:"double"},
        {before:0,sound:"long"}
    ]
},

{
    id:"t3",
    emoji:"🍔",
    name:"Burger",
    duration:300,
    alarms:[
        {before:60,sound:"beep"},
        {before:0,sound:"long"}
    ]
},

{
    id:"t4",
    emoji:"🍗",
    name:"Poulet",
    duration:480,
    alarms:[
        {before:60,sound:"double"},
        {before:0,sound:"long"}
    ]
},

{
    id:"t5",
    emoji:"🥚",
    name:"Œuf mollet",
    duration:360,
    alarms:[
        {before:30,sound:"beep"},
        {before:0,sound:"long"}
    ]
},

{
    id:"t6",
    emoji:"🥓",
    name:"Bacon",
    duration:240,
    alarms:[
        {before:30,sound:"beep"},
        {before:0,sound:"long"}
    ]
}

],


products:[

{
    id:"p1",
    emoji:"🥫",
    name:"Sauce 1",
    refill:false
},

{
    id:"p2",
    emoji:"🥫",
    name:"Sauce 2",
    refill:false
},

{
    id:"p3",
    emoji:"🥫",
    name:"Sauce 3",
    refill:false
},

{
    id:"p4",
    emoji:"🥫",
    name:"Sauce 4",
    refill:false
},

{
    id:"p5",
    emoji:"🍅",
    name:"Sauce tomate",
    refill:false
},

{
    id:"p6",
    emoji:"🌶️",
    name:"Sauce piquante",
    refill:false
},

{
    id:"p7",
    emoji:"🧅",
    name:"Oignons",
    refill:false
},

{
    id:"p8",
    emoji:"🥒",
    name:"Pickles",
    refill:false
}

],


checklists:[

{
    id:"c1",
    name:"🌅 Ouverture",
    tasks:[
        {id:"1",text:"Allumer les fours",done:false},
        {id:"2",text:"Vérifier les frigos",done:false},
        {id:"3",text:"Préparer la mise en place",done:false},
        {id:"4",text:"Sortir les sauces",done:false}
    ]
},

{
    id:"c2",
    name:"🌙 Fermeture",
    tasks:[
        {id:"1",text:"Nettoyer le plan de travail",done:false},
        {id:"2",text:"Nettoyer la friteuse",done:false},
        {id:"3",text:"Ranger les produits",done:false},
        {id:"4",text:"Sortir les poubelles",done:false},
        {id:"5",text:"Éteindre les appareils",done:false}
    ]
}

],


recipes:[

{
    id:"r1",
    emoji:"🥫",
    name:"Sauce maison",
    notes:"Ajouter ici les ingrédients et la méthode."
}

],


active:[]

};


let data =
JSON.parse(
    localStorage.getItem(STORAGE_KEY)
)
||
structuredClone(DEFAULT_DATA);


let audioContext = null;


/* ======================================================
UTILITAIRES
====================================================== */

function $(id){
    return document.getElementById(id);
}


function uid(){
    return Date.now().toString(36)
    +
    Math.random()
    .toString(36)
    .slice(2);
}


function save(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


function escapeHTML(value){

    return String(value ?? "")
    .replace(/[&<>"']/g,function(char){

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char];

    });

}


function formatTime(seconds){

    seconds=Math.max(
        0,
        Math.ceil(seconds)
    );

    return String(
        Math.floor(seconds/60)
    ).padStart(2,"0")
    +
    ":"
    +
    String(
        seconds%60
    ).padStart(2,"0");
}


function toast(message){

    $("toast").textContent=message;

    $("toast").style.display="block";

    setTimeout(function(){

        $("toast").style.display="none";

    },1800);

}


/* ======================================================
NAVIGATION
====================================================== */

function page(id,button){

    [
        "service",
        "products",
        "lists",
        "recipes"
    ]
    .forEach(function(section){

        $(section).style.display =
        section===id
        ?
        "block"
        :
        "none";

    });


    document
    .querySelectorAll(".nav button")
    .forEach(function(button){

        button.classList.remove("active");

    });


    button.classList.add("active");

}


/* ======================================================
MODAL
====================================================== */

function openModal(content){

    $("sheet").innerHTML=content;

    $("modal").classList.add("show");

}


function closeModal(){

    $("modal").classList.remove("show");

}


/* ======================================================
CUISSONS
====================================================== */

function renderTimers(){

    $("timerButtons").innerHTML =
    data.timers.map(function(timer){

        return `

        <button
            class="timerButton"
            onclick="startTimer('${timer.id}')"
        >

            <div class="timerEmoji">

                ${escapeHTML(timer.emoji)}

            </div>

            <div class="timerName">

                ${escapeHTML(timer.name)}

            </div>

            <div class="timerDuration">

                ${formatTime(timer.duration)}

            </div>


            <button
                class="editIcon"
                onclick="event.stopPropagation();editTimer('${timer.id}')"
            >

                ✏️

            </button>

        </button>

        `;

    }).join("");


    if(!data.active.length){

        $("activeTimers").innerHTML=`

        <div
            class="empty"
            style="grid-column:1/-1"
        >

            ⏱️ Aucun minuteur en cours

        </div>

        `;

        return;

    }


    $("activeTimers").innerHTML =
    data.active.map(function(timer){

        return `

        <div class="activeCard">

            <div class="activeTop">

                <div class="activeEmoji">

                    ${escapeHTML(timer.emoji)}

                </div>

            </div>


            <div class="activeName">

                ${escapeHTML(timer.name)}

            </div>


            <div class="activeTime">

                ${formatTime(timer.remaining)}

            </div>


            <div class="activeActions">

                <button
                    onclick="pauseTimer('${timer.id}')"
                >

                    ${timer.paused
                    ?"▶️"
                    :"⏸️"}

                </button>

                <button
                    onclick="deleteActive('${timer.id}')"
                >

                    ✕

                </button>

            </div>

        </div>

        `;

    }).join("");

}


function startTimer(id){

    const timer =
    data.timers.find(
        timer=>timer.id===id
    );

    if(!timer)return;


    data.active.push({

        id:uid(),

        emoji:timer.emoji,

        name:timer.name,

        duration:timer.duration,

        remaining:timer.duration,

        alarms:
        timer.alarms.map(
            alarm=>({...alarm})
        ),

        fired:[],

        paused:false,

        finished:false

    });


    save();

    render();

    toast(
        timer.emoji+
        " "+
        timer.name+
        " lancé"
    );

}


function pauseTimer(id){

    const timer =
    data.active.find(
        timer=>timer.id===id
    );

    if(!timer)return;

    timer.paused=
    !timer.paused;

    save();

    renderTimers();

}


function deleteActive(id){

    data.active =
    data.active.filter(
        timer=>timer.id!==id
    );

    save();

    renderTimers();

}


/* ======================================================
MODIFICATION CUISSON
====================================================== */

function editTimer(id=null){

    const timer =
    data.timers.find(
        timer=>timer.id===id
    );


    const alarms =
    timer?.alarms || [];


    openModal(`

        <h2>

            ${timer
            ?"✏️ Modifier la cuisson"
            :"➕ Nouvelle cuisson"}

        </h2>


        <div class="field">

            <label>Emoji</label>

            <input
                id="timerEmoji"
                value="${escapeHTML(timer?.emoji||"🍔")}"
            >

        </div>


        <div class="field">

            <label>Nom</label>

            <input
                id="timerName"
                value="${escapeHTML(timer?.name||"")}"
                placeholder="Ex : Burger"
            >

        </div>


        <div class="field">

            <label>Durée en secondes</label>

            <input
                id="timerDuration"
                type="number"
                min="1"
                value="${timer?.duration||300}"
            >

        </div>


        <h3>🔔 Sonneries</h3>


        <div class="field">

            <label>
                Sonnerie 1 — secondes avant la fin
            </label>

            <input
                id="alarm0"
                type="number"
                min="0"
                value="${alarms[0]?.before??""}"
                placeholder="Ex : 60"
            >

        </div>


        <div class="field">

            <label>Type</label>

            <select id="sound0">

                <option value="beep">
                    🔔 Bip
                </option>

                <option
                    value="double"
                    ${alarms[0]?.sound==="double"
                    ?"selected"
                    :""}
                >
                    🔔🔔 Double bip
                </option>

                <option
                    value="long"
                    ${alarms[0]?.sound==="long"
                    ?"selected"
                    :""}
                >
                    📢 Bip long
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Sonnerie 2 — secondes avant la fin
            </label>

            <input
                id="alarm1"
                type="number"
                min="0"
                value="${alarms[1]?.before??""}"
                placeholder="Ex : 30"
            >

        </div>


        <div class="field">

                <option
                    value="long"
                    ${alarms[2]?.sound==="long"
                    ?"selected"
                    :""}
                >
                    📢 Bip long

function saveTimer(id){

    const name =
    $("timerName").value.trim();

    const emoji =
    $("timerEmoji").value.trim()
    ||
    "🍔";

    const duration =
    Number(
        $("timerDuration").value
    );


    if(!name || duration<=0){

        toast("Nom et durée obligatoires");

        return;

    }


    const alarms=[];


    if($("alarm0").value!==""){

        alarms.push({

            before:
            Number(
                $("alarm0").value
            ),

            sound:
            $("sound0").value

        });

    }


    if($("alarm1").value!==""){

        alarms.push({

            before:
            Number(
                $("alarm1").value
            ),

            sound:
            $("sound1").value

        });

    }


    /*
    La sonnerie finale est automatique
    si aucune alarme à 0 n'existe.
    */

    if(!alarms.some(
        alarm=>alarm.before===0
    )){

        alarms.push({

            before:0,

            sound:$("sound2").value

        });

    }


    if(id){

        const timer =
        data.timers.find(
            timer=>timer.id===id
        );


        Object.assign(
            timer,
            {
                name,
                emoji,
                duration,
                alarms
            }
        );

    }else{

        data.timers.push({

            id:uid(),

            name,

            emoji,

            duration,

            alarms

        });

    }


    save();

    closeModal();

    render();

}


function deleteTimer(id){

    data.timers =
    data.timers.filter(
        timer=>timer.id!==id
    );

    save();

    closeModal();

    render();

}

/* ======================================================
SON
====================================================== */

function playSound(type){

    try{

        audioContext =
        audioContext
        ||
        new AudioContext();


        const count =
        type==="double"
        ?
        2
        :
        1;


        for(
            let i=0;
            i<count;
            i++
        ){

            const oscillator =
            audioContext
            .createOscillator();


            const gain =
            audioContext
            .createGain();


            oscillator.frequency.value =
            type==="long"
            ?
            620
            :
            880;


            gain.gain.value=.12;


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            const start =
            audioContext.currentTime
            +
            i*.18;


            oscillator.start(start);


            oscillator.stop(
                start+
                (
                    type==="long"
                    ?
                    1
                    :
                    .25
                )
            );

        }

    }catch(error){}

}


/* ======================================================
MINUTEURS
====================================================== */

function tick(){

    let changed=false;


    data.active.forEach(function(timer){

        if(timer.paused)return;


        const previous =
        timer.remaining;


        timer.remaining =
        Math.max(
            0,
            timer.remaining-.5
        );


        timer.alarms.forEach(
            function(alarm,index){

                if(
                    !timer.fired.includes(index)
                    &&
                    previous>alarm.before
                    &&
                    timer.remaining<=alarm.before
                ){

                    timer.fired.push(index);


                    playSound(
                        alarm.sound
                    );


                    toast(
                        timer.emoji+
                        " "+
                        timer.name+
                        " 🔔"
                    );

                }

            }
        );


        if(
            timer.remaining===0
            &&
            !timer.finished
        ){

            timer.finished=true;


            playSound("long");


            if(navigator.vibrate){

                navigator.vibrate([
                    500,
                    200,
                    500
                ]);

            }


            toast(
                timer.emoji+
                " "+
                timer.name+
                " terminé !"
            );

        }


        if(
            previous!==timer.remaining
        ){

            changed=true;

        }

    });


    if(changed){

        save();

        renderTimers();

    }

}
