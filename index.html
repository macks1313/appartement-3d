<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Appartement–3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#11151c;
}

body{
    color:#fff;
}

/* =========================================================
   SCENE
========================================================= */

#scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(
            180deg,
            #182334 0%,
            #684d4b 42%,
            #d98a55 67%,
            #f0c28a 100%
        );
}

/* ciel */

.sky{
    position:absolute;
    inset:0 0 42% 0;
    background:
        radial-gradient(
            circle at 75% 70%,
            rgba(255,213,133,.95) 0 5%,
            rgba(255,166,88,.35) 12%,
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #18202d,
            #39485a 45%,
            #b86754 78%,
            #e7a269
        );
}

/* soleil */

.sun{
    position:absolute;
    width:150px;
    height:150px;
    right:19%;
    top:24%;
    border-radius:50%;
    background:#ffd995;
    box-shadow:
        0 0 35px #ffca75,
        0 0 100px rgba(255,170,80,.6);
    opacity:.95;
}

/* montagnes */

.mountains{
    position:absolute;
    left:0;
    right:0;
    bottom:38%;
    height:24%;
}

.mountain{
    position:absolute;
    bottom:0;
    width:55%;
    height:100%;
    background:#293743;
    clip-path:polygon(
        0 100%,
        20% 54%,
        30% 69%,
        43% 32%,
        57% 67%,
        72% 42%,
        100% 100%
    );
    opacity:.8;
}

.mountain:nth-child(1){
    left:-10%;
}

.mountain:nth-child(2){
    right:-10%;
    transform:scaleX(-1);
    opacity:.65;
}

.mountain:nth-child(3){
    left:27%;
    bottom:-8%;
    transform:scale(.75);
    opacity:.45;
}

/* =========================================================
   APPARTEMENT
========================================================= */

.apartment{
    position:absolute;
    left:50%;
    top:52%;
    width:min(1100px,100vw);
    height:min(680px,72vh);
    transform:translate(-50%,-50%);
    perspective:1100px;
}

/* sol */

.floor{
    position:absolute;
    left:4%;
    right:4%;
    bottom:4%;
    height:48%;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(90,51,29,.08) 0 2px,
            transparent 2px 120px
        ),
        linear-gradient(
            145deg,
            #a87851,
            #d3a071 45%,
            #8c5e40
        );
    transform:rotateX(58deg);
    transform-origin:bottom;
    border-radius:8px;
    box-shadow:0 -20px 60px rgba(0,0,0,.3);
}

/* mur gauche */

.wall-left{
    position:absolute;
    left:4%;
    top:5%;
    width:24%;
    height:65%;
    background:
        linear-gradient(
            90deg,
            #514237,
            #766051
        );
    transform:skewY(-10deg);
    transform-origin:right;
    box-shadow:inset -20px 0 30px rgba(0,0,0,.3);
}

/* mur droit */

.wall-right{
    position:absolute;
    right:4%;
    top:5%;
    width:24%;
    height:65%;
    background:
        linear-gradient(
            90deg,
            #766051,
            #40352f
        );
    transform:skewY(10deg);
    transform-origin:left;
}

/* mur arrière */

.back-wall{
    position:absolute;
    left:20%;
    right:20%;
    top:5%;
    height:60%;
    background:
        linear-gradient(
            180deg,
            #d7b998,
            #c5a383
        );
    box-shadow:
        inset 0 -20px 50px rgba(70,40,25,.22);
}

/* =========================================================
   BAIE VITRÉE
========================================================= */

.window{
    position:absolute;
    left:32%;
    top:10%;
    width:38%;
    height:54%;
    border:12px solid #342c28;
    background:
        linear-gradient(
            180deg,
            #43596b,
            #e19a68 72%,
            #ffcc8c
        );
    box-shadow:
        0 15px 35px rgba(0,0,0,.45);
    overflow:hidden;
}

.window:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:8px;
    background:#3d322c;
}

.window:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:58%;
    height:7px;
    background:#3d322c;
}

/* balcon */

.balcony{
    position:absolute;
    left:29%;
    right:29%;
    top:58%;
    height:7%;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 32px,
            #282625 32px 37px
        );
    border-top:7px solid #282625;
}

/* =========================================================
   DÉCORATIONS
========================================================= */

.poster{
    position:absolute;
    width:90px;
    height:115px;
    background:#d8c2a5;
    border:6px solid #3d3028;
    box-shadow:5px 8px 15px rgba(0,0,0,.25);
}

.poster.one{
    left:22%;
    top:20%;
    transform:rotate(-4deg);
}

.poster.two{
    left:26%;
    top:18%;
    transform:rotate(5deg) scale(.8);
}

.poster span{
    display:block;
    text-align:center;
    margin-top:32px;
    font-family:Georgia,serif;
    font-size:15px;
    color:#34271f;
}

/* =========================================================
   LIT
========================================================= */

.bed{
    position:absolute;
    left:39%;
    bottom:17%;
    width:39%;
    height:32%;
    transform:rotate(-3deg);
    z-index:8;
}

.bed-frame{
    position:absolute;
    inset:12% 0 0;
    background:#4a3025;
    border-radius:14px;
    box-shadow:0 15px 25px rgba(0,0,0,.35);
}

.mattress{
    position:absolute;
    left:2%;
    right:2%;
    top:3%;
    height:63%;
    background:
        linear-gradient(
            135deg,
            #f4e8d4,
            #d8c7af
        );
    border-radius:16px;
    box-shadow:
        inset 0 -8px 10px rgba(90,50,30,.15);
}

.blanket{
    position:absolute;
    right:2%;
    bottom:10%;
    width:67%;
    height:48%;
    border-radius:12px;
    background:
        linear-gradient(
            135deg,
            #34463e,
            #59685b
        );
    box-shadow:0 7px 12px rgba(0,0,0,.25);
}

/* oreillers */

.pillow{
    position:absolute;
    top:9%;
    width:25%;
    height:25%;
    background:#fff9ee;
    border-radius:16px;
    box-shadow:0 5px 8px rgba(0,0,0,.15);
}

.pillow.left{
    left:12%;
}

.pillow.right{
    left:39%;
}

/* =========================================================
   FEMME
========================================================= */

.woman{
    position:absolute;
    left:30%;
    bottom:18%;
    width:34%;
    height:48%;
    z-index:15;
    cursor:pointer;
    filter:drop-shadow(0 12px 8px rgba(0,0,0,.25));
    transition:transform .3s;
}

.woman:hover{
    transform:scale(1.02);
}

/* cheveux */

.hair{
    position:absolute;
    left:31%;
    top:6%;
    width:30%;
    height:32%;
    background:
        radial-gradient(
            circle at 50% 35%,
            #2b1713,
            #120c0c 70%
        );
    border-radius:48% 48% 42% 42%;
    z-index:4;
}

.hair:after{
    content:"";
    position:absolute;
    left:-20%;
    right:-20%;
    top:40%;
    height:70%;
    background:#17100f;
    border-radius:50%;
}

/* tête */

.head{
    position:absolute;
    left:39%;
    top:10%;
    width:19%;
    height:18%;
    border-radius:50%;
    background:
        linear-gradient(
            145deg,
            #f2b58e,
            #c97d61
        );
    z-index:5;
}

/* cou */

.neck{
    position:absolute;
    left:43%;
    top:24%;
    width:11%;
    height:12%;
    background:#c98265;
    z-index:3;
}

/* dos / corps */

.body{
    position:absolute;
    left:26%;
    top:28%;
    width:47%;
    height:47%;
    border-radius:45% 45% 35% 35%;
    background:
        linear-gradient(
            120deg,
            #c98362,
            #e0a17d 55%,
            #ad6c55
        );
    transform:rotate(-9deg);
}

/* haut noir */

.top{
    position:absolute;
    left:38%;
    top:29%;
    width:29%;
    height:28%;
    background:#171617;
    clip-path:polygon(
        20% 0,
        80% 0,
        100% 100%,
        0 100%
    );
    z-index:8;
}

/* bras */

.arm{
    position:absolute;
    width:10%;
    height:38%;
    background:#d99675;
    border-radius:20px;
    z-index:10;
}

.arm.left{
    left:26%;
    top:34%;
    transform:rotate(42deg);
}

.arm.right{
    right:24%;
    top:33%;
    transform:rotate(-35deg);
}

/* jambes */

.leg{
    position:absolute;
    height:15%;
    width:50%;
    background:
        linear-gradient(
            135deg,
            #d99573,
            #bd745c
        );
    border-radius:50px;
    bottom:7%;
    z-index:5;
}

.leg.one{
    left:18%;
    transform:rotate(8deg);
}

.leg.two{
    left:42%;
    transform:rotate(-13deg);
}

/* =========================================================
   CHAT
========================================================= */

.cat{
    position:absolute;
    right:29%;
    bottom:25%;
    width:120px;
    height:105px;
    z-index:20;
    cursor:pointer;
    transition:
        transform .4s,
        bottom .5s;
}

.cat.jump{
    animation:catJump .7s ease;
}

@keyframes catJump{
    0%{transform:translateY(0)}
    40%{transform:translateY(-45px) rotate(-4deg)}
    70%{transform:translateY(-20px) rotate(4deg)}
    100%{transform:translateY(0)}
}

.cat-body{
    position:absolute;
    left:20px;
    bottom:8px;
    width:75px;
    height:58px;
    background:#4a3b36;
    border-radius:50% 50% 40% 45%;
}

.cat-head{
    position:absolute;
    left:63px;
    top:15px;
    width:48px;
    height:48px;
    background:#58463f;
    border-radius:50%;
}

.cat-ear{
    position:absolute;
    top:-11px;
    width:19px;
    height:24px;
    background:#58463f;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.cat-ear.left{
    left:4px;
}

.cat-ear.right{
    right:4px;
}

.cat-eye{
    position:absolute;
    top:20px;
    width:7px;
    height:7px;
    background:#e4bd63;
    border-radius:50%;
}

.cat-eye.left{
    left:12px;
}

.cat-eye.right{
    right:12px;
}

.cat-tail{
    position:absolute;
    left:5px;
    bottom:45px;
    width:75px;
    height:15px;
    border-radius:20px;
    border-top:9px solid #4a3b36;
    transform:rotate(-30deg);
}

/* =========================================================
   PLANTES
========================================================= */

.plant{
    position:absolute;
    z-index:14;
    cursor:pointer;
}

.plant.one{
    left:11%;
    bottom:16%;
}

.plant.two{
    right:10%;
    bottom:15%;
}

.pot{
    width:60px;
    height:55px;
    background:
        linear-gradient(
            90deg,
            #8b4930,
            #bd7652,
            #79402e
        );
    clip-path:polygon(
        10% 0,
        90% 0,
        78% 100%,
        22% 100%
    );
}

.leaves{
    position:absolute;
    left:-40px;
    bottom:40px;
    width:140px;
    height:160px;
}

.leaf{
    position:absolute;
    width:45px;
    height:80px;
    background:
        linear-gradient(
            120deg,
            #173c2c,
            #49734e
        );
    border-radius:100% 0 100% 0;
    transform-origin:bottom;
}

.leaf:nth-child(1){
    left:45px;
    top:0;
    transform:rotate(0deg);
}

.leaf:nth-child(2){
    left:10px;
    top:35px;
    transform:rotate(-38deg);
}

.leaf:nth-child(3){
    left:80px;
    top:30px;
    transform:rotate(38deg);
}

.leaf:nth-child(4){
    left:45px;
    top:65px;
    transform:rotate(-10deg);
}

/* =========================================================
   BUREAU / PC
========================================================= */

.desk{
    position:absolute;
    right:11%;
    bottom:18%;
    width:24%;
    height:12%;
    background:#5c3929;
    border-radius:8px;
    z-index:13;
    box-shadow:0 12px 15px rgba(0,0,0,.3);
}

.desk:before,
.desk:after{
    content:"";
    position:absolute;
    bottom:-100%;
    width:9px;
    height:100%;
    background:#38261d;
}

.desk:before{
    left:12%;
}

.desk:after{
    right:12%;
}

.laptop{
    position:absolute;
    left:22%;
    top:-62px;
    width:58%;
    height:60px;
    background:#151719;
    border:5px solid #25282a;
    border-radius:6px;
    z-index:16;
    transform:skewX(-4deg);
}

.laptop:after{
    content:"";
    position:absolute;
    left:-12%;
    right:-12%;
    bottom:-9px;
    height:8px;
    background:#25282a;
    border-radius:4px;
}

/* =========================================================
   LAMPE
========================================================= */

.lamp{
    position:absolute;
    left:17%;
    bottom:17%;
    width:70px;
    height:210px;
    z-index:17;
}

.lamp-shade{
    position:absolute;
    top:0;
    left:0;
    width:70px;
    height:55px;
    background:
        linear-gradient(
            180deg,
            #f2d08c,
            #b88345
        );
    clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);
    box-shadow:0 0 35px rgba(255,200,100,.45);
}

.lamp-pole{
    position:absolute;
    top:50px;
    left:32px;
    width:7px;
    height:145px;
    background:#25211e;
}

/* =========================================================
   PETITS OBJETS
========================================================= */

.book{
    position:absolute;
    width:80px;
    height:18px;
    background:#38251e;
    z-index:30;
    border-radius:3px;
}

.book.one{
    right:15%;
    bottom:27%;
    transform:rotate(-8deg);
}

.book.two{
    right:16%;
    bottom:29%;
    transform:rotate(4deg);
    background:#806147;
}

.candle{
    position:absolute;
    width:18px;
    height:38px;
    background:#f2d8b2;
    border-radius:5px;
    z-index:30;
}

.candle.one{
    right:21%;
    bottom:29%;
}

.candle:after{
    content:"";
    position:absolute;
    width:9px;
    height:14px;
    left:4px;
    top:-11px;
    background:#ffbf62;
    border-radius:50% 50% 50% 0;
    transform:rotate(45deg);
    box-shadow:0 0 15px #ffad42;
}

/* =========================================================
   HUD
========================================================= */

.hud{
    position:fixed;
    z-index:100;
    top:22px;
    left:22px;
    right:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.logo,
.room{
    background:rgba(255,255,255,.94);
    color:#171d25;
    border-radius:22px;
    padding:16px 24px;
    box-shadow:0 12px 35px rgba(0,0,0,.2);
    font-weight:900;
    font-size:20px;
}

.logo{
    font-size:22px;
}

.controls{
    position:fixed;
    z-index:100;
    right:22px;
    bottom:105px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.btn{
    width:58px;
    height:58px;
    border:none;
    border-radius:19px;
    background:rgba(255,255,255,.94);
    color:#18202a;
    font-size:28px;
    box-shadow:0 10px 25px rgba(0,0,0,.22);
    cursor:pointer;
}

.btn:active{
    transform:scale(.9);
}

/* =========================================================
   INFO
========================================================= */

.info{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:30px;
    transform:translateX(-50%) translateY(20px);
    width:min(470px,88%);
    background:rgba(255,255,255,.96);
    color:#17202a;
    padding:20px 25px;
    border-radius:24px;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

.info.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.info-title{
    font-size:22px;
    font-weight:900;
    margin-bottom:6px;
}

.info-text{
    font-size:15px;
    font-weight:600;
    color:#58616b;
}

/* =========================================================
   MESSAGE
========================================================= */

.hint{
    position:fixed;
    z-index:100;
    left:50%;
    bottom:115px;
    transform:translateX(-50%);
    background:rgba(255,255,255,.9);
    color:#485562;
    padding:12px 20px;
    border-radius:18px;
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .apartment{
        width:950px;
        height:650px;
        left:50%;
        top:54%;
        transform:translate(-50%,-50%) scale(.78);
    }

    .hud{
        top:14px;
        left:14px;
        right:14px;
    }

    .logo{
        font-size:17px;
        padding:14px 17px;
    }

    .room{
        font-size:16px;
        padding:14px 17px;
    }

    .controls{
        right:14px;
        bottom:120px;
    }

    .btn{
        width:55px;
        height:55px;
    }

    .hint{
        max-width:90%;
        overflow:hidden;
        text-overflow:ellipsis;
        bottom:95px;
    }
}
</style>
</head>

<body>

<div id="scene">

    <div class="sky"></div>
    <div class="sun"></div>

    <div class="mountains">
        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>
    </div>

    <div class="apartment">

        <div class="floor"></div>
        <div class="wall-left"></div>
        <div class="wall-right"></div>
        <div class="back-wall"></div>

        <div class="window"></div>
        <div class="balcony"></div>

        <div class="poster one">
            <span>GOOD<br>VIBES</span>
        </div>

        <div class="poster two">
            <span>HOME</span>
        </div>

        <!-- LIT -->

        <div class="bed">

            <div class="bed-frame"></div>

            <div class="mattress"></div>

            <div class="blanket"></div>

            <div class="pillow left"></div>
            <div class="pillow right"></div>

        </div>

        <!-- FEMME -->

        <div
            class="woman"
            onclick="womanClick()"
            title="Cliquer"
        >

            <div class="hair"></div>
            <div class="head"></div>
            <div class="neck"></div>
            <div class="body"></div>
            <div class="top"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="leg one"></div>
            <div class="leg two"></div>

        </div>

        <!-- CHAT -->

        <div
            class="cat"
            id="cat"
            onclick="catClick()"
        >

            <div class="cat-tail"></div>
            <div class="cat-body"></div>

            <div class="cat-head">

                <div class="cat-ear left"></div>
                <div class="cat-ear right"></div>

                <div class="cat-eye left"></div>
                <div class="cat-eye right"></div>

            </div>

        </div>

        <!-- PLANTE 1 -->

        <div
            class="plant one"
            onclick="plantClick()"
        >

            <div class="leaves">

                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>

            </div>

            <div class="pot"></div>

        </div>

        <!-- PLANTE 2 -->

        <div
            class="plant two"
            onclick="plantClick()"
        >

            <div class="leaves">

                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>

            </div>

            <div class="pot"></div>

        </div>

        <!-- BUREAU -->

        <div class="desk">

            <div
                class="laptop"
                onclick="computerClick()"
            ></div>

        </div>

        <!-- LAMPE -->

        <div
            class="lamp"
            onclick="lampClick()"
        >

            <div class="lamp-shade"></div>
            <div class="lamp-pole"></div>

        </div>

        <div class="book one"></div>
        <div class="book two"></div>

        <div class="candle one"></div>

    </div>

</div>


<!-- HUD -->

<div class="hud">

    <div class="logo">
        🏠 MON APPARTEMENT
    </div>

    <div class="room">
        Salon
    </div>

</div>


<!-- CONTROLES -->

<div class="controls">

    <button
        class="btn"
        onclick="zoom(1.1)"
    >
        ＋
    </button>

    <button
        class="btn"
        onclick="zoom(.9)"
    >
        −
    </button>

    <button
        class="btn"
        onclick="toggleNight()"
        id="dayButton"
    >
        ☀️
    </button>

    <button
        class="btn"
        onclick="resetView()"
    >
        ⌂
    </button>

</div>


<div class="hint">
    ☝️ Touche les objets · 🐈 Clique sur le chat · ✨ Explore l'appartement
</div>


<!-- INFO -->

<div
    class="info"
    id="info"
>

    <div
        class="info-title"
        id="infoTitle"
    ></div>

    <div
        class="info-text"
        id="infoText"
    ></div>

</div>


<script>

/* =========================================================
   INFOS
========================================================= */

const info = document.getElementById("info");
const infoTitle = document.getElementById("infoTitle");
const infoText = document.getElementById("infoText");

let infoTimer;

function showInfo(title,text){

    infoTitle.textContent = title;
    infoText.textContent = text;

    info.classList.add("show");

    clearTimeout(infoTimer);

    infoTimer = setTimeout(()=>{
        info.classList.remove("show");
    },4000);
}


/* =========================================================
   INTERACTIONS
========================================================= */

function womanClick(){

    showInfo(
        "✨ Moment tranquille",
        "Elle profite simplement de son appartement, avec son chat et la vue sur le coucher de soleil."
    );

}


function catClick(){

    const cat = document.getElementById("cat");

    cat.classList.remove("jump");

    void cat.offsetWidth;

    cat.classList.add("jump");

    showInfo(
        "🐈 Le chat",
        "Il vient de te regarder… puis décide de faire semblant de ne pas t'avoir vu."
    );

}


function plantClick(){

    showInfo(
        "🌿 Les plantes",
        "Il y en a partout dans l'appartement. Elles donnent une vraie ambiance jungle urbaine."
    );

}


function computerClick(){

    showInfo(
        "💻 Ordinateur",
        "Un petit coin bureau pour travailler, regarder un film ou passer la soirée."
    );

}


function lampClick(){

    showInfo(
        "💡 Lampe",
        "Une lumière chaude pour rendre l'appartement encore plus cosy."
    );

}


/* =========================================================
   ZOOM
========================================================= */

let scale = 1;

const apartment =
    document.querySelector(".apartment");

function zoom(amount){

    scale *= amount;

    scale = Math.max(
        .55,
        Math.min(
            1.35,
            scale
        )
    );

    apartment.style.transform =
        `translate(-50%,-50%) scale(${scale})`;

}


/* =========================================================
   JOUR / NUIT
========================================================= */

let night = false;

function toggleNight(){

    night = !night;

    const scene =
        document.getElementById("scene");

    const button =
        document.getElementById("dayButton");

    if(night){

        scene.style.background =
            "#090d14";

        document.querySelector(".sky").style.background =
            "linear-gradient(180deg,#050812,#10192a 50%,#18233a)";

        document.querySelector(".sun").style.background =
            "#e8ecff";

        document.querySelector(".sun").style.boxShadow =
            "0 0 35px #b9d0ff,0 0 90px rgba(130,160,255,.4)";

        document.querySelector(".sun").style.width =
            "90px";

        document.querySelector(".sun").style.height =
            "90px";

        button.textContent = "🌙";

    }else{

        scene.style.background =
            "#11151c";

        document.querySelector(".sky").style.background =
            "linear-gradient(180deg,#18202d,#39485a 45%,#b86754 78%,#e7a269)";

        document.querySelector(".sun").style.background =
            "#ffd995";

        document.querySelector(".sun").style.boxShadow =
            "0 0 35px #ffca75,0 0 100px rgba(255,170,80,.6)";

        document.querySelector(".sun").style.width =
            "150px";

        document.querySelector(".sun").style.height =
            "150px";

        button.textContent = "☀️";

    }

}


/* =========================================================
   HOME
========================================================= */

function resetView(){

    scale = 1;

    apartment.style.transform =
        "translate(-50%,-50%) scale(1)";

    showInfo(
        "🏠 Appartement",
        "Bienvenue chez toi. Clique sur les différents éléments pour découvrir l'appartement."
    );

}


/* =========================================================
   PETITE ANIMATION DU CHAT
========================================================= */

setInterval(()=>{

    const cat =
        document.getElementById("cat");

    if(Math.random() > .65){

        cat.style.transform =
            "translateX(10px)";

        setTimeout(()=>{
            cat.style.transform =
                "translateX(0)";
        },700);

    }

},4500);


/* =========================================================
   BIENVENUE
========================================================= */

setTimeout(()=>{

    showInfo(
        "🏠 Bienvenue",
        "Explore l'appartement et touche les différents objets."
    );

},800);

</script>

</body>
</html>
