<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Appartement 03</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101312;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

.ui{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.top{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.pill{
    background:rgba(244,240,228,.94);
    color:#17231e;
    border-radius:30px;
    padding:15px 20px;
    font-size:17px;
    font-weight:900;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.modes{
    display:flex;
    gap:4px;
    padding:6px;
    border-radius:27px;
    background:rgba(244,240,228,.94);
    box-shadow:0 12px 35px rgba(0,0,0,.25);
    pointer-events:auto;
}

.modes button{
    width:43px;
    height:40px;
    border:0;
    border-radius:19px;
    background:transparent;
    font-size:20px;
}

.modes button.active{
    background:#18241f;
}

.bottom{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:max-content;
    max-width:calc(100% - 35px);
    background:rgba(244,240,228,.94);
    color:#17231e;
    padding:13px 20px;
    border-radius:22px;
    font-size:13px;
    font-weight:850;
    text-align:center;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.panel{
    position:absolute;
    left:18px;
    right:18px;
    bottom:78px;
    padding:22px;
    border-radius:28px;
    background:rgba(22,34,29,.96);
    color:white;
    box-shadow:0 25px 70px rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.12);
    transform:translateY(160%);
    transition:.4s ease;
    pointer-events:auto;
}

.panel.open{
    transform:translateY(0);
}

.panel h2{
    font-size:24px;
    margin-bottom:7px;
}

.panel p{
    color:#d5ddd8;
    line-height:1.5;
    margin-bottom:16px;
}

.close{
    position:absolute;
    top:9px;
    right:13px;
    border:0;
    background:none;
    color:white;
    font-size:30px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.actions button{
    border:0;
    border-radius:14px;
    padding:11px 15px;
    background:#d6b47a;
    color:#18221e;
    font-weight:900;
}

.toast{
    position:absolute;
    top:92px;
    left:50%;
    transform:translate(-50%,-15px);
    background:#f4f0e4;
    color:#17231e;
    padding:12px 17px;
    border-radius:17px;
    font-weight:900;
    opacity:0;
    transition:.3s;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:600px){
    .top{
        top:12px;
        left:10px;
        right:10px;
    }

    .pill{
        padding:13px 15px;
        font-size:14px;
    }

    .modes{
        padding:5px;
    }

    .modes button{
        width:35px;
        height:35px;
        font-size:17px;
    }

    .bottom{
        bottom:13px;
        font-size:11px;
        padding:11px 15px;
    }
}
</style>
</head>

<body>

<div id="app">

<canvas id="room"></canvas>

<div class="ui">

    <div class="top">

        <div class="pill">
            🏠 APPARTEMENT 03
        </div>

        <div class="modes">

            <button class="active" data-mode="day">☀️</button>
            <button data-mode="sunset">🌅</button>
            <button data-mode="night">🌙</button>
            <button id="reset">🎥</button>

        </div>

    </div>

    <div id="toast" class="toast"></div>

    <div class="bottom">
        👆 Glisse pour regarder · 🤏 Pince pour zoomer · ✨ Touche les objets
    </div>

    <div id="panel" class="panel">

        <button class="close" id="close">×</button>

        <h2 id="panelTitle"></h2>

        <p id="panelText"></p>

        <div id="actions" class="actions"></div>

    </div>

</div>

</div>


<script>

/* =========================================================
   APPARTEMENT 03
   100% AUTONOME
   Canvas + JavaScript
========================================================= */

const canvas = document.getElementById("room");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

let mode = "day";

let cameraX = 0;
let cameraY = 0;
let zoom = 1;

let targetCameraX = 0;
let targetCameraY = 0;
let targetZoom = 1;

let pointerDown = false;
let lastX = 0;
let lastY = 0;

let pinchDistance = null;

let objects = [];

let hoveredObject = null;


/* =========================================================
   COULEURS
========================================================= */

const themes = {

    day:{
        sky:"#9bb9bd",
        sky2:"#efb183",
        wall:"#e5d0ad",
        floor:"#b9875f",
        floor2:"#956544",
        wood:"#62432f",
        dark:"#26342f",
        green:"#4e6e58",
        cream:"#eee5d2",
        gold:"#c79b55",
        light:"#ffd59c",
        mountain:"#526969"
    },

    sunset:{
        sky:"#654d58",
        sky2:"#d77b58",
        wall:"#cfae8b",
        floor:"#8b5e4c",
        floor2:"#664337",
        wood:"#50352a",
        dark:"#252522",
        green:"#435a4a",
        cream:"#d8cbb6",
        gold:"#bd844b",
        light:"#ffad6c",
        mountain:"#3f5154"
    },

    night:{
        sky:"#101d2b",
        sky2:"#243346",
        wall:"#393733",
        floor:"#423a34",
        floor2:"#302a26",
        wood:"#30251f",
        dark:"#17221f",
        green:"#314b3c",
        cream:"#aaa391",
        gold:"#a67c43",
        light:"#f2bd70",
        mountain:"#202f3b"
    }

};

function T(){
    return themes[mode];
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    dpr = Math.min(window.devicePixelRatio || 1,2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);

resize();


/* =========================================================
   UTILS
========================================================= */

function lerp(a,b,t){
    return a+(b-a)*t;
}

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function roundRect(ctx,x,y,w,h,r){

    ctx.beginPath();

    ctx.roundRect(x,y,w,h,r);

    ctx.fill();
}

function polygon(points,fill,stroke){

    ctx.beginPath();

    ctx.moveTo(points[0][0],points[0][1]);

    for(let i=1;i<points.length;i++){
        ctx.lineTo(points[i][0],points[i][1]);
    }

    ctx.closePath();

    if(fill){
        ctx.fillStyle=fill;
        ctx.fill();
    }

    if(stroke){
        ctx.strokeStyle=stroke;
        ctx.stroke();
    }
}


/* =========================================================
   PERSPECTIVE
========================================================= */

function P(x,y,z){

    const horizon = H*.39;

    const depth = 1/(1+z*.075);

    const sx =
        W/2 +
        (x-cameraX)*depth*zoom;

    const sy =
        horizon +
        (y-cameraY)*depth*zoom;

    return [sx,sy,depth];
}


/* =========================================================
   DRAW SKY
========================================================= */

function drawSky(){

    const g =
        ctx.createLinearGradient(
            0,0,
            0,H*.65
        );

    g.addColorStop(
        0,
        T().sky
    );

    g.addColorStop(
        1,
        T().sky2
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,0,W,H
    );

}


/* =========================================================
   MOUNTAINS
========================================================= */

function drawMountains(){

    polygon([
        [0,H*.49],
        [W*.15,H*.35],
        [W*.29,H*.46],
        [W*.43,H*.31],
        [W*.58,H*.45],
        [W*.73,H*.32],
        [W*.87,H*.45],
        [W,H*.34],
        [W,H*.58],
        [0,H*.58]
    ],T().mountain);

    polygon([
        [0,H*.53],
        [W*.19,H*.42],
        [W*.34,H*.51],
        [W*.51,H*.39],
        [W*.68,H*.51],
        [W*.82,H*.41],
        [W,H*.49],
        [W,H*.6],
        [0,H*.6]
    ],"#435b5c");

}


/* =========================================================
   SUN
========================================================= */

function drawSun(){

    if(mode==="night") return;

    const x =
        mode==="sunset"
        ? W*.72
        : W*.76;

    const y =
        mode==="sunset"
        ? H*.38
        : H*.27;

    const r = 45;

    const glow =
        ctx.createRadialGradient(
            x,y,5,
            x,y,110
        );

    glow.addColorStop(
        0,
        "rgba(255,230,150,.85)"
    );

    glow.addColorStop(
        1,
        "rgba(255,180,100,0)"
    );

    ctx.fillStyle=glow;

    ctx.beginPath();
    ctx.arc(x,y,110,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#ffd37e";

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
}


/* =========================================================
   ROOM
========================================================= */

function drawRoom(){

    const horizon = H*.42;

    /* back wall */

    ctx.fillStyle=T().wall;

    ctx.fillRect(
        0,
        horizon,
        W,
        H*.4
    );


    /* floor */

    polygon([
        [0,H*.73],
        [W,H*.73],
        [W,H],
        [0,H]
    ],T().floor);


    /* floor perspective lines */

    ctx.strokeStyle=
        "rgba(65,42,29,.23)";

    ctx.lineWidth=1;

    for(let i=0;i<13;i++){

        const x=i*W/12;

        ctx.beginPath();

        ctx.moveTo(
            W/2+(x-W/2)*.25,
            H*.73
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }

    for(let i=0;i<5;i++){

        const y=
            H*.73+
            i*(H*.27/5);

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();
    }

}


/* =========================================================
   WINDOW
========================================================= */

function drawWindow(){

    const x=W*.16;
    const y=H*.24;
    const w=W*.68;
    const h=H*.38;

    /* frame */

    ctx.fillStyle=T().wood;

    roundRect(
        ctx,
        x-10,
        y-10,
        w+20,
        h+20,
        5
    );


    /* glass */

    const g=
        ctx.createLinearGradient(
            0,y,
            0,y+h
        );

    g.addColorStop(
        0,
        mode==="night"
        ? "#142437"
        : mode==="sunset"
        ? "#6d5261"
        : "#71949e"
    );

    g.addColorStop(
        1,
        mode==="night"
        ? "#263449"
        : mode==="sunset"
        ? "#db8561"
        : "#edb083"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    /* outside landscape */

    polygon([
        [x,y+h*.73],
        [x+w*.18,y+h*.45],
        [x+w*.34,y+h*.7],
        [x+w*.48,y+h*.4],
        [x+w*.65,y+h*.72],
        [x+w*.82,y+h*.5],
        [x+w,y+h*.72],
        [x+w,y+h],
        [x,y+h]
    ],T().mountain);


    /* lake */

    ctx.fillStyle=
        mode==="night"
        ? "#253c4b"
        : "#6e9fa8";

    ctx.fillRect(
        x,
        y+h*.72,
        w,
        h*.28
    );


    /* frame bars */

    ctx.fillStyle=T().wood;

    ctx.fillRect(
        x+w*.49,
        y,
        7,
        h
    );

    ctx.fillRect(
        x,
        y+h*.72,
        w,
        7
    );

}


/* =========================================================
   CURTAINS
========================================================= */

function drawCurtains(){

    ctx.fillStyle=
        mode==="night"
        ? "#282821"
        : "#d6c3a5";

    polygon([
        [W*.10,H*.20],
        [W*.18,H*.23],
        [W*.18,H*.63],
        [W*.10,H*.68]
    ],T().cream);

    polygon([
        [W*.90,H*.20],
        [W*.82,H*.23],
        [W*.82,H*.63],
        [W*.90,H*.68]
    ],T().cream);

}


/* =========================================================
   TABLE
========================================================= */

function drawTable(){

    const cx=W*.50;
    const cy=H*.69;

    ctx.fillStyle=T().wood;

    roundRect(
        ctx,
        cx-95,
        cy-17,
        190,
        34,
        9
    );

    ctx.fillRect(
        cx-75,
        cy+10,
        10,
        105
    );

    ctx.fillRect(
        cx+65,
        cy+10,
        10,
        105
    );


    /* laptop */

    ctx.fillStyle="#202625";

    polygon([
        [cx-40,cy-50],
        [cx+12,cy-50],
        [cx+24,cy-17],
        [cx-50,cy-17]
    ],"#252a28");

    ctx.fillStyle="#789a99";

    ctx.fillRect(
        cx-35,
        cy-45,
        42,
        22
    );

    ctx.fillStyle="#303532";

    polygon([
        [cx-50,cy-16],
        [cx+24,cy-16],
        [cx+38,cy-8],
        [cx-62,cy-8]
    ],"#303532");


    /* coffee */

    ctx.fillStyle=T().cream;

    ctx.beginPath();

    ctx.arc(
        cx+63,
        cy-2,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#79533b";

    ctx.beginPath();

    ctx.arc(
        cx+63,
        cy-3,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* book */

    ctx.fillStyle="#536b59";

    roundRect(
        ctx,
        cx-20,
        cy-3,
        42,
        8,
        2
    );

}


/* =========================================================
   SOFA
========================================================= */

function drawSofa(){

    const x=W*.38;
    const y=H*.64;

    /* body */

    ctx.fillStyle=T().cream;

    roundRect(
        ctx,
        x-135,
        y,
        270,
        105,
        22
    );

    /* back */

    roundRect(
        ctx,
        x-135,
        y-75,
        270,
        90,
        24
    );

    /* arms */

    roundRect(
        ctx,
        x-153,
        y-35,
        35,
        105,
        18
    );

    roundRect(
        ctx,
        x+118,
        y-35,
        35,
        105,
        18
    );


    /* cushions */

    ctx.fillStyle="#b77759";

    roundRect(
        ctx,
        x-95,
        y-48,
        62,
        47,
        13
    );

    ctx.fillStyle="#55705e";

    roundRect(
        ctx,
        x-25,
        y-48,
        62,
        47,
        13
    );

    ctx.fillStyle="#c3a982";

    roundRect(
        ctx,
        x+45,
        y-48,
        62,
        47,
        13
    );

}


/* =========================================================
   RUG
========================================================= */

function drawRug(){

    ctx.fillStyle="#79564a";

    roundRect(
        ctx,
        W*.24,
        H*.72,
        W*.52,
        H*.18,
        15
    );

    ctx.strokeStyle=
        "rgba(225,190,140,.5)";

    ctx.lineWidth=3;

    for(let i=0;i<7;i++){

        ctx.beginPath();

        ctx.moveTo(
            W*.27,
            H*.74+i*22
        );

        ctx.lineTo(
            W*.73,
            H*.74+i*22
        );

        ctx.stroke();

    }

}


/* =========================================================
   LIBRARY
========================================================= */

function drawLibrary(){

    const x=W*.035;
    const y=H*.42;
    const w=W*.20;
    const h=H*.36;

    ctx.fillStyle=T().dark;

    roundRect(
        ctx,
        x,
        y,
        w,
        h,
        5
    );

    for(let row=0;row<4;row++){

        const yy=
            y+35+
            row*(h-50)/4;

        ctx.fillStyle=T().wood;

        ctx.fillRect(
            x+8,
            yy,
            w-16,
            5
        );

        const colors=[
            "#ad6b50",
            "#ba965d",
            "#526b59",
            "#80605a",
            "#c8b38c"
        ];

        for(let i=0;i<5;i++){

            ctx.fillStyle=
                colors[(i+row)%colors.length];

            const bh=
                27+
                (i%3)*8;

            ctx.fillRect(
                x+15+i*19,
                yy-bh,
                14,
                bh
            );
        }
    }

}


/* =========================================================
   PLANT
========================================================= */

function drawPlant(){

    const x=W*.87;
    const y=H*.74;

    ctx.fillStyle="#a56448";

    roundRect(
        ctx,
        x-25,
        y,
        50,
        45,
        7
    );

    const leaves=[
        [-50,-90,-.5],
        [-25,-115,-.2],
        [0,-130,0],
        [25,-110,.2],
        [50,-85,.5],
        [-65,-45,-.8],
        [65,-48,.8]
    ];

    leaves.forEach(l=>{

        ctx.save();

        ctx.translate(
            x+l[0],
            y+l[1]
        );

        ctx.rotate(l[2]);

        ctx.fillStyle=T().green;

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            18,
            42,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    });

}


/* =========================================================
   LAMPE
========================================================= */

function drawLamp(){

    const x=W*.72;
    const y=H*.42;

    ctx.strokeStyle=T().wood;
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(x,y-90);
    ctx.lineTo(x,y-10);

    ctx.stroke();

    ctx.fillStyle=T().dark;

    ctx.beginPath();

    ctx.moveTo(x-30,y-12);
    ctx.lineTo(x+30,y-12);
    ctx.lineTo(x+20,y+18);
    ctx.lineTo(x-20,y+18);
    ctx.closePath();

    ctx.fill();

    if(mode!=="night"){

        const glow=
            ctx.createRadialGradient(
                x,y+15,3,
                x,y+15,110
            );

        glow.addColorStop(
            0,
            "rgba(255,210,130,.22)"
        );

        glow.addColorStop(
            1,
            "rgba(255,210,130,0)"
        );

        ctx.fillStyle=glow;

        ctx.beginPath();

        ctx.arc(
            x,
            y+15,
            110,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   GUITARE
========================================================= */

function drawGuitar(){

    const x=W*.27;
    const y=H*.70;

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(-.12);

    ctx.fillStyle="#a76042";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        25,
        38,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#6b432f";

    ctx.fillRect(
        -5,
        -85,
        10,
        70
    );

    ctx.strokeStyle="#e6d4b0";
    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(
        -4,
        -80
    );

    ctx.lineTo(
        -4,
        25
    );

    ctx.moveTo(
        4,
        -80
    );

    ctx.lineTo(
        4,
        25
    );

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   CHAT
========================================================= */

let catBob=0;
let catTail=0;

function drawCat(){

    const x=W*.66;
    const y=H*.67+catBob;

    /* queue */

    ctx.save();

    ctx.translate(
        x+60,
        y+8
    );

    ctx.rotate(
        Math.sin(catTail)*.25
    );

    ctx.strokeStyle="#4a403a";
    ctx.lineWidth=13;
    ctx.lineCap="round";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        40,
        -1.2,
        1.5
    );

    ctx.stroke();

    ctx.restore();


    /* corps */

    ctx.fillStyle="#544943";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+15,
        70,
        42,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* tête */

    ctx.beginPath();

    ctx.arc(
        x-48,
        y-12,
        38,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* oreilles */

    polygon([
        [x-76,y-38],
        [x-68,y-77],
        [x-47,y-47]
    ],"#544943");

    polygon([
        [x-43,y-47],
        [x-22,y-78],
        [x-18,y-32]
    ],"#544943");


    /* yeux */

    ctx.fillStyle="#d7b65c";

    ctx.beginPath();
    ctx.arc(x-60,y-14,5,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x-38,y-14,5,0,Math.PI*2);
    ctx.fill();


    /* nez */

    ctx.fillStyle="#d28d82";

    ctx.beginPath();

    ctx.arc(
        x-49,
        y,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   WALL ART
========================================================= */

function drawArt(){

    const x=W*.77;
    const y=H*.50;
    const w=W*.12;
    const h=H*.13;

    ctx.fillStyle="#d8c6a7";

    ctx.fillRect(
        x,
        y,
        w,
        h
    );

    ctx.strokeStyle=T().wood;
    ctx.lineWidth=5;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );

    ctx.fillStyle=T().wood;

    ctx.font="bold 15px sans-serif";

    ctx.textAlign="center";

    ctx.fillText(
        "BONHEUR",
        x+w/2,
        y+25
    );

    ctx.font="32px serif";

    ctx.fillText(
        "⌁",
        x+w/2,
        y+70
    );

}


/* =========================================================
   DECORATIONS
========================================================= */

function drawDecor(){

    /* vase */

    const x=W*.15;
    const y=H*.72;

    ctx.fillStyle="#b78358";

    ctx.beginPath();

    ctx.moveTo(x-20,y);
    ctx.lineTo(x+20,y);
    ctx.lineTo(x+13,y+45);
    ctx.lineTo(x-13,y+45);
    ctx.closePath();

    ctx.fill();


    /* flowers */

    ctx.strokeStyle=T().green;
    ctx.lineWidth=3;

    for(let i=0;i<5;i++){

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x-35+i*17,
            y-55-(i%2)*15
        );

        ctx.stroke();

        ctx.fillStyle=
            i%2
            ? "#e7d9c0"
            : "#c9836b";

        ctx.beginPath();

        ctx.arc(
            x-35+i*17,
            y-55-(i%2)*15,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}

/* =========================================================
   PANEL
========================================================= */

function openPanel(obj){

    document.getElementById("panelTitle").textContent=obj.title;

    document.getElementById("panelText").textContent=obj.text;

    const actions=
        document.getElementById("actions");

    actions.innerHTML="";

    obj.actions.forEach(a=>{

        const b=
            document.createElement("button");

        b.textContent=a[0];

        b.onclick=a[1];

        actions.appendChild(b);

    });

    document
        .getElementById("panel")
        .classList.add("open");
}

document
    .getElementById("close")
    .onclick=()=>{
        document
            .getElementById("panel")
            .classList.remove("open");
    };


/* =========================================================
   TOAST
========================================================= */

let toastTimeout;

function toast(text){

    const el=
        document.getElementById("toast");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(toastTimeout);

    toastTimeout=setTimeout(()=>{
        el.classList.remove("show");
    },2200);

}


/* =========================================================
   TOUCH / SOURIS
========================================================= */

function distance(a,b){

    return Math.hypot(
        a.clientX-b.clientX,
        a.clientY-b.clientY
    );
}

canvas.addEventListener(
    "pointerdown",
    e=>{

        pointerDown=true;

        lastX=e.clientX;
        lastY=e.clientY;

        canvas.setPointerCapture(e.pointerId);

    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!pointerDown)return;

        const dx=e.clientX-lastX;
        const dy=e.clientY-lastY;

        targetCameraX -= dx*0.75;

        targetCameraY -= dy*0.45;

        targetCameraX=
            clamp(
                targetCameraX,
                -180,
                180
            );

        targetCameraY=
            clamp(
                targetCameraY,
                -80,
                100
            );

        lastX=e.clientX;
        lastY=e.clientY;

    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        pointerDown=false;

        const moved=
            Math.abs(
                e.clientX-lastX
            )+
            Math.abs(
                e.clientY-lastY
            );

        /* recherche de l'objet touché */

        const rect=
            canvas.getBoundingClientRect();

        const x=e.clientX-rect.left;
        const y=e.clientY-rect.top;

        let nearest=null;
        let nearestDistance=Infinity;

        objects.forEach(obj=>{

            const dx=x-obj.x;
            const dy=y-obj.y;

            const d=Math.sqrt(
                dx*dx+dy*dy
            );

            if(
                d<obj.r &&
                d<nearestDistance
            ){
                nearest=obj;
                nearestDistance=d;
            }

        });

        if(nearest){

            openPanel(nearest);

        }

    }
);


/* =========================================================
   ZOOM
========================================================= */

canvas.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        targetZoom +=
            e.deltaY<0
            ? .08
            : -.08;

        targetZoom=
            clamp(
                targetZoom,
                .75,
                1.45
            );

    },
    {passive:false}
);

/* =========================================================
   ANIMATION
========================================================= */

let time=0;

function animate(){

    time+=.016;

    cameraX=
        lerp(
            cameraX,
            targetCameraX,
            .08
        );

    cameraY=
        lerp(
            cameraY,
            targetCameraY,
            .08
        );

    zoom=
        lerp(
            zoom,
            targetZoom,
            .08
        );


    catBob=
        Math.sin(time*2)*1.5;

    catTail=
        time;


    draw();

    requestAnimationFrame(
        animate
    );

}
