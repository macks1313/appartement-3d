<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>Kitchen Copilot</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#0f1012;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea,select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    max-width:900px;
    margin:auto;
    min-height:100vh;
    padding-bottom:100px;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(15,16,18,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #27292e;
    padding:16px;
}

.headerRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:23px;
    font-weight:900;
}

.logo span{
    color:#ff7900;
}

.restaurantName{
    color:#999da6;
    font-size:13px;
    margin-top:3px;
}

/* NAVIGATION */

.nav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    padding:12px 14px 5px;
}

.nav button{
    background:#1d2025;
    color:#92959c;
    border-radius:13px;
    padding:11px 5px;
    font-weight:800;
}

.nav button.active{
    background:#ff7900;
    color:white;
}

/* CONTENT */

.content{
    padding:15px;
}

.sectionTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 0 12px;
}

.sectionTitle h2{
    font-size:19px;
    margin:0;
}

.addButton{
    background:#25282e;
    color:white;
    padding:9px 12px;
    border-radius:11px;
    font-weight:800;
}

/* TIMER GRID */

.timerGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

.timerCard{
    background:linear-gradient(145deg,#202329,#181a1e);
    border:1px solid #30333a;
    border-radius:20px;
    padding:16px;
    position:relative;
    overflow:hidden;
}

.timerEmoji{
    font-size:38px;
}

.timerTitle{
    font-size:16px;
    font-weight:900;
    margin-top:7px;
}

.timerTime{
    font-size:35px;
    font-weight:950;
    margin:8px 0;
    letter-spacing:-1px;
}

.timerButtons{
    display:flex;
    gap:7px;
}

.timerButtons button{
    flex:1;
    padding:9px;
    border-radius:10px;
    background:#2b2e35;
    color:white;
    font-weight:800;
}

.timerButtons .delete{
    color:#ff625b;
}

/* PRESETS */

.presetGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.preset{
    background:#191b1f;
    border:1px solid #2a2d33;
    border-radius:17px;
    padding:14px;
    color:white;
    text-align:left;
}

.preset:hover{
    border-color:#ff7900;
}

.presetEmoji{
    font-size:32px;
}

.presetName{
    font-weight:900;
    margin-top:5px;
}

.presetTime{
    color:#92959c;
    font-size:13px;
    margin-top:3px;
}

.presetEdit{
    margin-top:10px;
    background:#292c32;
    color:white;
    padding:8px 10px;
    border-radius:9px;
    font-size:12px;
}

/* CARDS */

.card{
    background:#191b1f;
    border:1px solid #292c32;
    border-radius:18px;
    padding:15px;
    margin-bottom:10px;
}

/* CHECKLIST */

.task{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #292c32;
}

.task:last-child{
    border-bottom:0;
}

.checkbox{
    width:25px;
    height:25px;
    border:2px solid #666a72;
    border-radius:8px;
    flex:none;
    display:grid;
    place-items:center;
}

.task.done .checkbox{
    background:#ff7900;
    border-color:#ff7900;
}

.task.done .taskText{
    text-decoration:line-through;
    color:#777;
}

.taskText{
    flex:1;
}

/* PRODUCTS */

.product{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #292c32;
}

.product:last-child{
    border-bottom:0;
}

.statusButton{
    padding:8px 10px;
    border-radius:10px;
    font-weight:800;
    font-size:12px;
}

.status-ok{
    background:#193b24;
    color:#74e49b;
}

.status-soon{
    background:#49361c;
    color:#ffc56b;
}

.status-todo{
    background:#48201e;
    color:#ff7770;
}

/* PREPARATIONS */

.recipeTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.recipeText{
    white-space:pre-wrap;
    color:#a4a7ae;
    margin-top:9px;
    line-height:1.5;
}

/* EMPTY */

.empty{
    background:#191b1f;
    border-radius:18px;
    padding:35px 20px;
    text-align:center;
    color:#777b84;
}

/* FAB */

.fab{
    position:fixed;
    right:20px;
    bottom:20px;
    width:62px;
    height:62px;
    border-radius:50%;
    background:#ff7900;
    color:white;
    font-size:32px;
    box-shadow:0 8px 30px #000b;
    z-index:30;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:flex-end;
    z-index:100;
}

.modal.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:900px;
    margin:auto;
    background:#1b1d21;
    border-radius:25px 25px 0 0;
    padding:20px;
    max-height:92vh;
    overflow:auto;
}

.sheet h2{
    margin-top:0;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:#a2a5ad;
    font-size:13px;
    margin-bottom:6px;
}

input,
textarea,
select{
    width:100%;
    background:#101114;
    color:white;
    border:1px solid #373a42;
    border-radius:11px;
    padding:12px;
    outline:none;
}

textarea{
    min-height:120px;
}

.primary{
    width:100%;
    padding:13px;
    background:#ff7900;
    color:white;
    border-radius:12px;
    font-weight:900;
}

.secondary{
    width:100%;
    padding:12px;
    background:#292c32;
    color:white;
    border-radius:12px;
    font-weight:800;
    margin-top:8px;
}

.dangerButton{
    width:100%;
    padding:12px;
    background:#43201e;
    color:#ff7770;
    border-radius:12px;
    font-weight:800;
    margin-top:8px;
}

/* SETTINGS */

.setting{
    padding:14px 0;
    border-bottom:1px solid #2a2d33;
}

.setting:last-child{
    border-bottom:0;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:white;
    color:#111;
    padding:11px 16px;
    border-radius:12px;
    font-weight:800;
    display:none;
    z-index:200;
}

/* MOBILE */

@media(max-width:520px){

    .timerGrid,
    .presetGrid{
        grid-template-columns:1fr;
    }

    .nav button{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="headerRow">

<div>
<div class="logo">
Kitchen <span>Copilot</span>
</div>

<div class="restaurantName" id="restaurantName">
Anastasiia
</div>

</div>

<button class="addButton" onclick="openSettings()">
⚙️
</button>

</div>

</header>

<nav class="nav">

<button class="active" onclick="showPage('service',this)">
🔥 Service
</button>

<button onclick="showPage('lists',this)">
📋 Listes
</button>

<button onclick="showPage('products',this)">
🛒 À refaire
</button>

<button onclick="showPage('recipes',this)">
🍳 Prépas
</button>

</nav>

<main class="content">

<!-- SERVICE -->

<section id="service">

<div class="sectionTitle">
<h2>🔥 Cuissons en cours</h2>

<button class="addButton" onclick="openTimerEditor()">
＋ Cuisson
</button>
</div>

<div id="activeTimers" class="timerGrid"></div>


<div class="sectionTitle">
<h2>🍔 Mes cuissons</h2>
</div>

<div id="presets" class="presetGrid"></div>

</section>


<!-- LISTES -->

<section id="lists" style="display:none">

<div class="sectionTitle">

<h2>📋 Checklists</h2>

<button class="addButton" onclick="openListEditor()">
＋ Liste
</button>

</div>

<div id="listsContainer"></div>

</section>


<!-- PRODUITS -->

<section id="products" style="display:none">

<div class="sectionTitle">

<h2>🛒 Produits à refaire</h2>

<button class="addButton" onclick="openProductEditor()">
＋ Produit
</button>

</div>

<div class="card">

<div style="color:#92959c;font-size:13px;margin-bottom:10px">

Un produit presque terminé peut être envoyé dans
<strong>À refaire</strong> en un seul clic.

</div>

<div id="productsContainer"></div>

</div>

</section>


<!-- RECETTES -->

<section id="recipes" style="display:none">

<div class="sectionTitle">

<h2>🍳 Préparations</h2>

<button class="addButton" onclick="openRecipeEditor()">
＋ Prépa
</button>

</div>

<div id="recipesContainer"></div>

</section>

</main>

<button class="fab" onclick="quickAdd()">
+
</button>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="sheet" id="sheet"></div>

</div>

<div id="toast" class="toast"></div>


<script>

/* =====================================================
   DONNÉES
===================================================== */

const STORAGE_KEY="kitchen_copilot_anastasiia_v2";

const DEFAULT_DATA={

settings:{
    restaurant:"Anastasiia",
    subtitle:"Cuisine"
},

presets:[

{
    id:"steak",
    emoji:"🥩",
    name:"Steak saignant",
    duration:180,
    alarms:[
        {before:60,sound:"double"},
        {before:0,sound:"long"}
    ]
},

{
    id:"fries",
    emoji:"🍟",
    name:"Frites",
    duration:210,
    alarms:[
        {before:30,sound:"double"},
        {before:0,sound:"long"}
    ]
},

{
    id:"burger",
    emoji:"🍔",
    name:"Burger",
    duration:300,
    alarms:[
        {before:60,sound:"beep"},
        {before:0,sound:"long"}
    ]
},

{
    id:"chicken",
    emoji:"🍗",
    name:"Poulet",
    duration:480,
    alarms:[
        {before:60,sound:"double"},
        {before:0,sound:"long"}
    ]
},

{
    id:"egg",
    emoji:"🥚",
    name:"Œuf mollet",
    duration:360,
    alarms:[
        {before:30,sound:"beep"},
        {before:0,sound:"long"}
    ]
},

{
    id:"bacon",
    emoji:"🥓",
    name:"Bacon",
    duration:240,
    alarms:[
        {before:30,sound:"beep"},
        {before:0,sound:"long"}
    ]
}

],

lists:[

{
    id:"opening",
    name:"🌅 Ouverture",
    items:[
        "Allumer les fours",
        "Vérifier les frigos",
        "Préparer la mise en place",
        "Sortir les produits"
    ]
},

{
    id:"closing",
    name:"🌙 Fermeture",
    items:[
        "Nettoyer le plan de travail",
        "Nettoyer la friteuse",
        "Ranger les produits",
        "Sortir les poubelles",
        "Éteindre les appareils"
    ]
}

],

products:[

{
    id:"sauce",
    emoji:"🥫",
    name:"Sauce maison",
    status:"ok"
},

{
    id:"mayo",
    emoji:"🥫",
    name:"Mayonnaise maison",
    status:"ok"
},

{
    id:"onions",
    emoji:"🧅",
    name:"Oignons confits",
    status:"ok"
},

{
    id:"pickles",
    emoji:"🥒",
    name:"Pickles",
    status:"ok"
}

],

recipes:[

{
    id:"sauce",
    emoji:"🥫",
    name:"Sauce maison",
    notes:"Ajouter ici les ingrédients et la méthode."
}

],

active:[]

};


/* =====================================================
   CHARGEMENT
===================================================== */

let data=
JSON.parse(localStorage.getItem(STORAGE_KEY))
||
structuredClone(DEFAULT_DATA);

let audioContext=null;


function save(){

localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
);

}


/* =====================================================
   UTILITAIRES
===================================================== */

function $(id){

return document.getElementById(id);

}


function uid(){

return Date.now().toString(36)
+
Math.random().toString(36).slice(2);

}


function esc(text){

return String(text ?? "")
.replace(/[&<>"']/g,function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m];

});

}


function formatTime(seconds){

seconds=Math.max(
    0,
    Math.ceil(seconds)
);

return String(
    Math.floor(seconds/60)
).padStart(2,"0")
+
":"
+
String(
    seconds%60
).padStart(2,"0");

}


function toast(message){

$("toast").textContent=message;

$("toast").style.display="block";

setTimeout(function(){

$("toast").style.display="none";

},1800);

}


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(page,button){

[
"service",
"lists",
"products",
"recipes"
].forEach(function(id){

$(id).style.display=
id===page
?
"block"
:
"none";

});

document
.querySelectorAll(".nav button")
.forEach(function(btn){

btn.classList.remove("active");

});

button.classList.add("active");

}


/* =====================================================
   MODAL
===================================================== */

function openModal(html){

$("sheet").innerHTML=html;

$("modal").classList.add("show");

}


function closeModal(){

$("modal").classList.remove("show");

}


/* =====================================================
   CUISSONS
===================================================== */

function openTimerEditor(id=null){

const timer=
data.presets.find(
p=>p.id===id
);

const alarms=
timer
?
timer.alarms
:
[];

openModal(`

<h2>
${timer?"✏️ Modifier":"➕ Nouvelle"} cuisson
</h2>

<div class="field">

<label>Emoji</label>

<input
id="timerEmoji"
value="${esc(timer?.emoji||"🍔")}"
>

</div>

<div class="field">

<label>Nom</label>

<input
id="timerName"
value="${esc(timer?.name||"")}"
placeholder="Ex : Burger"
/>

</div>

<div class="field">

<label>Minutes</label>

<input
id="timerMinutes"
type="number"
min="0"
value="${Math.floor((timer?.duration||180)/60)}"
>

</div>

<div class="field">

<label>Secondes</label>

<input
id="timerSeconds"
type="number"
min="0"
max="59"
value="${(timer?.duration||180)%60}"
>

</div>

<h3>
🔔 Sonneries
</h3>

<p style="color:#92959c;font-size:13px">

Tu peux mettre plusieurs avertissements.
Le chiffre correspond au nombre de secondes avant la fin.

</p>

${[0,1,2].map(function(i){

return `

<div class="field">

<label>
Sonnerie ${i+1}
</label>

<input
id="alarm${i}"
type="number"
min="0"
placeholder="Secondes avant la fin"
value="${alarms[i]?.before??""}"
>

<select id="sound${i}">

<option value="beep"
${alarms[i]?.sound==="beep"?"selected":""}>
🔔 Bip
</option>

<option value="double"
${alarms[i]?.sound==="double"?"selected":""}>
🔔🔔 Double bip
</option>

<option value="long"
${alarms[i]?.sound==="long"?"selected":""}>
📢 Bip long
</option>

</select>

</div>

`;

}).join("")}

<button
class="primary"
onclick="saveTimer('${id||""}')"
>

Enregistrer

</button>

${timer?

`

<button
class="dangerButton"
onclick="deletePreset('${timer.id}')"
>

Supprimer cette cuisson

</button>

`
:
""
}

<button
class="secondary"
onclick="closeModal()"
>

Annuler

</button>

`);

}


function saveTimer(id){

const name=
$("timerName")
.value
.trim();

const emoji=
$("timerEmoji")
.value
.trim()
||
"🍔";

const duration=
(
Number($("timerMinutes").value)||0
)
*
60
+
(
Number($("timerSeconds").value)||0
);

if(!name||duration<=0){

toast("Nom et durée obligatoires");

return;

}

const alarms=[];

for(let i=0;i<3;i++){

const value=
$("alarm"+i).value;

if(value!==""){

alarms.push({

before:Number(value),

sound:$("sound"+i).value

});

}

}

if(id){

const timer=
data.presets.find(
p=>p.id===id
);

Object.assign(timer,{

emoji,
name,
duration,
alarms

});

}else{

data.presets.push({

id:uid(),
emoji,
name,
duration,
alarms

});

}

save();

closeModal();

render();

toast("Cuisson enregistrée");

}


function deletePreset(id){

data.presets=
data.presets.filter(
p=>p.id!==id
);

save();

closeModal();

render();

}


/* =====================================================
   DÉMARRER MINUTEUR
===================================================== */

function startTimer(id){

const preset=
data.presets.find(
p=>p.id===id
);

if(!preset)return;

data.active.push({

id:uid(),

emoji:preset.emoji,

name:preset.name,

duration:preset.duration,

remaining:preset.duration,

alarms:preset.alarms.map(
a=>({...a})
),

fired:[],

paused:false,

finished:false

});

save();

render();

}


/* =====================================================
   PAUSE
===================================================== */

function pauseTimer(id){

const timer=
data.active.find(
t=>t.id===id
);

if(!timer)return;

timer.paused=
!timer.paused;

save();

render();

}


/* =====================================================
   SUPPRIMER MINUTEUR
===================================================== */

function deleteActiveTimer(id){

data.active=
data.active.filter(
t=>t.id!==id
);

save();

render();

}


/* =====================================================
   AFFICHAGE MINUTEURS
===================================================== */

function renderTimers(){

if(!data.active.length){

$("activeTimers").innerHTML=`

<div
class="empty"
style="grid-column:1/-1"
>

⏱️ Aucun minuteur en cours

</div>

`;

return;

}

$("activeTimers").innerHTML=
data.active.map(function(timer){

return `

<div class="timerCard">

<div class="timerEmoji">

${esc(timer.emoji)}

</div>

<div class="timerTitle">

${esc(timer.name)}

</div>

<div class="timerTime">

${formatTime(timer.remaining)}

</div>

<div class="timerButtons">

<button
onclick="pauseTimer('${timer.id}')"
>

${timer.paused
?"▶️ Reprendre"
:"⏸️ Pause"}

</button>

<button
class="delete"
onclick="deleteActiveTimer('${timer.id}')"
>

✕

</button>

</div>

</div>

`;

}).join("");

}


/* =====================================================
   PRÉSETS
===================================================== */

function renderPresets(){

if(!data.presets.length){

$("presets").innerHTML=`

<div
class="empty"
style="grid-column:1/-1"
>

Aucune cuisson enregistrée.

</div>

`;

return;

}

$("presets").innerHTML=
data.presets.map(function(p){

return `

<div
class="preset"
onclick="startTimer('${p.id}')"
>

<div class="presetEmoji">

${esc(p.emoji)}

</div>

<div class="presetName">

${esc(p.name)}

</div>

<div class="presetTime">

${formatTime(p.duration)}

·

${p.alarms.length}
sonnerie(s)

</div>

<button
class="presetEdit"
onclick="event.stopPropagation();openTimerEditor('${p.id}')"
>

✏️ Modifier

</button>

</div>

`;

}).join("");

}


/* =====================================================
   CHECKLISTS
===================================================== */

function openListEditor(id=null){

const list=
data.lists.find(
l=>l.id===id
);

openModal(`

<h2>
${list?"✏️ Modifier":"➕ Nouvelle"} checklist
</h2>

<div class="field">

<label>Nom</label>

<input
id="listName"
value="${esc(list?.name||"")}"
placeholder="Ex : Ouverture"
/>

</div>

<button
class="primary"
onclick="saveList('${id||""}')"
>

Enregistrer

</button>

${list?

`

<button
class="dangerButton"
onclick="deleteList('${list.id}')"
>

Supprimer la checklist

</button>

`
:
""
}

<button
class="secondary"
onclick="closeModal()"
>

Annuler

</button>

`);

}


function saveList(id){

const name=
$("listName")
.value
.trim();

if(!name)return;

if(id){

data.lists.find(
l=>l.id===id
).name=name;

}else{

data.lists.push({

id:uid(),

name,

items:[]

});

}

save();

closeModal();

render();

}


function deleteList(id){

data.lists=
data.lists.filter(
l=>l.id!==id
);

save();

closeModal();

render();

}


function addTask(listId){

const text=
prompt(
"Nouvelle tâche"
);

if(!text)return;

const list=
data.lists.find(
l=>l.id===listId
);

list.items.push({

});

function toggleTask(listId,itemId){

const list=
data.lists.find(
l=>l.id===listId
);

const item=
list.items.find(
i=>i.id===itemId
);

item.done=
!item.done;

save();

render();

}


function deleteTask(listId,itemId){

const list=
data.lists.find(
l=>l.id===listId
);

list.items=
list.items.filter(
i=>i.id!==itemId
);

save();

render();

}

data.products.find(

}

function cycleProduct(id){

const product=
data.products.find(
p=>p.id===id
);

if(product.status==="ok"){

product.status="soon";

}else if(product.status==="soon"){

product.status="todo";

}else{

product.status="ok";

}

save();

render();

}


function renderProducts(){

if(!data.products.length){

$("productsContainer").innerHTML=`

<div class="empty">

🛒 Aucun produit

</div>

return;

$("productsContainer").innerHTML=
data.products.map(function(product){

let text=
product.status==="ok"
?
"Disponible"
:
product.status==="soon"
?
"Bientôt fini"
:
"À refaire";

let cls=
product.status==="ok"
?
"status-ok"
:
product.status==="soon"
?
"status-soon"
:
"status-todo";

return `

<div class="product">

<div>

<strong>

${esc(product.emoji)}

style="color:#888;font-size:13px;margin-top:3px"

${product.status==="ok"
?"Bientôt fini →"
:
product.status==="soon"
?"À refaire →"
:
"✓ Fait"}

<button
class="addButton"
onclick="openProductEditor('${product.id}')"
>

⚙️

</button>

}).join("");

}

/* =====================================================
   SONNERIES
===================================================== */

function playSound(type){

try{

audioContext=
audioContext
||
new AudioContext();

const count=
type==="double"
?
2
:
1;

for(let i=0;i<count;i++){

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.frequency.value=
type==="long"
?
620
:
880;

gain.gain.value=.12;

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

const start=
audioContext.currentTime
+
i*.18;

oscillator.start(start);

oscillator.stop(
start+
(
type==="long"
?
1
:
.25
)
);

}

}catch(e){}

}


/* =====================================================
   TICK DES MINUTEURS
===================================================== */

function updateTimers(){

let changed=false;

data.active.forEach(function(timer){

if(timer.paused)return;

const previous=
timer.remaining;

timer.remaining=
Math.max(
0,
timer.remaining-.5
);

timer.alarms.forEach(
function(alarm,index){

if(
!timer.fired.includes(index)
&&
previous>alarm.before
&&
timer.remaining<=alarm.before
){

timer.fired.push(index);

playSound(
alarm.sound
);

toast(
timer.emoji+
" "+
timer.name+
" — sonnerie 🔔"
);

}

});

if(
timer.remaining===0
&&
!timer.finished
){

timer.finished=true;

playSound("long");

if(
navigator.vibrate
){

navigator.vibrate(
[
500,
200,
500
]
);

}

toast(
timer.emoji+
" "+
timer.name+
" est terminé !"
);

}

if(previous!==timer.remaining){

changed=true;

}

});

if(changed){

save();

renderTimers();

}

}
