<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mon Appartement 3D</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #b9d7e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #b9d7e5;
    transition: opacity .5s;
}

.loadingBox {
    text-align: center;
    color: #17212b;
}

.loadingHouse {
    font-size: 60px;
    margin-bottom: 15px;
}

.loadingText {
    font-size: 24px;
    font-weight: 800;
}

#ui {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
}

.topbar {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
}

.title {
    background: rgba(255,255,255,.92);
    padding: 15px 22px;
    border-radius: 18px;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

.room {
    background: rgba(255,255,255,.92);
    padding: 15px 20px;
    border-radius: 18px;
    font-weight: 700;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

#info {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    min-width: 240px;
    max-width: 85%;
    padding: 15px 20px;
    border-radius: 18px;
    background: rgba(255,255,255,.94);
    color: #17212b;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    font-weight: 700;
    opacity: 0;
    transition: opacity .25s;
}

#controls {
    position: absolute;
    right: 18px;
    bottom: 90px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: auto;
}

.control {
    width: 54px;
    height: 54px;
    border: none;
    border-radius: 17px;
    background: rgba(255,255,255,.94);
    font-size: 25px;
    box-shadow: 0 6px 20px rgba(0,0,0,.16);
}

.control:active {
    transform: scale(.92);
}

#help {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    padding: 10px 15px;
    border-radius: 14px;
    background: rgba(255,255,255,.82);
    font-size: 13px;
    color: #44515c;
    pointer-events: none;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<div id="loading">
    <div class="loadingBox">
        <div class="loadingHouse">🏠</div>
        <div class="loadingText">Construction de l’appartement…</div>
    </div>
</div>

<div id="ui">

    <div class="topbar">
        <div class="title">🏠 MON APPARTEMENT</div>
        <div class="room" id="roomName">Salon</div>
    </div>

    <div id="info"></div>

    <div id="controls">
        <button class="control" id="zoomIn">＋</button>
        <button class="control" id="zoomOut">−</button>
        <button class="control" id="light">🌙</button>
        <button class="control" id="home">⌂</button>
    </div>

    <div id="help">
        👆 Glisse pour regarder autour de toi · 👆 Touche les objets
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>

<script>

let scene;
let camera;
let renderer;
let controls;

let night = false;
let selectedObject = null;

const objects = [];

const roomName = document.getElementById("roomName");
const info = document.getElementById("info");
const loading = document.getElementById("loading");

init();

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0xb9d7e5);

    scene.fog = new THREE.Fog(
        0xb9d7e5,
        12,
        45
    );

    camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

    camera.position.set(
        11,
        9,
        13
    );

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.body.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = .07;

    controls.minDistance = 5;
    controls.maxDistance = 28;

    controls.maxPolarAngle = Math.PI / 2.05;

    controls.target.set(
        0,
        1,
        0
    );

    createLights();

    createApartment();

    setupInteraction();

    setupButtons();

    window.addEventListener(
        "resize",
        resize
    );

    setTimeout(() => {

        loading.style.opacity = "0";

        setTimeout(() => {
            loading.remove();
        }, 600);

    }, 700);

    animate();
}


/* =========================
   LUMIÈRES
========================= */

function createLights() {

    const ambient = new THREE.HemisphereLight(
        0xffffff,
        0x6b7780,
        1.8
    );

    scene.add(ambient);

    const sun = new THREE.DirectionalLight(
        0xffffff,
        2.4
    );

    sun.position.set(
        8,
        15,
        8
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    sun.shadow.camera.left = -20;
    sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20;
    sun.shadow.camera.bottom = -20;

    scene.add(sun);

    window.sun = sun;
}


/* =========================
   APPARTEMENT
========================= */

function createApartment() {

    createFloor();

    createWalls();

    createLivingRoom();

    createKitchen();

    createBedroom();

    createBathroom();

    createDecorations();

}


/* =========================
   SOL
========================= */

function createFloor() {

    const floorMat = new THREE.MeshStandardMaterial({
        color: 0xc5a27e,
        roughness: .75
    });

    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(
            22,
            .3,
            18
        ),
        floorMat
    );

    floor.position.y = -0.15;

    floor.receiveShadow = true;

    scene.add(floor);

}


/* =========================
   MURS
========================= */

function createWalls() {

    const wallMat = new THREE.MeshStandardMaterial({
        color: 0xf1eee5,
        roughness: .9
    });

    const blueWall = new THREE.MeshStandardMaterial({
        color: 0xc9dfe9
    });

    createWall(
        22,
        4.5,
        .35,
        0,
        2.25,
        -9,
        wallMat
    );

    createWall(
        .35,
        4.5,
        18,
        -11,
        2.25,
        0,
        wallMat
    );

    createWall(
        .35,
        4.5,
        18,
        11,
        2.25,
        0,
        wallMat
    );

    createWall(
        22,
        4.5,
        .35,
        0,
        2.25,
        9,
        wallMat
    );

    /*
      séparation salon / chambre
    */

    createWall(
        .25,
        4.2,
        9,
        2.5,
        2.1,
        -4.5,
        wallMat
    );

    /*
      séparation cuisine
    */

    createWall(
        7,
        4.2,
        .25,
        -7.5,
        2.1,
        2,
        wallMat
    );

}


function createWall(
    w,
    h,
    d,
    x,
    y,
    z,
    mat
) {

    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        mat
    );

    wall.position.set(x,y,z);

    wall.castShadow = true;
    wall.receiveShadow = true;

    scene.add(wall);
}

function createSofa(x,y,z) {

    const mat = new THREE.MeshStandardMaterial({
        color: 0x5f6b6b,
        roughness: .9
    });

    const sofa = new THREE.Group();

    const seat = new THREE.Mesh(
        new THREE.BoxGeometry(
            5,
            .65,
            1.8
        ),
        mat
    );

    seat.position.y = .65;

    sofa.add(seat);

    const back = new THREE.Mesh(
        new THREE.BoxGeometry(
            5,
            1.8,
            .45
        ),
        mat
    );

    back.position.set(
        0,
        1.35,
        -.7
    );

    sofa.add(back);

    const arm1 = new THREE.Mesh(
        new THREE.BoxGeometry(
            .45,
            1.25,
            1.8
        ),
        mat
    );

    arm1.position.set(
        -2.3,
        1,
        0
    );

    sofa.add(arm1);

    const arm2 = arm1.clone();

    arm2.position.x = 2.3;

    sofa.add(arm2);

    sofa.position.set(
        x,
        y,
        z
    );

    sofa.rotation.y = -.25;

    addClickable(
        sofa,
        "Canapé",
        "Un canapé confortable pour se poser."
    );

    scene.add(sofa);
}


function createTable(x,y,z) {

    const wood = new THREE.MeshStandardMaterial({
        color: 0x8b5a35,
        roughness: .7
    });

    const group = new THREE.Group();

    const top = new THREE.Mesh(
        new THREE.BoxGeometry(
            3.2,
            .25,
            1.5
        ),
        wood
    );

    top.position.y = 1;

    group.add(top);

    for(let i = -1; i <= 1; i += 2) {

        for(let j = -1; j <= 1; j += 2) {

            const leg = new THREE.Mesh(
                new THREE.BoxGeometry(
                    .15,
                    1,
                    .15
                ),
                wood
            );

            leg.position.set(
                i * 1.3,
                .5,
                j * .55
            );

            group.add(leg);
        }
    }

    group.position.set(
        x,
        y,
        z
    );

    addClickable(
        group,
        "Table basse",
        "Table basse en bois."
    );

    scene.add(group);
}

/* =========================
   OBJETS CLIQUABLES
========================= */

function addClickable(
    object,
    title,
    description
) {

    object.userData.clickable = true;
    object.userData.title = title;
    object.userData.description = description;

    objects.push(object);
}


/* =========================
   INTERACTION
========================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

function setupInteraction() {

    renderer.domElement.addEventListener(
        "pointerdown",
        event => {

            mouse.x =
                (event.clientX / window.innerWidth) * 2 - 1;

            mouse.y =
                -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(
                mouse,
                camera
            );

            const hits =
                raycaster.intersectObjects(
                    scene.children,
                    true
                );

            for(const hit of hits) {

                let obj = hit.object;

                while(
                    obj &&
                    !obj.userData.clickable
                ) {
                    obj = obj.parent;
                }

                if(
                    obj &&
                    obj.userData.clickable
                ) {

                    showInfo(
                        obj.userData.title,
                        obj.userData.description
                    );

                    return;
                }
            }
        }
    );
}


function showInfo(title,description) {

    info.innerHTML =
        "<strong>" +
        title +
        "</strong><br>" +
        description;

    info.style.opacity = "1";

    clearTimeout(window.infoTimer);

    window.infoTimer =
        setTimeout(() => {
            info.style.opacity = "0";
        }, 3500);
}


/* =========================
   BOUTONS
========================= */

function setupButtons() {

    document
        .getElementById("zoomIn")
        .onclick = () => {

            controls.dollyIn(1.25);
            controls.update();

        };

    document
        .getElementById("zoomOut")
        .onclick = () => {

            controls.dollyOut(1.25);
            controls.update();

        };

    document
        .getElementById("home")
        .onclick = () => {

            camera.position.set(
                11,
                9,
                13
            );

            controls.target.set(
                0,
                1,
                0
            );

            controls.update();

        };

    document
        .getElementById("light")
        .onclick = () => {

            night = !night;

            if(night) {

                scene.background =
                    new THREE.Color(0x101826);

                scene.fog.color =
                    new THREE.Color(0x101826);

                window.sun.intensity = .35;

                document.getElementById(
                    "light"
                ).textContent = "☀️";

            } else {

                scene.background =
                    new THREE.Color(0xb9d7e5);

                scene.fog.color =
                    new THREE.Color(0xb9d7e5);

                window.sun.intensity = 2.4;

                document.getElementById(
                    "light"
                ).textContent = "🌙";
            }
        };
}


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


/* =========================
   RESIZE
========================= */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

</script>

</body>
</html>
