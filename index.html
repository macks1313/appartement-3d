<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mon Appartement 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#10151b;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#interface{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

.top{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo,.room{
    background:rgba(255,255,255,.94);
    color:#17212b;
    border-radius:20px;
    padding:15px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.22);
    font-weight:900;
    backdrop-filter:blur(10px);
}

.logo{
    font-size:20px;
}

.room{
    font-size:17px;
}

.buttons{
    position:absolute;
    right:18px;
    bottom:105px;
    display:flex;
    flex-direction:column;
    gap:12px;
    pointer-events:auto;
}

button{
    width:58px;
    height:58px;
    border:0;
    border-radius:20px;
    background:rgba(255,255,255,.95);
    color:#18222c;
    font-size:28px;
    font-weight:900;
    box-shadow:0 10px 28px rgba(0,0,0,.22);
}

button:active{
    transform:scale(.92);
}

.help{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:max-content;
    max-width:90%;
    padding:13px 20px;
    background:rgba(255,255,255,.92);
    border-radius:18px;
    color:#4d5b68;
    font-weight:800;
    font-size:14px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

#info{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translateX(-50%);
    background:rgba(255,255,255,.95);
    border-radius:20px;
    padding:16px 24px;
    min-width:230px;
    text-align:center;
    color:#18222c;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    opacity:0;
    transition:.25s;
}

#info strong{
    font-size:18px;
}

@media(max-width:600px){
    .logo{
        font-size:17px;
        padding:14px 17px;
    }

    .room{
        font-size:15px;
        padding:14px 16px;
    }

    .help{
        font-size:13px;
        white-space:nowrap;
        overflow:hidden;
    }
}
</style>
</head>

<body>

<div id="interface">

    <div class="top">
        <div class="logo">🏠 MON APPARTEMENT</div>
        <div class="room" id="room">Salon</div>
    </div>

    <div id="info"></div>

    <div class="buttons">
        <button id="plus">＋</button>
        <button id="minus">−</button>
        <button id="light">☀️</button>
        <button id="home">⌂</button>
    </div>

    <div class="help">
        👆 Glisse pour regarder · 🤏 Pince pour zoomer · 👆 Touche les objets
    </div>

</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

/* =========================================================
   VARIABLES
========================================================= */

let scene;
let camera;
let renderer;
let controls;

let night=false;

const clickable=[];

const roomLabel=document.getElementById("room");
const info=document.getElementById("info");


/* =========================================================
   INITIALISATION
========================================================= */

function start(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x9fc4d5);

    scene.fog=new THREE.Fog(
        0x9fc4d5,
        18,
        50
    );

    camera=new THREE.PerspectiveCamera(
        58,
        innerWidth/innerHeight,
        .1,
        100
    );

    camera.position.set(
        14,
        10,
        15
    );

    renderer=new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,1.8)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;

    document.body.appendChild(renderer.domElement);

    controls=new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping=true;
    controls.dampingFactor=.06;

    controls.minDistance=5;
    controls.maxDistance=30;

    controls.maxPolarAngle=Math.PI/2.08;

    controls.target.set(
        0,
        2,
        0
    );

    lights();

    apartment();

    interactions();

    buttons();

    addEventListener("resize",resize);

    animate();
}


/* =========================================================
   LUMIERES
========================================================= */

function lights(){

    const ambient=new THREE.HemisphereLight(
        0xffffff,
        0x59636d,
        1.8
    );

    scene.add(ambient);

    const sun=new THREE.DirectionalLight(
        0xfff5dc,
        3
    );

    sun.position.set(
        -10,
        18,
        10
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    sun.shadow.camera.left=-20;
    sun.shadow.camera.right=20;
    sun.shadow.camera.top=20;
    sun.shadow.camera.bottom=-20;

    scene.add(sun);

    window.sun=sun;

    /* lumières intérieures */

    addLight(-5,4,3,0xffd7a0,2.5,8);
    addLight(4,4,-2,0xffe2b2,2.2,8);
    addLight(7,3,6,0xffd7a0,1.8,7);
    addLight(-7,3,-6,0xffe1bd,1.8,7);
}

function addLight(x,y,z,color,intensity,distance){

    const light=new THREE.PointLight(
        color,
        intensity,
        distance
    );

    light.position.set(x,y,z);

    scene.add(light);
}


/* =========================================================
   MATERIAUX
========================================================= */

function mat(color,rough=.7,metal=0){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:rough,
        metalness:metal
    });
}

const WALL=mat(0xf0eadf,.95);
const FLOOR=mat(0x9b6b46,.72);
const WOOD=mat(0x68432d,.7);
const DARKWOOD=mat(0x35231b,.65);
const FABRIC=mat(0x536d72,.95);
const CREAM=mat(0xe9dfcf,.95);
const WHITE=mat(0xf8f6ef,.8);
const BLACK=mat(0x111315,.3,.15);
const GREEN=mat(0x315c3d,.85);


/* =========================================================
   APPARTEMENT
========================================================= */

function apartment(){

    floor();

    walls();

    livingRoom();

    kitchen();

    bedroom();

    bathroom();

    decoration();

}


/* =========================================================
   SOL
========================================================= */

function floor(){

    const f=new THREE.Mesh(
        new THREE.BoxGeometry(24,.35,20),
        FLOOR
    );

    f.position.y=-.18;

    f.receiveShadow=true;

    scene.add(f);

    /* lames du parquet */

    for(let x=-11;x<=11;x+=1.2){

        const line=new THREE.Mesh(
            new THREE.BoxGeometry(.025,.01,19.5),
            mat(0x68462f,1)
        );

        line.position.set(
            x,
            .01,
            0
        );

        scene.add(line);
    }
}


/* =========================================================
   MURS
========================================================= */

function walls(){

    wall(24,5,.35,0,2.5,-10,WALL);
    wall(.35,5,20,-12,2.5,0,WALL);
    wall(.35,5,20,12,2.5,0,WALL);

    /*
      mur arrière partiel
      pour garder la vue intérieure
    */

    wall(24,5,.35,0,2.5,10,WALL);

    /* séparation chambre */

    wall(.25,5,7,2,2.5,-6.5,WALL);

    /* séparation salle de bain */

    wall(7,4,.25,7,2,-2,WALL);

    /* séparation cuisine */

    wall(7,4,.25,-8,2,2,WALL);
}

function wall(w,h,d,x,y,z,material){

    const m=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        material
    );

    m.position.set(x,y,z);

    m.castShadow=true;
    m.receiveShadow=true;

    scene.add(m);
}


/* =========================================================
   CANAPE
========================================================= */

function livingRoom(){

    sofa(-3,0,4);

    coffeeTable(-1,0,1);

    television(5,3,-8.8);

    rug(-1,.03,2);

    shelf(-7,0,-8.7);
}

function sofa(x,y,z){

    const g=new THREE.Group();

    const seat=new THREE.Mesh(
        new THREE.BoxGeometry(5.4,.65,2),
        FABRIC
    );

    seat.position.y=.7;

    g.add(seat);

    const back=new THREE.Mesh(
        new THREE.BoxGeometry(5.4,1.8,.45),
        FABRIC
    );

    back.position.set(
        0,
        1.45,
        -.78
    );

    g.add(back);

    for(let s of [-2.45,2.45]){

        const arm=new THREE.Mesh(
            new THREE.BoxGeometry(.45,1.25,2),
            FABRIC
        );

        arm.position.set(
            s,
            1,
            0
        );

        g.add(arm);
    }

    /* coussins */

    for(let i=-1;i<=1;i++){

        const pillow=new THREE.Mesh(
            new THREE.BoxGeometry(
                1.35,
                .25,
                .75
            ),
            mat(
                i===0?0x8b6552:0x788f8e,
                .95
            )
        );

        pillow.position.set(
            i*1.55,
            1.15,
            -.25
        );

        pillow.rotation.z=(i*.03);

        g.add(pillow);
    }

    g.position.set(x,y,z);

    g.rotation.y=-.12;

    clickableObject(
        g,
        "Canapé",
        "Un grand canapé confortable."
    );

    scene.add(g);
}


/* =========================================================
   TABLE
========================================================= */

function coffeeTable(x,y,z){

    const g=new THREE.Group();

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(3.3,.25,1.6),
        WOOD
    );

    top.position.y=1;

    g.add(top);

    for(let x of [-1.25,1.25]){
        for(let z of [-.55,.55]){

            const leg=new THREE.Mesh(
                new THREE.BoxGeometry(.16,1,.16),
                DARKWOOD
            );

            leg.position.set(x,.5,z);

            g.add(leg);
        }
    }

    /* livre */

    const book=new THREE.Mesh(
        new THREE.BoxGeometry(.9,.08,.65),
        mat(0x7d332b, .9)
    );

    book.position.set(
        -.5,
        1.18,
        0
    );

    g.add(book);

    g.position.set(x,y,z);

    clickableObject(
        g,
        "Table basse",
        "Table basse en bois avec quelques objets décoratifs."
    );

    scene.add(g);
}


/* =========================================================
   TELEVISION
========================================================= */

function television(x,y,z){

    const g=new THREE.Group();

    const screen=new THREE.Mesh(
        new THREE.BoxGeometry(4.5,2.6,.16),
        BLACK
    );

    g.add(screen);

    const screenGlow=new THREE.Mesh(
        new THREE.BoxGeometry(4.1,2.2,.03),
        mat(0x182d3a,.25)
    );

    screenGlow.position.z=.1;

    g.add(screenGlow);

    const cabinet=new THREE.Mesh(
        new THREE.BoxGeometry(5.5,.65,1),
        DARKWOOD
    );

    cabinet.position.y=-1.65;

    g.add(cabinet);

    const foot1=new THREE.Mesh(
        new THREE.BoxGeometry(.15,.5,.5),
        BLACK
    );

    foot1.position.set(-1.8,-1.15,0);

    g.add(foot1);

    const foot2=foot1.clone();

    foot2.position.x=1.8;

    g.add(foot2);

    g.position.set(x,y,z);

    clickableObject(
        g,
        "Télévision",
        "Une grande télévision dans le salon."
    );

    scene.add(g);
}


/* =========================================================
   TAPIS
========================================================= */

function rug(x,y,z){

    const r=new THREE.Mesh(
        new THREE.BoxGeometry(7,.08,4.5),
        mat(0x6e8580,1)
    );

    r.position.set(x,y+.04,z);

    scene.add(r);

    /* motifs */

    for(let i=-2;i<=2;i++){

        const stripe=new THREE.Mesh(
            new THREE.BoxGeometry(.08,.02,4),
            mat(0xb0b6a5,1)
        );

        stripe.position.set(
            x+i*1.3,
            y+.1,
            z
        );

        scene.add(stripe);
    }
}


/* =========================================================
   CUISINE
========================================================= */

function kitchen(){

    for(let i=0;i<5;i++){

        const cabinet=new THREE.Mesh(
            new THREE.BoxGeometry(1.5,1.2,.75),
            WOOD
        );

        cabinet.position.set(
            -9+i*1.65,
            .6,
            -8.8
        );

        cabinet.castShadow=true;

        clickableObject(
            cabinet,
            "Meuble de cuisine",
            "Meuble bas en bois."
        );

        scene.add(cabinet);
    }

    const counter=new THREE.Mesh(
        new THREE.BoxGeometry(8.5,.22,1),
        CREAM
    );

    counter.position.set(
        -5.7,
        1.3,
        -8.8
    );

    scene.add(counter);

    /* plaque de cuisson */

    const hob=new THREE.Mesh(
        new THREE.BoxGeometry(2,.05,.65),
        BLACK
    );

    hob.position.set(
        -3.5,
        1.44,
        -8.8
    );

    scene.add(hob);

    /* évier */

    const sink=new THREE.Mesh(
        new THREE.BoxGeometry(1.4,.08,.6),
        mat(0x9ca6ab,.25,.75)
    );

    sink.position.set(
        -6.3,
        1.44,
        -8.8
    );

    clickableObject(
        sink,
        "Évier",
        "Évier avec robinet métallique."
    );

    scene.add(sink);

    /* robinet */

    const faucet=new THREE.Mesh(
        new THREE.CylinderGeometry(.06,.06,.8,12),
        mat(0x969da0,.2,.9)
    );

    faucet.position.set(
        -6.3,
        1.8,
        -8.6
    );

    scene.add(faucet);

    /* frigo */

    refrigerator();

    /* hotte */

    const hood=new THREE.Mesh(
        new THREE.BoxGeometry(2.2,.4,.6),
        mat(0x777d80,.3,.4)
    );

    hood.position.set(
        -3.5,
        3.1,
        -8.5
    );

    scene.add(hood);
}


/* =========================================================
   FRIGO
========================================================= */

function refrigerator(){

    const g=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(1.4,3.8,1.1),
        mat(0xd7dcde,.3,.25)
    );

    body.position.y=1.9;

    g.add(body);

    const handle=new THREE.Mesh(
        new THREE.BoxGeometry(.07,1.5,.08),
        BLACK
    );

    handle.position.set(
        .55,
        2,
        -.58
    );

    g.add(handle);

    g.position.set(
        -10.3,
        0,
        -7.3
    );

    clickableObject(
        g,
        "Réfrigérateur",
        "Le réfrigérateur de la cuisine."
    );

    scene.add(g);
}


/* =========================================================
   CHAMBRE
========================================================= */

function bedroom(){

    const bed=new THREE.Group();

    const frame=new THREE.Mesh(
        new THREE.BoxGeometry(4.8,.45,6),
        DARKWOOD
    );

    frame.position.y=.5;

    bed.add(frame);

    const mattress=new THREE.Mesh(
        new THREE.BoxGeometry(4.5,.55,5.7),
        WHITE
    );

    mattress.position.y=.85;

    bed.add(mattress);

    const blanket=new THREE.Mesh(
        new THREE.BoxGeometry(4.3,.16,3.2),
        mat(0x647f84,.95)
    );

    blanket.position.set(
        0,
        1.18,
        1
    );

    bed.add(blanket);

    /* oreillers */

    for(let x of [-1.2,1.2]){

        const pillow=new THREE.Mesh(
            new THREE.BoxGeometry(
                1.7,
                .35,
                1
            ),
            WHITE
        );

        pillow.position.set(
            x,
            1.2,
            -1.75
        );

        bed.add(pillow);
    }

    /* tête de lit */

    const head=new THREE.Mesh(
        new THREE.BoxGeometry(4.8,2,.3),
        WOOD
    );

    head.position.set(
        0,
        1.35,
        -2.9
    );

    bed.add(head);

    bed.position.set(
        6.5,
        0,
        3.5
    );

    bed.rotation.y=-.12;

    clickableObject(
        bed,
        "Lit",
        "Un grand lit avec oreillers et couverture."
    );

    scene.add(bed);

    bedside(
        3.8,
        0,
        1
    );

    bedside(
        9.2,
        0,
        1
    );
}


/* =========================================================
   CHEVET
========================================================= */

function bedside(x,y,z){

    const g=new THREE.Group();

    const table=new THREE.Mesh(
        new THREE.BoxGeometry(1.1,.8,.9),
        WOOD
    );

    table.position.y=.4;

    g.add(table);

    const lamp=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .3,
            .42,
            .45,
            20
        ),
        mat(0xe4c98f,.9)
    );

    lamp.position.y=1.05;

    g.add(lamp);

    g.position.set(x,y,z);

    scene.add(g);
}


/* =========================================================
   SALLE DE BAIN
========================================================= */

function bathroom(){

    /* baignoire */

    const bath=new THREE.Mesh(
        new THREE.BoxGeometry(4,.7,1.8),
        WHITE
    );

    bath.position.set(
        7,
        .4,
        -7
    );

    clickableObject(
        bath,
        "Baignoire",
        "Une grande baignoire."
    );

    scene.add(bath);

    const water=new THREE.Mesh(
        new THREE.BoxGeometry(3.4,.05,1.25),
        mat(0x79c9e2,.15,.1)
    );

    water.position.set(
        7,
        .78,
        -7
    );

    scene.add(water);

    /* lavabo */

    const vanity=new THREE.Mesh(
        new THREE.BoxGeometry(1.8,1,.8),
        WOOD
    );

    vanity.position.set(
        4,
        .5,
        -6.5
    );

    scene.add(vanity);

    const basin=new THREE.Mesh(
        new THREE.BoxGeometry(1.4,.12,.6),
        WHITE
    );

    basin.position.set(
        4,
        1.05,
        -6.5
    );

    clickableObject(
        basin,
        "Lavabo",
        "Le lavabo de la salle de bain."
    );

    scene.add(basin);

    /* miroir */

    const mirror=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.8,
            2,
            .08
        ),
        mat(0x9ed3e2,.12,.3)
    );

    mirror.position.set(
        4,
        2.4,
        -7
    );

    scene.add(mirror);
}


/* =========================================================
   DECORATION
========================================================= */

function decoration(){

    plant(-9,0,5);
    plant(10,0,6);

    plant(8,0,-5);

    lamp(1,0,4);

    windowObject(-5,3,-9.78);
    windowObject(8,3,9.78);

    bookshelf();

    pictures();
}


/* =========================================================
   PLANTE
========================================================= */

function plant(x,y,z){

    const g=new THREE.Group();

    const pot=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .45,.32,.65,18
        ),
        mat(0xa96245,.9)
    );

    pot.position.y=.33;

    g.add(pot);

    for(let i=0;i<9;i++){

        const leaf=new THREE.Mesh(
            new THREE.SphereGeometry(
                .42,
                10,
                10
            ),
            GREEN
        );

        leaf.position.set(
            Math.sin(i*.8)*.4,
            .8+Math.random()*.8,
            Math.cos(i*.8)*.4
        );

        leaf.scale.set(
            .65,
            1.3,
            .5
        );

        g.add(leaf);
    }

    g.position.set(x,y,z);

    clickableObject(
        g,
        "Plante",
        "Une plante décorative."
    );

    scene.add(g);
}


/* =========================================================
   LAMPE
========================================================= */

function lamp(x,y,z){

    const g=new THREE.Group();

    const base=new THREE.Mesh(
        new THREE.CylinderGeometry(.35,.4,.12,20),
        BLACK
    );

    base.position.y=.06;

    g.add(base);

    const pole=new THREE.Mesh(
        new THREE.CylinderGeometry(.06,.06,2.3,12),
        BLACK
    );

    pole.position.y=1.2;

    g.add(pole);

    const shade=new THREE.Mesh(
        new THREE.ConeGeometry(
            .65,.8,24,1,true
        ),
        new THREE.MeshStandardMaterial({
            color:0xe5c98c,
            side:THREE.DoubleSide
        })
    );

    shade.position.y=2.5;

    g.add(shade);

    const bulb=new THREE.PointLight(
        0xffd69a,
        1.8,
        6
    );

    bulb.position.y=2.2;

    g.add(bulb);

    g.position.set(x,y,z);

    clickableObject(
        g,
        "Lampe",
        "Une lampe qui éclaire le salon."
    );

    scene.add(g);
}


/* =========================================================
   FENETRES
========================================================= */

function windowObject(x,y,z){

    const frame=new THREE.Mesh(
        new THREE.BoxGeometry(
            5,
            2.5,
            .18
        ),
        WHITE
    );

    frame.position.set(x,y,z);

    scene.add(frame);

    const glass=new THREE.Mesh(
        new THREE.BoxGeometry(
            4.5,
            2,
            .08
        ),
        new THREE.MeshStandardMaterial({
            color:0x74b9d4,
            transparent:true,
            opacity:.7,
            roughness:.1
        })
    );

    glass.position.set(
        x,
        y,
        z+(z>0?.1:-.1)
    );

    clickableObject(
        glass,
        "Fenêtre",
        "Une grande fenêtre avec vue extérieure."
    );

    scene.add(glass);
}


/* =========================================================
   BIBLIOTHEQUE
========================================================= */

function bookshelf(){

    const g=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            2.5,
            4,
            .5
        ),
        DARKWOOD
    );

    body.position.y=2;

    g.add(body);

    for(let y of [.7,1.7,2.7,3.7]){

        const shelf=new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                .12,
                .7
            ),
            WOOD
        );

        shelf.position.set(
            0,
            y,
            -.15
        );

        g.add(shelf);

        for(let i=0;i<5;i++){

            const book=new THREE.Mesh(
                new THREE.BoxGeometry(
                    .25+Math.random()*.15,
                    .65,
                    .35
                ),
                mat(
                    [
                        0x7c4036,
                        0x435c68,
                        0x8c744c,
                        0x5c6848
                    ][i%4],
                    .95
                )
            );

            book.position.set(
                -0.8+i*.38,
                y+.4,
                -.2
            );

            g.add(book);
        }
    }

    g.position.set(
        -9,
        0,
        -8.8
    );

    scene.add(g);
}

/* =========================================================
   OBJETS CLIQUABLES
========================================================= */

function clickableObject(object,title,text){

    object.userData.clickable=true;
    object.userData.title=title;
    object.userData.text=text;

    clickable.push(object);
}


/* =========================================================
   INTERACTIONS
========================================================= */

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function interactions(){

    renderer.domElement.addEventListener(
        "pointerup",
        e=>{

            pointer.x=
                (e.clientX/innerWidth)*2-1;

            pointer.y=
                -(e.clientY/innerHeight)*2+1;

            raycaster.setFromCamera(
                pointer,
                camera
            );

            const hits=raycaster.intersectObjects(
                clickable,
                true
            );

            if(!hits.length)return;

            let obj=hits[0].object;

            while(
                obj &&
                !obj.userData.clickable
            ){
                obj=obj.parent;
            }

            if(obj && obj.userData.clickable){

                info.innerHTML=
                    "<strong>"+
                    obj.userData.title+
                    "</strong><br>"+
                    obj.userData.text;

                info.style.opacity="1";

                clearTimeout(window.infoTimer);

                window.infoTimer=setTimeout(()=>{
                    info.style.opacity="0";
                },3500);
            }
        }
    );
}


/* =========================================================
   BOUTONS
========================================================= */

function buttons(){

    document.getElementById("plus").onclick=()=>{

        controls.dollyIn(1.25);
        controls.update();
    };

    document.getElementById("minus").onclick=()=>{

        controls.dollyOut(1.25);
        controls.update();
    };

    document.getElementById("home").onclick=()=>{

        camera.position.set(
            14,
            10,
            15
        );

        controls.target.set(
            0,
            2,
            0
        );

        controls.update();
    };

    document.getElementById("light").onclick=()=>{

        night=!night;

        if(night){

            scene.background.set(0x111722);
            scene.fog.color.set(0x111722);
            sun.intensity=.35;

            document.getElementById(
                "light"
            ).textContent="🌙";

        }else{

            scene.background.set(0x9fc4d5);
            scene.fog.color.set(0x9fc4d5);
            sun.intensity=3;

            document.getElementById(
                "light"
            ).textContent="☀️";
        }
    };
}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
}


/* =========================================================
   DEMARRAGE DIRECT
========================================================= */

start();

</script>
