<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Appartement 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#111827;
}

body{
    color:#18212b;
}

/* =========================
   APP
========================= */

#app{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 20%,#dff5ff 0%,#a7d0df 48%,#7597a5 100%);
    transition:.5s;
}

#app.night{
    background:
        radial-gradient(circle at 50% 15%,#273b5b 0%,#101827 55%,#080c13 100%);
}

/* =========================
   HEADER
========================= */

header{
    position:absolute;
    z-index:20;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo,
.roomName{
    background:rgba(255,255,255,.94);
    box-shadow:0 15px 40px rgba(0,0,0,.18);
    border-radius:24px;
    backdrop-filter:blur(15px);
}

.logo{
    padding:17px 24px;
    font-size:22px;
    font-weight:900;
    letter-spacing:-.5px;
}

.roomName{
    padding:17px 23px;
    font-weight:800;
    font-size:17px;
}

/* =========================
   SCENE
========================= */

.scene{
    position:absolute;
    left:50%;
    top:52%;
    width:850px;
    height:560px;
    transform:
        translate(-50%,-50%)
        perspective(1100px)
        rotateX(58deg)
        rotateZ(-1deg);
    transform-style:preserve-3d;
    transition:.5s;
}

.floor{
    position:absolute;
    left:0;
    top:0;
    width:850px;
    height:560px;

    background:
        linear-gradient(90deg,
            rgba(0,0,0,.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            rgba(0,0,0,.04) 1px,
            transparent 1px
        ),
        #c99765;

    background-size:42px 42px;
    border:12px solid #eee9df;

    box-shadow:
        0 35px 60px rgba(0,0,0,.3),
        inset 0 0 50px rgba(0,0,0,.1);

    transform-style:preserve-3d;
}

/* =========================
   ROOMS
========================= */

.room{
    position:absolute;
    background:#eee9df;
    border:6px solid #ddd6c9;
    box-shadow:inset 0 0 30px rgba(0,0,0,.06);
}

.roomLabel{
    position:absolute;
    left:18px;
    top:15px;
    padding:7px 14px;
    border-radius:12px;
    background:rgba(255,255,255,.88);
    font-size:13px;
    font-weight:900;
    letter-spacing:1px;
    color:#596570;
}

/* salon */

.living{
    left:20px;
    top:20px;
    width:480px;
    height:300px;
}

/* chambre */

.bedroom{
    right:20px;
    top:20px;
    width:310px;
    height:300px;
}

/* cuisine */

.kitchen{
    left:20px;
    bottom:20px;
    width:300px;
    height:200px;
}

/* salle de bain */

.bathroom{
    right:20px;
    bottom:20px;
    width:310px;
    height:200px;
}

/* =========================
   WALLS
========================= */

.wall{
    position:absolute;
    background:#f7f3eb;
    box-shadow:0 8px 15px rgba(0,0,0,.12);
}

.wall.back{
    left:0;
    top:-18px;
    width:100%;
    height:18px;
}

.wall.left{
    left:-18px;
    top:0;
    width:18px;
    height:100%;
}

/* =========================
   SOFA
========================= */

.sofa{
    position:absolute;
    left:70px;
    bottom:55px;
    width:245px;
    height:105px;
    cursor:pointer;
    transform:translateZ(20px);
}

.sofaSeat{
    position:absolute;
    left:0;
    bottom:0;
    width:245px;
    height:55px;
    border-radius:14px;
    background:
        linear-gradient(#697d82,#4d6166);
    box-shadow:0 12px 15px rgba(0,0,0,.25);
}

.sofaBack{
    position:absolute;
    left:12px;
    top:0;
    width:220px;
    height:55px;
    border-radius:18px 18px 8px 8px;
    background:#5b7075;
}

.arm{
    position:absolute;
    top:30px;
    width:24px;
    height:65px;
    background:#4d6166;
    border-radius:10px;
}

.arm.left{
    left:-8px;
}

.arm.right{
    right:-8px;
}

.cushion{
    position:absolute;
    bottom:13px;
    width:70px;
    height:38px;
    border-radius:10px;
    background:#82999d;
}

.cushion.one{left:25px}
.cushion.two{left:105px}
.cushion.three{left:180px}

/* =========================
   COFFEE TABLE
========================= */

.table{
    position:absolute;
    left:170px;
    bottom:20px;
    width:145px;
    height:75px;
    cursor:pointer;
}

.tableTop{
    position:absolute;
    width:145px;
    height:48px;
    border-radius:8px;
    background:
        linear-gradient(135deg,#9b6541,#70472f);
    box-shadow:0 12px 14px rgba(0,0,0,.25);
}

.tableLeg{
    position:absolute;
    top:38px;
    width:12px;
    height:38px;
    background:#503522;
}

.tableLeg.a{left:14px}
.tableLeg.b{right:14px}

/* =========================
   TV
========================= */

.tv{
    position:absolute;
    right:35px;
    top:62px;
    width:155px;
    height:90px;
    cursor:pointer;
}

.tvScreen{
    position:absolute;
    width:155px;
    height:82px;
    border:7px solid #242a2e;
    border-radius:6px;
    background:
        radial-gradient(circle at 60% 40%,#305a78,#101b27 70%);
    box-shadow:
        0 10px 20px rgba(0,0,0,.35),
        inset 0 0 20px #000;
}

.tvStand{
    position:absolute;
    bottom:-14px;
    left:55px;
    width:45px;
    height:15px;
    background:#242a2e;
}

/* =========================
   PLANT
========================= */

.plant{
    position:absolute;
    cursor:pointer;
    width:65px;
    height:105px;
    left:20px;
    top:45px;
}

.pot{
    position:absolute;
    bottom:0;
    left:14px;
    width:38px;
    height:42px;
    background:
        linear-gradient(90deg,#8b5138,#bd7651,#874c35);
    clip-path:polygon(8% 0,92% 0,80% 100%,20% 100%);
}

.leaf{
    position:absolute;
    width:32px;
    height:48px;
    border-radius:50% 5px 50% 5px;
    background:linear-gradient(135deg,#4e8a5a,#225338);
    transform-origin:bottom;
}

.leaf:nth-child(1){
    left:15px;
    top:8px;
    transform:rotate(-28deg);
}
.leaf:nth-child(2){
    left:30px;
    top:0;
    transform:rotate(12deg);
}
.leaf:nth-child(3){
    left:4px;
    top:25px;
    transform:rotate(-48deg);
}
.leaf:nth-child(4){
    left:34px;
    top:28px;
    transform:rotate(45deg);
}

/* =========================
   BED
========================= */

.bed{
    position:absolute;
    left:40px;
    top:65px;
    width:225px;
    height:165px;
    cursor:pointer;
}

.headboard{
    position:absolute;
    left:0;
    top:0;
    width:225px;
    height:28px;
    border-radius:10px 10px 3px 3px;
    background:#654534;
}

.mattress{
    position:absolute;
    left:8px;
    top:23px;
    width:209px;
    height:130px;
    border-radius:12px;
    background:#f5f2eb;
    box-shadow:0 12px 18px rgba(0,0,0,.18);
}

.blanket{
    position:absolute;
    right:8px;
    top:65px;
    width:130px;
    height:88px;
    border-radius:0 0 10px 0;
    background:
        linear-gradient(135deg,#78949a,#9cb2b5);
}

.pillow{
    position:absolute;
    top:36px;
    width:75px;
    height:38px;
    border-radius:12px;
    background:#fff;
    box-shadow:0 3px 7px rgba(0,0,0,.1);
}

.pillow.one{left:25px}
.pillow.two{left:115px}

/* =========================
   KITCHEN
========================= */

.counter{
    position:absolute;
    left:18px;
    bottom:25px;
    width:260px;
    height:75px;
    background:#76513b;
    border-radius:8px;
    box-shadow:0 12px 18px rgba(0,0,0,.25);
    cursor:pointer;
}

.counterTop{
    position:absolute;
    left:-5px;
    top:-10px;
    width:270px;
    height:16px;
    border-radius:6px;
    background:#eeeae1;
}

.cabinet{
    position:absolute;
    top:15px;
    width:55px;
    height:48px;
    border:2px solid #573b2c;
    background:#80583d;
}

.cabinet:nth-child(1){left:12px}
.cabinet:nth-child(2){left:75px}
.cabinet:nth-child(3){left:138px}
.cabinet:nth-child(4){left:201px}

.handle{
    position:absolute;
    left:23px;
    top:21px;
    width:9px;
    height:3px;
    border-radius:3px;
    background:#d4b27c;
}

/* fridge */

.fridge{
    position:absolute;
    right:18px;
    top:32px;
    width:65px;
    height:120px;
    background:linear-gradient(90deg,#c9d0d4,#eef2f3,#c2cbd0);
    border-radius:6px;
    box-shadow:0 10px 15px rgba(0,0,0,.2);
    cursor:pointer;
}

.fridge:after{
    content:"";
    position:absolute;
    left:8px;
    top:58px;
    width:3px;
    height:35px;
    background:#707b82;
}

/* =========================
   BATHROOM
========================= */

.bath{
    position:absolute;
    left:28px;
    top:58px;
    width:245px;
    height:95px;
    border-radius:45px;
    background:#d9dde0;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
    cursor:pointer;
}

.water{
    position:absolute;
    left:15px;
    top:15px;
    width:215px;
    height:65px;
    border-radius:35px;
    background:
        radial-gradient(circle at 30% 30%,#d7f9ff,#83cde1);
}

/* =========================
   WINDOWS
========================= */

.window{
    position:absolute;
    top:25px;
    width:150px;
    height:85px;
    border:8px solid #f8f7f1;
    background:
        linear-gradient(
            90deg,
            transparent 48%,
            #fff 48%,
            #fff 52%,
            transparent 52%
        ),
        linear-gradient(
            transparent 47%,
            #fff 47%,
            #fff 53%,
            transparent 53%
        ),
        linear-gradient(#78c8e7,#c8efff);
    box-shadow:0 7px 15px rgba(0,0,0,.18);
}

.window.one{
    left:35px;
}

.window.two{
    right:30px;
}

/* =========================
   LIGHT
========================= */

.lightGlow{
    position:absolute;
    pointer-events:none;
    left:0;
    top:0;
    width:100%;
    height:100%;
    opacity:0;
    background:
        radial-gradient(
            circle at 35% 48%,
            rgba(255,224,145,.35),
            transparent 45%
        );
    transition:.5s;
}

#app.night .lightGlow{
    opacity:1;
}

/* =========================
   OBJECT POPUP
========================= */

#popup{
    position:absolute;
    z-index:50;
    left:50%;
    bottom:100px;
    transform:translateX(-50%) translateY(20px);
    min-width:260px;
    max-width:85%;
    padding:18px 24px;
    text-align:center;
    background:rgba(255,255,255,.96);
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

#popup.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

#popupTitle{
    font-size:19px;
    font-weight:900;
    margin-bottom:5px;
}

#popupText{
    color:#66727c;
    font-weight:600;
}

/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;
    z-index:30;
    right:20px;
    bottom:105px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

button{
    border:0;
    cursor:pointer;
    -webkit-appearance:none;
}

.control{
    width:58px;
    height:58px;
    border-radius:20px;
    background:rgba(255,255,255,.95);
    box-shadow:0 12px 30px rgba(0,0,0,.2);
    font-size:25px;
    font-weight:900;
    color:#1e2935;
    transition:.15s;
}

.control:active{
    transform:scale(.9);
}

/* =========================
   BOTTOM
========================= */

.help{
    position:absolute;
    z-index:20;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    padding:13px 20px;
    border-radius:18px;
    background:rgba(255,255,255,.92);
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    font-size:14px;
    font-weight:700;
    color:#56636e;
    white-space:nowrap;
    max-width:90%;
    overflow:hidden;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        top:15px;
        left:14px;
        right:14px;
    }

    .logo{
        font-size:17px;
        padding:15px 17px;
    }

    .roomName{
        font-size:15px;
        padding:15px 17px;
    }

    .scene{
        transform:
            translate(-50%,-50%)
            scale(.72)
            perspective(1100px)
            rotateX(58deg)
            rotateZ(-1deg);
    }

    .controls{
        right:15px;
        bottom:100px;
    }

    .control{
        width:55px;
        height:55px;
    }

    .help{
        bottom:22px;
        font-size:12px;
    }

    #popup{
        bottom:90px;
    }
}

@media(max-height:700px){

    .scene{
        transform:
            translate(-50%,-50%)
            scale(.58)
            perspective(1100px)
            rotateX(58deg)
            rotateZ(-1deg);
    }

    .controls{
        bottom:75px;
    }
}
</style>
</head>

<body>

<div id="app">

    <header>
        <div class="logo">🏠 MON APPARTEMENT</div>
        <div class="roomName" id="roomName">Vue générale</div>
    </header>

    <div class="scene">

        <div class="floor">

            <div class="wall back"></div>
            <div class="wall left"></div>

            <!-- SALON -->

            <div class="room living" data-room="Salon">

                <div class="roomLabel">SALON</div>

                <div class="window one"></div>

                <div
                    class="tv object"
                    data-title="Télévision"
                    data-text="Une grande TV pour les soirées canapé."
                >
                    <div class="tvScreen"></div>
                    <div class="tvStand"></div>
                </div>

                <div
                    class="sofa object"
                    data-title="Canapé"
                    data-text="Un grand canapé confortable."
                >
                    <div class="sofaBack"></div>
                    <div class="sofaSeat"></div>

                    <div class="arm left"></div>
                    <div class="arm right"></div>

                    <div class="cushion one"></div>
                    <div class="cushion two"></div>
                    <div class="cushion three"></div>
                </div>

                <div
                    class="table object"
                    data-title="Table basse"
                    data-text="Une petite table basse en bois."
                >
                    <div class="tableTop"></div>
                    <div class="tableLeg a"></div>
                    <div class="tableLeg b"></div>
                </div>

                <div
                    class="plant object"
                    data-title="Plante"
                    data-text="Une jolie plante décorative."
                >
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="pot"></div>
                </div>

            </div>


            <!-- CHAMBRE -->

            <div class="room bedroom" data-room="Chambre">

                <div class="roomLabel">CHAMBRE</div>

                <div class="window two"></div>

                <div
                    class="bed object"
                    data-title="Lit"
                    data-text="Un grand lit double bien confortable."
                >
                    <div class="headboard"></div>
                    <div class="mattress"></div>
                    <div class="blanket"></div>
                    <div class="pillow one"></div>
                    <div class="pillow two"></div>
                </div>

            </div>


            <!-- CUISINE -->

            <div class="room kitchen" data-room="Cuisine">

                <div class="roomLabel">CUISINE</div>

                <div
                    class="counter object"
                    data-title="Cuisine"
                    data-text="Une cuisine avec plusieurs rangements."
                >
                    <div class="counterTop"></div>

                    <div class="cabinet">
                        <div class="handle"></div>
                    </div>

                    <div class="cabinet">
                        <div class="handle"></div>
                    </div>

                    <div class="cabinet">
                        <div class="handle"></div>
                    </div>

                    <div class="cabinet">
                        <div class="handle"></div>
                    </div>
                </div>

                <div
                    class="fridge object"
                    data-title="Réfrigérateur"
                    data-text="Le frigo de l'appartement."
                ></div>

            </div>


            <!-- SALLE DE BAIN -->

            <div class="room bathroom" data-room="Salle de bain">

                <div class="roomLabel">SALLE DE BAIN</div>

                <div
                    class="bath object"
                    data-title="Baignoire"
                    data-text="Une grande baignoire avec eau bleue."
                >
                    <div class="water"></div>
                </div>

            </div>

        </div>

    </div>

    <div class="lightGlow"></div>


    <div class="controls">

        <button
            class="control"
            id="zoomIn"
            aria-label="Zoom avant"
        >＋</button>

        <button
            class="control"
            id="zoomOut"
            aria-label="Zoom arrière"
        >−</button>

        <button
            class="control"
            id="night"
            aria-label="Changer la lumière"
        >☀️</button>

        <button
            class="control"
            id="reset"
            aria-label="Réinitialiser"
        >⌂</button>

    </div>


    <div id="popup">

        <div id="popupTitle"></div>

        <div id="popupText"></div>

    </div>


    <div class="help">
        👆 Touche les meubles · 🌙 Change l'ambiance avec ☀️
    </div>

</div>


<script>

const app = document.getElementById("app");

const scene = document.querySelector(".scene");

const roomName =
    document.getElementById("roomName");

const popup =
    document.getElementById("popup");

const popupTitle =
    document.getElementById("popupTitle");

const popupText =
    document.getElementById("popupText");

let scale = 1;


/* =========================
   OBJETS
========================= */

document
.querySelectorAll(".object")
.forEach(object => {

    object.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            const title =
                this.dataset.title;

            const text =
                this.dataset.text;

            popupTitle.textContent =
                title;

            popupText.textContent =
                text;

            popup.classList.add("show");

            clearTimeout(window.popupTimer);

            window.popupTimer =
                setTimeout(() => {

                    popup.classList.remove("show");

                },3000);

        }
    );

});


/* =========================
   PIECES
========================= */

document
.querySelectorAll(".room")
.forEach(room => {

    room.addEventListener(
        "click",
        function(){

            roomName.textContent =
                this.dataset.room;

        }
    );

});


/* =========================
   NUIT
========================= */

document
.getElementById("night")
.addEventListener(
    "click",
    function(){

        app.classList.toggle("night");

        if(
            app.classList.contains("night")
        ){

            this.textContent = "🌙";

        }else{

            this.textContent = "☀️";

        }

    }
);


/* =========================
   ZOOM
========================= */

function updateZoom(){

    let mobile =
        window.innerWidth <= 700;

    let base =
        mobile ? .72 : 1;

    if(window.innerHeight <= 700){
        base = .58;
    }

    scene.style.transform =
        `
        translate(-50%,-50%)
        scale(${base * scale})
        perspective(1100px)
        rotateX(58deg)
        rotateZ(-1deg)
        `;

}


document
.getElementById("zoomIn")
.addEventListener(
    "click",
    () => {

        scale += .12;

        if(scale > 1.7)
            scale = 1.7;

        updateZoom();

    }
);


document
.getElementById("zoomOut")
.addEventListener(
    "click",
    () => {

        scale -= .12;

        if(scale < .55)
            scale = .55;

        updateZoom();

    }
);


/* =========================
   RESET
========================= */

document
.getElementById("reset")
.addEventListener(
    "click",
    () => {

        scale = 1;

        app.classList.remove("night");

        document
        .getElementById("night")
        .textContent = "☀️";

        roomName.textContent =
            "Vue générale";

        popup.classList.remove("show");

        updateZoom();

    }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    updateZoom
);

updateZoom();


/* =========================
   PETITE ANIMATION
========================= */

let angle = 0;

setInterval(() => {

    angle += .25;

    document
    .querySelectorAll(".leaf")
    .forEach((leaf,index) => {

        const direction =
            index % 2 === 0 ? 1 : -1;

        leaf.style.transform +=
            ` rotate(${Math.sin(angle / 8) * direction}deg)`;

    });

},100);

</script>

</body>
</html>
