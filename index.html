<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Copilot</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111214;
    color: #f5f5f5;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 100px;
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(17,18,20,.95);
    backdrop-filter: blur(15px);
    padding: 18px;
    border-bottom: 1px solid #292b30;
}

.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.logo span {
    color: #ff8a00;
}

.subtitle {
    color: #8d9098;
    font-size: 13px;
    margin-top: 3px;
}

/* NAV */

.nav {
    display: flex;
    gap: 8px;
    padding: 14px 16px 5px;
}

.nav button {
    flex: 1;
    border: 0;
    background: #202226;
    color: #aaaeb7;
    padding: 11px 6px;
    border-radius: 12px;
    font-weight: 700;
}

.nav button.active {
    background: #ff7a00;
    color: white;
}

/* CONTENT */

.content {
    padding: 16px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.section-title h2 {
    margin: 0;
    font-size: 19px;
}

/* TIMER */

.timer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.timer {
    background: #1d1f23;
    border: 1px solid #2b2e34;
    border-radius: 18px;
    padding: 16px;
    position: relative;
    overflow: hidden;
}

.timer.finished {
    animation: pulse .7s infinite alternate;
    border-color: #ff3b30;
}

@keyframes pulse {
    from { background: #24191a; }
    to { background: #452020; }
}

.timer-name {
    font-weight: 800;
    font-size: 16px;
    margin-bottom: 8px;
}

.timer-time {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -1px;
    margin-bottom: 12px;
}

.timer-actions {
    display: flex;
    gap: 7px;
}

.small-btn {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 9px 5px;
    background: #292c32;
    color: white;
    font-weight: 700;
}

.small-btn.danger {
    color: #ff5d55;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 45px 20px;
    background: #1b1d20;
    border-radius: 18px;
    color: #888c95;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

/* CHECKLIST */

.checklist-card {
    background: #1d1f23;
    border: 1px solid #2b2e34;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
}

.checklist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.checklist-header h3 {
    margin: 0;
}

.progress {
    font-size: 12px;
    color: #8d9098;
}

.task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid #292b30;
}

.task:last-child {
    border-bottom: 0;
}

.checkbox {
    width: 25px;
    height: 25px;
    border-radius: 8px;
    border: 2px solid #666a73;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.task.done .checkbox {
    background: #ff7a00;
    border-color: #ff7a00;
}

.task.done .task-text {
    text-decoration: line-through;
    color: #70737b;
}

.task-text {
    flex: 1;
}

.delete-task {
    border: 0;
    background: none;
    color: #666;
    font-size: 20px;
}

/* PRESETS */

.preset-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.preset {
    background: #1d1f23;
    border: 1px solid #2b2e34;
    border-radius: 15px;
    padding: 15px;
    color: white;
    text-align: left;
}

.preset strong {
    display: block;
    margin-bottom: 5px;
}

.preset small {
    color: #888c95;
}

/* FAB */

.fab {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 0;
    background: #ff7a00;
    color: white;
    font-size: 32px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    z-index: 20;
}

/* MODAL */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 700px;
    background: #1c1e22;
    border-radius: 25px 25px 0 0;
    padding: 22px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal h2 {
    margin-top: 0;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    color: #a3a6ae;
    font-size: 13px;
    margin-bottom: 7px;
}

.field input {
    width: 100%;
    border: 1px solid #363940;
    background: #121316;
    color: white;
    border-radius: 12px;
    padding: 13px;
    outline: none;
}

.field input:focus {
    border-color: #ff7a00;
}

.primary {
    width: 100%;
    border: 0;
    background: #ff7a00;
    color: white;
    padding: 14px;
    border-radius: 13px;
    font-weight: 800;
    font-size: 16px;
}

.secondary {
    width: 100%;
    border: 0;
    background: #292c32;
    color: white;
    padding: 13px;
    border-radius: 13px;
    margin-top: 8px;
}

/* SETTINGS */

.setting {
    background: #1d1f23;
    border-radius: 15px;
    padding: 16px;
    margin-bottom: 10px;
}

.setting button {
    margin-top: 10px;
    border: 0;
    background: #292c32;
    color: white;
    padding: 9px 12px;
    border-radius: 9px;
}

@media(max-width: 480px) {
    .timer-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="header-row">
        <div>
            <div class="logo">Kitchen <span>Copilot</span></div>
            <div class="subtitle">Ton assistant de cuisine</div>
        </div>
        <div style="font-size:26px">👨‍🍳</div>
    </div>
</header>

<div class="nav">
    <button class="active" onclick="showPage('service', this)">🔥 Service</button>
    <button onclick="showPage('checklists', this)">📋 Listes</button>
    <button onclick="showPage('presets', this)">⚡ Rapide</button>
</div>

<main class="content">

<!-- SERVICE -->

<section id="service">

<div class="section-title">
    <h2>Minuteurs en cours</h2>
    <span id="timerCount" class="progress"></span>
</div>

<div id="timers" class="timer-grid"></div>

<div style="height:25px"></div>

<div class="section-title">
    <h2>Minuteurs enregistrés</h2>
</div>

<div id="savedTimers" class="preset-grid"></div>

</section>


<!-- CHECKLISTS -->

<section id="checklists" style="display:none">

<div class="section-title">
    <h2>Mes checklists</h2>
    <button class="small-btn" onclick="newChecklist()">＋ Nouvelle</button>
</div>

<div id="checklistsContainer"></div>

</section>


<!-- PRESETS -->

<section id="presets" style="display:none">

<div class="section-title">
    <h2>Actions rapides</h2>
</div>

<div class="preset-grid">

<button class="preset" onclick="quickTimer('🥩 Steak',180)">
    <strong>🥩 Steak</strong>
    <small>3 minutes</small>
</button>

<button class="preset" onclick="quickTimer('🍟 Frites',210)">
    <strong>🍟 Frites</strong>
    <small>3 min 30</small>
</button>

<button class="preset" onclick="quickTimer('🍳 Œuf mollet',360)">
    <strong>🍳 Œuf mollet</strong>
    <small>6 minutes</small>
</button>

<button class="preset" onclick="quickTimer('🥚 Œuf dur',600)">
    <strong>🥚 Œuf dur</strong>
    <small>10 minutes</small>
</button>

<button class="preset" onclick="quickTimer('🥓 Bacon',420)">
    <strong>🥓 Bacon</strong>
    <small>7 minutes</small>
</button>

<button class="preset" onclick="quickTimer('🍗 Poulet',480)">
    <strong>🍗 Poulet</strong>
    <small>8 minutes</small>
</button>

</div>

</section>

</main>

<button class="fab" onclick="openAddMenu()">+</button>

</div>


<!-- MODAL -->

<div id="modalBg" class="modal-bg">
<div class="modal" id="modal"></div>
</div>


<script>

/* =========================
   DATA
========================= */

let timers = JSON.parse(localStorage.getItem("kc_timers") || "[]");

let checklists = JSON.parse(
    localStorage.getItem("kc_checklists") ||
    JSON.stringify([
        {
            id: 1,
            name: "Ouverture",
            tasks: [
                {id:1,text:"Allumer les fours",done:false},
                {id:2,text:"Vérifier les frigos",done:false},
                {id:3,text:"Préparer la mise en place",done:false}
            ]
        },
        {
            id: 2,
            name: "Fermeture",
            tasks: [
                {id:4,text:"Nettoyer le plan de travail",done:false},
                {id:5,text:"Nettoyer la friteuse",done:false},
                {id:6,text:"Sortir les poubelles",done:false},
                {id:7,text:"Éteindre les appareils",done:false}
            ]
        }
    ])
);

let savedTimers = JSON.parse(
    localStorage.getItem("kc_saved_timers") ||
    JSON.stringify([
        {id:1,name:"🥩 Steak",seconds:180},
        {id:2,name:"🍟 Frites",seconds:210},
        {id:3,name:"🍳 Œuf mollet",seconds:360}
    ])
);


/* =========================
   SAVE
========================= */

function save() {
    localStorage.setItem("kc_timers", JSON.stringify(timers));
    localStorage.setItem("kc_checklists", JSON.stringify(checklists));
    localStorage.setItem("kc_saved_timers", JSON.stringify(savedTimers));
}


/* =========================
   NAVIGATION
========================= */

function showPage(page, button) {

    document.getElementById("service").style.display =
        page === "service" ? "block" : "none";

    document.getElementById("checklists").style.display =
        page === "checklists" ? "block" : "none";

    document.getElementById("presets").style.display =
        page === "presets" ? "block" : "none";

    document.querySelectorAll(".nav button")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    render();
}


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds) {

    seconds = Math.max(0, Math.ceil(seconds));

    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = seconds % 60;

    if(h > 0) {
        return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    }

    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}


/* =========================
   TIMER
========================= */

function startTimer(name, seconds) {

    timers.push({
        id: Date.now(),
        name,
        duration: seconds,
        remaining: seconds,
        running: true,
        finished: false
    });

    save();
    render();
}


function quickTimer(name, seconds) {
    startTimer(name, seconds);
    showPage("service", document.querySelector(".nav button"));
}


function toggleTimer(id) {

    let timer = timers.find(t => t.id === id);

    if(timer) {
        timer.running = !timer.running;
        save();
        render();
    }
}


function resetTimer(id) {

    let timer = timers.find(t => t.id === id);

    if(timer) {
        timer.remaining = timer.duration;
        timer.finished = false;
        timer.running = false;
        save();
        render();
    }
}


function deleteTimer(id) {

    timers = timers.filter(t => t.id !== id);
    save();
    render();
}


/* =========================
   TIMER LOOP
========================= */

setInterval(() => {

    let changed = false;

    timers.forEach(timer => {

        if(timer.running && timer.remaining > 0) {

            timer.remaining -= 0.1;
            changed = true;

            if(timer.remaining <= 0) {

                timer.remaining = 0;
                timer.running = false;

                if(!timer.finished) {

                    timer.finished = true;

                    playAlarm();

                    if(navigator.vibrate) {
                        navigator.vibrate([500,200,500,200,500]);
                    }

                    if(Notification.permission === "granted") {
                        new Notification("Kitchen Copilot", {
                            body: timer.name + " est terminé !"
                        });
                    }
                }
            }
        }
    });

    if(changed) {
        renderTimers();
    }

},100);


/* =========================
   ALARM
========================= */

function playAlarm() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioContext();

        let oscillator = ctx.createOscillator();
        let gain = ctx.createGain();

        oscillator.frequency.value = 880;
        oscillator.type = "square";

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        gain.gain.value = .15;

        oscillator.start();

        setTimeout(() => {
            oscillator.stop();
            ctx.close();
        },700);

    } catch(e) {}

}


/* =========================
   RENDER TIMERS
========================= */

function renderTimers() {

    let container = document.getElementById("timers");

    if(!timers.length) {

        container.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                <div class="empty-icon">⏱️</div>
                Aucun minuteur en cours
                <br><br>
                Appuie sur <strong>+</strong> pour commencer.
            </div>
        `;

    } else {

        container.innerHTML = timers.map(timer => `

            <div class="timer ${timer.finished ? "finished":""}">

                <div class="timer-name">
                    ${escapeHtml(timer.name)}
                </div>

                <div class="timer-time">
                    ${formatTime(timer.remaining)}
                </div>

                <div class="timer-actions">

                    <button
                        class="small-btn"
                        onclick="toggleTimer(${timer.id})">
                        ${timer.running ? "⏸ Pause" : "▶ Reprendre"}
                    </button>

                    <button
                        class="small-btn"
                        onclick="resetTimer(${timer.id})">
                        ↻
                    </button>

                    <button
                        class="small-btn danger"
                        onclick="deleteTimer(${timer.id})">
                        ×
                    </button>

                </div>

            </div>
        `).join("");
    }

    document.getElementById("timerCount").textContent =
        timers.length ? `${timers.length} actif(s)` : "";

}


/* =========================
   SAVED TIMERS
========================= */

function renderSavedTimers() {

    let container = document.getElementById("savedTimers");

    container.innerHTML = savedTimers.map(t => `

        <button class="preset"
            onclick="startTimer('${escapeAttr(t.name)}',${t.seconds})">

            <strong>${escapeHtml(t.name)}</strong>

            <small>
                ${formatTime(t.seconds)}
            </small>

        </button>

    `).join("");
}


/* =========================
   CHECKLISTS
========================= */

function renderChecklists() {

    let container =
        document.getElementById("checklistsContainer");

    container.innerHTML = checklists.map(list => {

        let completed =
            list.tasks.filter(t => t.done).length;

        return `

        <div class="checklist-card">

            <div class="checklist-header">

                <div>
                    <h3>${escapeHtml(list.name)}</h3>
                    <div class="progress">
                        ${completed}/${list.tasks.length}
                    </div>
                </div>

                <button
                    class="small-btn"
                    onclick="addTask(${list.id})">
                    ＋ Tâche
                </button>

            </div>

            ${list.tasks.map(task => `

                <div class="task ${task.done ? "done":""}">

                    <div
                        class="checkbox"
                        onclick="toggleTask(${list.id},${task.id})">
                        ${task.done ? "✓":""}
                    </div>

                    <div
                        class="task-text"
                        onclick="toggleTask(${list.id},${task.id})">
                        ${escapeHtml(task.text)}
                    </div>

                    <button
                        class="delete-task"
                        onclick="deleteTask(${list.id},${task.id})">
                        ×
                    </button>

                </div>

            `).join("")}

        </div>

        `;

    }).join("");
}


function toggleTask(listId, taskId) {

    let list = checklists.find(l => l.id === listId);
    let task = list.tasks.find(t => t.id === taskId);

    task.done = !task.done;

    save();
    renderChecklists();
}


function deleteTask(listId, taskId) {

    let list = checklists.find(l => l.id === listId);

    list.tasks = list.tasks.filter(t => t.id !== taskId);

    save();
    renderChecklists();
}


function addTask(listId) {

    let text = prompt("Nom de la tâche :");

    if(!text || !text.trim()) return;

    let list = checklists.find(l => l.id === listId);

    list.tasks.push({
        id: Date.now(),
        text: text.trim(),
        done:false
    });

    save();
    renderChecklists();
}


function newChecklist() {

    let name = prompt("Nom de la checklist :");

    if(!name || !name.trim()) return;

    checklists.push({
        id:Date.now(),
        name:name.trim(),
        tasks:[]
    });

    save();
    renderChecklists();
}


/* =========================
   ADD MENU
========================= */

function openAddMenu() {

    document.getElementById("modal").innerHTML = `

        <h2>Ajouter</h2>

        <button
            class="primary"
            onclick="openTimerForm()">
            🔥 Nouveau minuteur
        </button>

        <button
            class="secondary"
            onclick="newChecklist();closeModal()">
            📋 Nouvelle checklist
        </button>

        <button
            class="secondary"
            onclick="openSavedTimerForm()">
            ⚡ Enregistrer un minuteur
        </button>

        <button
            class="secondary"
            onclick="closeModal()">
            Annuler
        </button>
    `;

    document.getElementById("modalBg").classList.add("show");
}


/* =========================
   TIMER FORM
========================= */

function openTimerForm() {

    document.getElementById("modal").innerHTML = `

        <h2>🔥 Nouveau minuteur</h2>

        <div class="field">
            <label>Nom</label>
            <input id="timerName" placeholder="Ex : Steak table 12">
        </div>

        <div class="field">
            <label>Minutes</label>
            <input id="timerMinutes" type="number" min="0" value="3">
        </div>

        <div class="field">
            <label>Secondes</label>
            <input id="timerSeconds" type="number" min="0" max="59" value="0">
        </div>

        <button
            class="primary"
            onclick="createTimerFromForm()">
            Démarrer
        </button>

        <button
            class="secondary"
            onclick="closeModal()">
            Annuler
        </button>
    `;

}


function createTimerFromForm() {

    let name =
        document.getElementById("timerName").value.trim()
        || "Minuteur";

    let minutes =
        Number(document.getElementById("timerMinutes").value) || 0;

    let seconds =
        Number(document.getElementById("timerSeconds").value) || 0;

    let total = minutes * 60 + seconds;

    if(total <= 0) {
        alert("Choisis une durée.");
        return;
    }

    startTimer(name,total);
    closeModal();
}


/* =========================
   SAVED TIMER FORM
========================= */

function openSavedTimerForm() {

    document.getElementById("modal").innerHTML = `

        <h2>⚡ Enregistrer un minuteur</h2>

        <div class="field">
            <label>Nom</label>
            <input id="savedName" placeholder="Ex : Steak à point">
        </div>

        <div class="field">
            <label>Durée en minutes</label>
            <input id="savedMinutes" type="number" min="1" value="5">
        </div>

        <button
            class="primary"
            onclick="savePreset()">
            Enregistrer
        </button>

        <button
            class="secondary"
            onclick="closeModal()">
            Annuler
        </button>
    `;
}


function savePreset() {

    let name =
        document.getElementById("savedName").value.trim();

    let minutes =
        Number(document.getElementById("savedMinutes").value);

    if(!name || minutes <= 0) return;

    savedTimers.push({
        id:Date.now(),
        name,
        seconds:minutes * 60
    });

    save();
    renderSavedTimers();
    closeModal();
}


/* =========================
   MODAL
========================= */

function closeModal() {
    document.getElementById("modalBg")
        .classList.remove("show");
}


/* =========================
   RENDER
========================= */

function render() {
    renderTimers();
    renderSavedTimers();
    renderChecklists();
}


/* =========================
   SECURITY / TEXT
========================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function escapeAttr(text) {
    return String(text)
        .replaceAll("'","\\'")
        .replaceAll('"','\\"');
}


/* =========================
   NOTIFICATIONS
========================= */

if("Notification" in window &&
   Notification.permission === "default") {

    setTimeout(() => {
        Notification.requestPermission();
    },1500);
}


/* START */

render();

</script>

</body>
</html>
