<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mon Appartement 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #b9d7e5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

canvas {
  display: block;
  position: fixed;
  inset: 0;
  z-index: 1;
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #b9d7e5;
  transition: opacity .45s;
}

.loadingBox {
  text-align: center;
  color: #17212b;
  padding: 25px;
}

.loadingHouse {
  font-size: 64px;
  margin-bottom: 14px;
}

.loadingText {
  font-size: 24px;
  font-weight: 800;
}

.loadingSmall {
  margin-top: 12px;
  font-size: 14px;
  font-weight: 600;
  opacity: .65;
}

#ui {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
}

.topbar {
  position: absolute;
  top: 20px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.title,
.room {
  background: rgba(255,255,255,.94);
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

.title {
  padding: 15px 20px;
  font-size: 20px;
  font-weight: 900;
}

.room {
  padding: 15px 18px;
  font-weight: 800;
}

#info {
  position: absolute;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  min-width: 240px;
  max-width: 85%;
  padding: 15px 20px;
  border-radius: 18px;
  background: rgba(255,255,255,.95);
  color: #17212b;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.18);
  font-weight: 700;
  opacity: 0;
  transition: opacity .25s;
}

#controls {
  position: absolute;
  right: 18px;
  bottom: 105px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: auto;
}

.control {
  width: 54px;
  height: 54px;
  border: 0;
  border-radius: 17px;
  background: rgba(255,255,255,.95);
  font-size: 25px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
}

.control:active {
  transform: scale(.92);
}

#help {
  position: absolute;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  padding: 10px 15px;
  border-radius: 14px;
  background: rgba(255,255,255,.84);
  font-size: 13px;
  color: #44515c;
  white-space: nowrap;
}

#error {
  display: none;
  margin-top: 18px;
  padding: 12px 15px;
  border-radius: 12px;
  background: #fff;
  color: #a40000;
  font-size: 13px;
  line-height: 1.4;
  max-width: 330px;
}
</style>
</head>

<body>

<div id="loading">
  <div class="loadingBox">
    <div class="loadingHouse">🏠</div>
    <div class="loadingText">Construction de l’appartement…</div>
    <div class="loadingSmall">Chargement de la vue 3D</div>
    <div id="error"></div>
  </div>
</div>

<div id="ui">

  <div class="topbar">
    <div class="title">🏠 MON APPARTEMENT</div>
    <div class="room" id="roomName">Salon</div>
  </div>

  <div id="info"></div>

  <div id="controls">
    <button class="control" id="zoomIn">＋</button>
    <button class="control" id="zoomOut">−</button>
    <button class="control" id="light">🌙</button>
    <button class="control" id="home">⌂</button>
  </div>

  <div id="help">
    👆 Glisse pour regarder autour de toi · Touche les objets
  </div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


let scene;
let camera;
let renderer;
let controls;

let night = false;

const objects = [];

const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");
const info = document.getElementById("info");


try {

  init();

} catch (e) {

  showError(e);

}


function init() {

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0xb9d7e5);

  scene.fog =
    new THREE.Fog(
      0xb9d7e5,
      15,
      55
    );


  camera =
    new THREE.PerspectiveCamera(
      55,
      innerWidth / innerHeight,
      0.1,
      100
    );


  camera.position.set(
    12,
    9,
    14
  );


  renderer =
    new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });


  renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
  );


  renderer.setSize(
    innerWidth,
    innerHeight
  );


  renderer.shadowMap.enabled = true;

  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


  document.body.appendChild(
    renderer.domElement
  );


  controls =
    new OrbitControls(
      camera,
      renderer.domElement
    );


  controls.enableDamping = true;

  controls.dampingFactor = 0.07;

  controls.minDistance = 5;

  controls.maxDistance = 30;

  controls.maxPolarAngle =
    Math.PI / 2.03;


  controls.target.set(
    0,
    1,
    0
  );


  createLights();

  createApartment();

  setupInteraction();

  setupButtons();


  addEventListener(
    "resize",
    resize
  );


  animate();


  setTimeout(
    hideLoading,
    450
  );

}


function hideLoading() {

  loading.style.opacity = "0";

  setTimeout(
    () => loading.remove(),
    500
  );

}


function showError(e) {

  errorBox.style.display = "block";

  errorBox.innerHTML =
    "Le moteur 3D n’a pas pu démarrer." +
    "<br><br>" +
    "<b>Erreur :</b> " +
    String(
      e && e.message
        ? e.message
        : e
    );

}


function mat(
  color,
  roughness = .75,
  metalness = 0
) {

  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });

}


function addBox(
  w,
  h,
  d,
  x,
  y,
  z,
  material,
  clickable = false,
  title = "",
  desc = ""
) {

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      material
    );


  mesh.position.set(
    x,
    y,
    z
  );


  mesh.castShadow = true;

  mesh.receiveShadow = true;


  if (clickable) {

    addClickable(
      mesh,
      title,
      desc
    );

  }


  scene.add(mesh);

  return mesh;

}


function createLights() {

  const hemi =
    new THREE.HemisphereLight(
      0xffffff,
      0x66727a,
      1.7
    );


  scene.add(hemi);


  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      2.5
    );


  sun.position.set(
    8,
    15,
    8
  );


  sun.castShadow = true;


  sun.shadow.mapSize.set(
    1024,
    1024
  );


  sun.shadow.camera.left = -20;

  sun.shadow.camera.right = 20;

  sun.shadow.camera.top = 20;

  sun.shadow.camera.bottom = -20;


  scene.add(sun);


  window.sun = sun;

}


function createApartment() {

  createFloor();

  createWalls();

  createLivingRoom();

  createKitchen();

  createBedroom();

  createBathroom();

  createDecorations();

}


function createFloor() {

  addBox(
    22,
    .3,
    18,
    0,
    -.15,
    0,
    mat(0xc5a27e,.85)
  );

}


function createWalls() {

  const wall =
    mat(
      0xf1eee5,
      .9
    );


  addBox(
    22,
    4.5,
    .35,
    0,
    2.25,
    -9,
    wall
  );


  addBox(
    .35,
    4.5,
    18,
    -11,
    2.25,
    0,
    wall
  );


  addBox(
    .35,
    4.5,
    18,
    11,
    2.25,
    0,
    wall
  );


  addBox(
    22,
    4.5,
    .35,
    0,
    2.25,
    9,
    wall
  );


  addBox(
    .25,
    4.2,
    9,
    2.5,
    2.1,
    -4.5,
    wall
  );


  addBox(
    7,
    4.2,
    .25,
    -7.5,
    2.1,
    2,
    wall
  );

}


function createLivingRoom() {

  createSofa(
    -3,
    1.2,
    5
  );


  createTable(
    0,
    .8,
    2
  );


  createTV(
    5,
    2,
    -7.8
  );


  createRug(
    0,
    .02,
    1
  );

}


function createSofa(
  x,
  y,
  z
) {

  const material =
    mat(
      0x5f6b6b,
      .9
    );


  const group =
    new THREE.Group();


  const seat =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5,
        .65,
        1.8
      ),
      material
    );


  seat.position.y = .65;

  group.add(seat);


  const back =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5,
        1.8,
        .45
      ),
      material
    );


  back.position.set(
    0,
    1.35,
    -.7
  );


  group.add(back);


  for (
    const sx of [-2.3, 2.3]
  ) {

    const arm =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .45,
          1.25,
          1.8
        ),
        material
      );


    arm.position.set(
      sx,
      1,
      0
    );


    group.add(arm);

  }


  group.position.set(
    x,
    y,
    z
  );


  group.rotation.y = -.25;


  addClickable(
    group,
    "Canapé",
    "Un canapé confortable pour se poser."
  );


  scene.add(group);

}


function createTable(
  x,
  y,
  z
) {

  const wood =
    mat(
      0x8b5a35,
      .7
    );


  const group =
    new THREE.Group();


  const top =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        3.2,
        .25,
        1.5
      ),
      wood
    );


  top.position.y = 1;

  group.add(top);


  for (
    const i of [-1,1]
  ) {

    for (
      const j of [-1,1]
    ) {

      const leg =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .15,
            1,
            .15
          ),
          wood
        );


      leg.position.set(
        i * 1.3,
        .5,
        j * .55
      );


      group.add(leg);

    }

  }


  group.position.set(
    x,
    y,
    z
  );


  addClickable(
    group,
    "Table basse",
    "Table basse en bois."
  );


  scene.add(group);

}


function createTV(
  x,
  y,
  z
) {

  const group =
    new THREE.Group();


  const black =
    mat(
      0x080808,
      .2,
      .1
    );


  const screen =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        4,
        2.2,
        .15
      ),
      black
    );


  group.add(screen);


  const stand =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.5,
        .35,
        .5
      ),
      black
    );


  stand.position.y = -1.3;

  group.add(stand);


  group.position.set(
    x,
    y,
    z
  );


  group.rotation.y =
    Math.PI;


  addClickable(
    group,
    "Télévision",
    "Une grande télévision."
  );


  scene.add(group);

}


function createKitchen() {

  const counterMat =
    mat(
      0xeeeeea,
      .55
    );


  const woodMat =
    mat(
      0x765038,
      .8
    );


  for (
    let i = 0;
    i < 4;
    i++
  ) {

    addBox(
      1.8,
      1.1,
      .7,
      -8 + i * 1.9,
      .55,
      -7.9,
      woodMat,
      true,
      "Meuble de cuisine",
      "Meuble bas de la cuisine."
    );

  }


  addBox(
    7.6,
    .18,
    .85,
    -5.2,
    1.15,
    -7.9,
    counterMat
  );


  addBox(
    1.3,
    .08,
    .5,
    -5.3,
    1.27,
    -7.9,
    mat(
      0x9099a0,
      .25,
      .7
    ),
    true,
    "Évier",
    "Évier de la cuisine."
  );


  addBox(
    1.2,
    3.5,
    1,
    -9.5,
    1.75,
    -6,
    mat(
      0xdfe4e7,
      .3,
      .25
    ),
    true,
    "Réfrigérateur",
    "Le réfrigérateur."
  );

}


function createBedroom() {

  const group =
    new THREE.Group();


  const frame =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        4.5,
        .45,
        6
      ),
      mat(0x5d4636)
    );


  frame.position.y = .45;

  group.add(frame);


  const mattress =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        4.25,
        .5,
        5.6
      ),
      mat(
        0xe7e1d5,
        1
      )
    );


  mattress.position.y = .85;

  group.add(mattress);


  const blanket =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        4.1,
        .15,
        3
      ),
      mat(0x829ca0)
    );


  blanket.position.set(
    0,
    1.15,
    1
  );


  group.add(blanket);


  const pillowMat =
    mat(
      0xffffff,
      1
    );


  for (
    const px of [-1.2,1.2]
  ) {

    const pillow =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.7,
          .35,
          1
        ),
        pillowMat
      );


    pillow.position.set(
      px,
      1.25,
      -1.7
    );


    group.add(pillow);

  }


  group.position.set(
    6,
    0,
    2.5
  );


  group.rotation.y = -.15;


  addClickable(
    group,
    "Lit",
    "Le lit de la chambre."
  );


  scene.add(group);

}


function createBathroom() {

  const white =
    mat(
      0xf4f4f4,
      .4
    );


  addBox(
    3.5,
    .7,
    1.5,
    7,
    .45,
    -6.5,
    white,
    true,
    "Baignoire",
    "Une baignoire."
  );


  addBox(
    1.5,
    .8,
    .7,
    4,
    .4,
    -6.5,
    white,
    true,
    "Lavabo",
    "Le lavabo de la salle de bain."
  );

}


function createRug(
  x,
  y,
  z
) {

  addBox(
    6,
    .04,
    4,
    x,
    y + .02,
    z,
    mat(
      0x819b98,
      1
    )
  );

}


function createDecorations() {

  createPlant(
    -8,
    0,
    5
  );


  createPlant(
    9,
    0,
    6
  );


  createLamp(
    4,
    0,
    1
  );


  createWindow(
    -2,
    3,
    -8.8
  );


  createWindow(
    8,
    3,
    8.8
  );

}


function createPlant(
  x,
  y,
  z
) {

  const group =
    new THREE.Group();


  const pot =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .45,
        .35,
        .7,
        16
      ),
      mat(0xb36d48)
    );


  pot.position.y = .35;

  group.add(pot);


  const green =
    mat(0x3f7048);


  for (
    let i = 0;
    i < 8;
    i++
  ) {

    const leaf =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .35,
          10,
          10
        ),
        green
      );


    leaf.position.set(
      Math.sin(i) * .35,
      .9 + Math.random() * .7,
      Math.cos(i) * .35
    );


    leaf.scale.set(
      .8,
      1.4,
      .6
    );


    group.add(leaf);

  }


  group.position.set(
    x,
    y,
    z
  );


  addClickable(
    group,
    "Plante",
    "Une plante décorative."
  );


  scene.add(group);

}


function createLamp(
  x,
  y,
  z
) {

  const group =
    new THREE.Group();


  const stand =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .08,
        .08,
        2.5,
        12
      ),
      mat(
        0x333333,
        .3,
        .6
      )
    );


  stand.position.y = 1.25;

  group.add(stand);


  const shade =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        .65,
        .8,
        20,
        1,
        true
      ),
      new THREE.MeshStandardMaterial({
        color: 0xf0d59a,
        side: THREE.DoubleSide
      })
    );


  shade.position.y = 2.55;

  group.add(shade);


  const light =
    new THREE.PointLight(
      0xffdca0,
      1.5,
      7
    );


  light.position.y = 2.3;

  group.add(light);


  group.position.set(
    x,
    y,
    z
  );


  addClickable(
    group,
    "Lampe",
    "Une lampe décorative."
  );


  scene.add(group);

}


function createWindow(
  x,
  y,
  z
) {

  const frameMat =
    mat(0xffffff);


  const glassMat =
    new THREE.MeshStandardMaterial({
      color: 0x8fc9e5,
      transparent: true,
      opacity: .65,
      roughness: .1
    });


  const frame =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5,
        2.5,
        .15
      ),
      frameMat
    );


  frame.position.set(
    x,
    y,
    z
  );


  scene.add(frame);


  const glass =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        4.5,
        2,
        .18
      ),
      glassMat
    );


  glass.position.set(
    x,
    y,
    z + (z > 0 ? -.08 : .08)
  );


  addClickable(
    glass,
    "Fenêtre",
    "Une grande fenêtre donnant sur l'extérieur."
  );


  scene.add(glass);

}


function addClickable(
  object,
  title,
  description
) {

  object.userData.clickable = true;

  object.userData.title = title;

  object.userData.description =
    description;

  objects.push(object);

}


const raycaster =
  new THREE.Raycaster();


const pointer =
  new THREE.Vector2();


function setupInteraction() {

  renderer.domElement.addEventListener(
    "pointerdown",
    event => {

      pointer.x =
        (event.clientX / innerWidth) * 2 - 1;


      pointer.y =
        -(event.clientY / innerHeight) * 2 + 1;


      raycaster.setFromCamera(
        pointer,
        camera
      );


      const hits =
        raycaster.intersectObjects(
          scene.children,
          true
        );


      for (
        const hit of hits
      ) {

        let obj =
          hit.object;


        while (
          obj &&
          !obj.userData.clickable
        ) {

          obj =
            obj.parent;

        }


        if (
          obj &&
          obj.userData.clickable
        ) {

          showInfo(
            obj.userData.title,
            obj.userData.description
          );


          return;

        }

      }

    }
  );

}


function showInfo(
  title,
  description
) {

  info.innerHTML =
    "<strong>" +
    title +
    "</strong><br>" +
    description;


  info.style.opacity = "1";


  clearTimeout(
    window.infoTimer
  );


  window.infoTimer =
    setTimeout(
      () => {
        info.style.opacity = "0";
      },
      3500
    );

}


function setupButtons() {

  document
    .getElementById("zoomIn")
    .onclick = () => {

      controls.dollyIn(1.25);

      controls.update();

    };


  document
    .getElementById("zoomOut")
    .onclick = () => {

      controls.dollyOut(1.25);

      controls.update();

    };


  document
    .getElementById("home")
    .onclick = () => {

      camera.position.set(
        12,
        9,
        14
      );


      controls.target.set(
        0,
        1,
        0
      );


      controls.update();

    };


  document
    .getElementById("light")
    .onclick = () => {

      night = !night;


      if (night) {

        scene.background.set(
          0x101826
        );


        scene.fog.color.set(
          0x101826
        );


        window.sun.intensity =
          .35;


        document
          .getElementById("light")
          .textContent = "☀️";


      } else {

        scene.background.set(
          0xb9d7e5
        );


        scene.fog.color.set(
          0xb9d7e5
        );


        window.sun.intensity =
          2.5;


        document
          .getElementById("light")
          .textContent = "🌙";

      }

    };

}


function animate() {

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


function resize() {

  camera.aspect =
    innerWidth / innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    innerWidth,
    innerHeight
  );

}

</script>
