<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Mon Appartement 3D</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #b9d7e5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    touch-action: none;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* -------------------------
   INTERFACE
------------------------- */

.top {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    pointer-events: none;
}

.title {
    padding: 12px 16px;

    background: rgba(255,255,255,.92);

    border-radius: 16px;

    font-size: 17px;
    font-weight: 900;

    color: #17212b;

    box-shadow:
        0 8px 25px rgba(0,0,0,.15);
}

.room {
    padding: 12px 16px;

    background: rgba(255,255,255,.92);

    border-radius: 16px;

    font-size: 15px;
    font-weight: 800;

    color: #17212b;

    box-shadow:
        0 8px 25px rgba(0,0,0,.15);
}

/* -------------------------
   BOUTONS
------------------------- */

.buttons {
    position: absolute;

    right: 16px;
    bottom: 90px;

    display: flex;
    flex-direction: column;

    gap: 10px;
}

button {
    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 17px;

    background: rgba(255,255,255,.94);

    font-size: 25px;

    box-shadow:
        0 7px 20px rgba(0,0,0,.18);

    color: #17212b;
}

button:active {
    transform: scale(.91);
}

/* -------------------------
   INFO
------------------------- */

#info {
    position: absolute;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    width: max-content;
    max-width: 82%;

    padding: 13px 18px;

    background: rgba(255,255,255,.95);

    border-radius: 16px;

    text-align: center;

    color: #17212b;

    font-size: 14px;
    font-weight: 700;

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);

    opacity: 0;

    transition:
        opacity .2s;
}

#help {
    position: absolute;

    left: 50%;
    top: 78px;

    transform: translateX(-50%);

    padding: 9px 13px;

    border-radius: 13px;

    background: rgba(255,255,255,.78);

    color: #52616d;

    font-size: 12px;
    font-weight: 600;

    white-space: nowrap;

    pointer-events: none;
}

/* -------------------------
   ERREUR
------------------------- */

#error {
    display: none;

    position: absolute;

    left: 15px;
    right: 15px;
    top: 50%;

    transform: translateY(-50%);

    padding: 20px;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.25);

    color: #222;

    font-weight: 700;

    text-align: center;

    z-index: 50;
}

</style>
</head>


<body>

<div id="app">

<canvas id="canvas"></canvas>

<div class="top">

    <div class="title">
        🏠 MON APPARTEMENT
    </div>

    <div class="room" id="room">
        Appartement
    </div>

</div>


<div id="help">
    👆 Glisse pour tourner · 🤏 Pince pour zoomer · Touche les meubles
</div>


<div class="buttons">

    <button id="plus">＋</button>

    <button id="minus">−</button>

    <button id="day">☀️</button>

    <button id="reset">⌂</button>

</div>


<div id="info"></div>


<div id="error">
    Une erreur est survenue.
</div>

</div>


<script>

/* =========================================================
   APPARTEMENT 3D
   VERSION AUTONOME
   AUCUNE BIBLIOTHÈQUE EXTERNE
========================================================= */


const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const info =
    document.getElementById("info");

const roomLabel =
    document.getElementById("room");

const errorBox =
    document.getElementById("error");


/* =========================================================
   VARIABLES
========================================================= */

let width = 0;
let height = 0;

let rotation = -0.55;

let cameraHeight = 7;

let zoom = 1;

let night = false;

let dragging = false;

let lastX = 0;
let lastY = 0;

let touchDistance = 0;


/* =========================================================
   APPARTEMENT
========================================================= */

const apartment = {

    width: 22,
    depth: 18,

    wallHeight: 4.5

};


/* =========================================================
   OBJETS
========================================================= */

const objects = [

    {
        name: "Canapé",
        description:
            "Un grand canapé confortable.",
        x: -3,
        z: 5,
        w: 5,
        d: 1.8,
        h: 1.7,
        color: "#59696b"
    },

    {
        name: "Table basse",
        description:
            "Une table basse en bois.",
        x: 0,
        z: 2,
        w: 3.2,
        d: 1.5,
        h: 1,
        color: "#8b5a35"
    },

    {
        name: "Télévision",
        description:
            "Une grande télévision.",
        x: 5,
        z: -7.4,
        w: 4,
        d: .3,
        h: 2.2,
        color: "#111111"
    },

    {
        name: "Cuisine",
        description:
            "Les meubles de la cuisine.",
        x: -6,
        z: -7,
        w: 7,
        d: 1,
        h: 2.5,
        color: "#765038"
    },

    {
        name: "Réfrigérateur",
        description:
            "Le réfrigérateur.",
        x: -9.3,
        z: -5.7,
        w: 1.3,
        d: 1.2,
        h: 3.5,
        color: "#dfe4e7"
    },

    {
        name: "Lit",
        description:
            "Le lit de la chambre.",
        x: 6.5,
        z: 2.5,
        w: 4.5,
        d: 6,
        h: 1.4,
        color: "#e5dfd4"
    },

    {
        name: "Baignoire",
        description:
            "Une baignoire.",
        x: 7,
        z: -6.5,
        w: 3.5,
        d: 1.5,
        h: .7,
        color: "#f4f4f4"
    },

    {
        name: "Lavabo",
        description:
            "Le lavabo de la salle de bain.",
        x: 4,
        z: -6.5,
        w: 1.5,
        d: .8,
        h: 1,
        color: "#f4f4f4"
    },

    {
        name: "Plante",
        description:
            "Une plante décorative.",
        x: -8,
        z: 5,
        w: 1,
        d: 1,
        h: 2.5,
        color: "#4d7d4c"
    },

    {
        name: "Plante",
        description:
            "Une plante décorative.",
        x: 9,
        z: 6,
        w: 1,
        d: 1,
        h: 2.5,
        color: "#4d7d4c"
    },

    {
        name: "Lampe",
        description:
            "Une lampe sur pied.",
        x: 4,
        z: 1,
        w: .7,
        d: .7,
        h: 3,
        color: "#d9bd7a"
    }

];


/* =========================================================
   REDIMENSIONNEMENT
========================================================= */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * ratio;

    canvas.height =
        height * ratio;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   PROJECTION 3D
========================================================= */

function project(x, y, z) {

    const cos =
        Math.cos(rotation);

    const sin =
        Math.sin(rotation);

    const rx =
        x * cos -
        z * sin;

    const rz =
        x * sin +
        z * cos;

    const depth =
        rz + 35;

    const perspective =
        850 / depth;

    return {

        x:
            width / 2 +
            rx *
            perspective *
            zoom,

        y:
            height * .60 -
            (y - cameraHeight) *
            perspective *
            zoom,

        depth:
            depth

    };

}


/* =========================================================
   POLYGONE
========================================================= */

function polygon(points, color) {

    ctx.beginPath();

    ctx.moveTo(
        points[0].x,
        points[0].y
    );

    for(let i = 1; i < points.length; i++) {

        ctx.lineTo(
            points[i].x,
            points[i].y
        );

    }

    ctx.closePath();

    ctx.fillStyle =
        color;

    ctx.fill();

    ctx.strokeStyle =
        "rgba(0,0,0,.13)";

    ctx.lineWidth =
        1;

    ctx.stroke();
}


/* =========================================================
   BOÎTE 3D
========================================================= */

function box(
    x,
    y,
    z,
    w,
    h,
    d,
    color
) {

    const p1 =
        project(
            x - w/2,
            y,
            z - d/2
        );

    const p2 =
        project(
            x + w/2,
            y,
            z - d/2
        );

    const p3 =
        project(
            x + w/2,
            y,
            z + d/2
        );

    const p4 =
        project(
            x - w/2,
            y,
            z + d/2
        );

    const t1 =
        project(
            x - w/2,
            y + h,
            z - d/2
        );

    const t2 =
        project(
            x + w/2,
            y + h,
            z - d/2
        );

    const t3 =
        project(
            x + w/2,
            y + h,
            z + d/2
        );

    const t4 =
        project(
            x - w/2,
            y + h,
            z + d/2
        );


    /* dessus */

    polygon(
        [t1,t2,t3,t4],
        shade(color, 25)
    );


    /* face gauche */

    polygon(
        [t1,t4,p4,p1],
        shade(color, -8)
    );


    /* face droite */

    polygon(
        [t2,t3,p3,p2],
        shade(color, -25)
    );


    /* face avant */

    polygon(
        [t4,t3,p3,p4],
        shade(color, -15)
    );

}


/* =========================================================
   COULEUR
========================================================= */

function shade(hex, amount) {

    let color =
        hex.replace("#","");

    let r =
        parseInt(
            color.substring(0,2),
            16
        );

    let g =
        parseInt(
            color.substring(2,4),
            16
        );

    let b =
        parseInt(
            color.substring(4,6),
            16
        );

    r =
        Math.max(
            0,
            Math.min(
                255,
                r + amount
            )
        );

    g =
        Math.max(
            0,
            Math.min(
                255,
                g + amount
            )
        );

    b =
        Math.max(
            0,
            Math.min(
                255,
                b + amount
            )
        );

    return (
        "#" +
        r.toString(16).padStart(2,"0") +
        g.toString(16).padStart(2,"0") +
        b.toString(16).padStart(2,"0")
    );

}


/* =========================================================
   SOL
========================================================= */

function drawFloor() {

    const floor =
        "#c6a47d";

    box(
        0,
        -0.3,
        0,
        22,
        .3,
        18,
        floor
    );

}


/* =========================================================
   MURS
========================================================= */

function drawWalls() {

    const wall =
        night
        ? "#515862"
        : "#eeeae0";


    /* mur arrière */

    box(
        0,
        0,
        -9,
        22,
        4.5,
        .35,
        wall
    );


    /* mur gauche */

    box(
        -11,
        0,
        0,
        .35,
        4.5,
        18,
        wall
    );


    /* mur droit */

    box(
        11,
        0,
        0,
        .35,
        4.5,
        18,
        wall
    );


    /* mur avant */

    box(
        0,
        0,
        9,
        22,
        4.5,
        .35,
        wall
    );


    /* séparation chambre */

    box(
        2.5,
        0,
        -4.5,
        .25,
        4.2,
        9,
        wall
    );


    /* séparation cuisine */

    box(
        -7.5,
        0,
        2,
        7,
        4.2,
        .25,
        wall
    );

}


/* =========================================================
   FENÊTRES
========================================================= */

function drawWindows() {

    const glass =
        night
        ? "#263c58"
        : "#7fc4e4";


    box(
        -3,
        1.8,
        -8.75,
        5,
        2.5,
        .08,
        glass
    );


    box(
        8,
        1.8,
        8.75,
        4.5,
        2.5,
        .08,
        glass
    );

}


/* =========================================================
   MEUBLES
========================================================= */

function drawObjects() {

    const sorted =
        [...objects].sort(
            (a,b) =>
                b.z - a.z
        );


    for(const obj of sorted) {

        box(
            obj.x,
            0,
            obj.z,
            obj.w,
            obj.h,
            obj.d,
            obj.color
        );


        /* détails du lit */

        if(obj.name === "Lit") {

            box(
                obj.x,
                1.4,
                obj.z + 1,
                obj.w - .3,
                .18,
                3,
                "#819aa0"
            );

            box(
                obj.x - 1.2,
                1.5,
                obj.z - 1.8,
                1.6,
                .22,
                .9,
                "#ffffff"
            );

            box(
                obj.x + 1.2,
                1.5,
                obj.z - 1.8,
                1.6,
                .22,
                .9,
                "#ffffff"
            );

        }


        /* détails canapé */

        if(obj.name === "Canapé") {

            box(
                obj.x,
                1.7,
                obj.z - .7,
                obj.w,
                1.5,
                .35,
                obj.color
            );

        }


        /* table */

        if(obj.name === "Table basse") {

            for(
                let i = -1;
                i <= 1;
                i += 2
            ) {

                for(
                    let j = -1;
                    j <= 1;
                    j += 2
                ) {

                    box(
                        obj.x + i * 1.2,
                        0,
                        obj.z + j * .5,
                        .15,
                        1,
                        .15,
                        "#704625"
                    );

                }

            }

        }


        /* plantes */

        if(obj.name === "Plante") {

            box(
                obj.x,
                obj.h,
                obj.z,
                .7,
                1.3,
                .7,
                "#3f7048"
            );

        }


        /* lampe */

        if(obj.name === "Lampe") {

            box(
                obj.x,
                0,
                obj.z,
                .12,
                2.3,
                .12,
                "#333333"
            );

            box(
                obj.x,
                2.3,
                obj.z,
                1.1,
                .7,
                1.1,
                "#f0d59a"
            );

        }

    }

}


/* =========================================================
   TEXTE DES PIÈCES
========================================================= */

function drawRoomLabels() {

    drawText(
        "SALON",
        -3,
        0,
        4
    );

    drawText(
        "CUISINE",
        -6,
        0,
        -5
    );

    drawText(
        "CHAMBRE",
        6,
        0,
        5
    );

    drawText(
        "SALLE DE BAIN",
        7,
        0,
        -5.5
    );

}


function drawText(
    text,
    x,
    y,
    z
) {

    const p =
        project(
            x,
            y + .03,
            z
        );

    ctx.save();

    ctx.font =
        "900 13px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        night
        ? "rgba(255,255,255,.6)"
        : "rgba(40,55,65,.42)";

    ctx.fillText(
        text,
        p.x,
        p.y
    );

    ctx.restore();

}


/* =========================================================
   CIEL
========================================================= */

function drawBackground() {

    if(night) {

        ctx.fillStyle =
            "#101827";

    } else {

        ctx.fillStyle =
            "#b9d7e5";

    }

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

}


/* =========================================================
   OMBRE
========================================================= */

function drawShadow() {

    ctx.save();

    ctx.fillStyle =
        night
        ? "rgba(0,0,0,.35)"
        : "rgba(0,0,0,.12)";

    ctx.beginPath();

    ctx.ellipse(
        width/2,
        height*.73,
        width*.33 * zoom,
        35 * zoom,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   RENDU
========================================================= */

function render() {

    drawBackground();

    drawShadow();

    drawFloor();

    drawWalls();

    drawWindows();

    drawObjects();

    drawRoomLabels();

    requestAnimationFrame(
        render
    );

}


/* =========================================================
   ROTATION AU DOIGT
========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(e) {

        dragging = true;

        lastX =
            e.clientX;

        lastY =
            e.clientY;

        canvas.setPointerCapture(
            e.pointerId
        );

    }
);


canvas.addEventListener(
    "pointermove",
    function(e) {

        if(!dragging)
            return;

        const dx =
            e.clientX - lastX;

        rotation +=
            dx * .008;

        lastX =
            e.clientX;

        lastY =
            e.clientY;

    }
);


canvas.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


canvas.addEventListener(
    "pointercancel",
    function() {

        dragging = false;

    }
);


/* =========================================================
   ZOOM SOURIS
========================================================= */

canvas.addEventListener(
    "wheel",
    function(e) {

        e.preventDefault();

        zoom +=
            e.deltaY < 0
            ? .08
            : -.08;

        zoom =
            Math.max(
                .55,
                Math.min(
                    1.8,
                    zoom
                )
            );

    },
    {passive:false}
);


/* =========================================================
   ZOOM BOUTONS
========================================================= */

document
.getElementById("plus")
.addEventListener(
    "click",
    function() {

        zoom += .15;

        zoom =
            Math.min(
                1.8,
                zoom
            );

    }
);


document
.getElementById("minus")
.addEventListener(
    "click",
    function() {

        zoom -= .15;

        zoom =
            Math.max(
                .55,
                zoom
            );

    }
);


/* =========================================================
   JOUR / NUIT
========================================================= */

document
.getElementById("day")
.addEventListener(
    "click",
    function() {

        night =
            !night;

        this.textContent =
            night
            ? "☀️"
            : "🌙";

    }
);


/* =========================================================
   RESET
========================================================= */

document
.getElementById("reset")
.addEventListener(
    "click",
    function() {

        rotation = -.55;

        zoom = 1;

        night = false;

        document
        .getElementById("day")
        .textContent = "☀️";

    }
);


/* =========================================================
   TOUCH / CLIC OBJETS
========================================================= */

canvas.addEventListener(
    "click",
    function(e) {

        /* éviter le clic après déplacement */

        const x =
            e.clientX;

        const y =
            e.clientY;


        let closest = null;

        let distance = 99999;


        for(const obj of objects) {

            const p =
                project(
                    obj.x,
                    obj.h * .6,
                    obj.z
                );

            const dx =
                x - p.x;

            const dy =
                y - p.y;

            const d =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if(
                d < distance &&
                d < 90
            ) {

                closest =
                    obj;

                distance =
                    d;

            }

        }


        if(closest) {

            roomLabel.textContent =
                closest.name;

            info.innerHTML =
                "<strong>" +
                closest.name +
                "</strong><br>" +
                closest.description;

            info.style.opacity =
                "1";


            clearTimeout(
                window.infoTimeout
            );


            window.infoTimeout =
                setTimeout(
                    function() {

                        info.style.opacity =
                            "0";

                    },
                    3000
                );

        }

    }
);


/* =========================================================
   DÉMARRAGE
========================================================= */

try {

    render();

} catch(error) {

    errorBox.style.display =
        "block";

    errorBox.innerHTML =
        "<strong>Erreur :</strong><br><br>" +
        error.message;

}

</script>

</body>
</html>
