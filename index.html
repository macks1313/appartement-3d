<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mon Appartement — Prototype 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#game{position:fixed;inset:0;background:linear-gradient(#a9c8d8 0 48%,#b9a58f 48% 100%)}
.scene{position:absolute;inset:0;perspective:900px;overflow:hidden}
.room{position:absolute;width:900px;height:620px;left:50%;top:50%;transform:translate(-50%,-46%) rotateX(57deg) rotateZ(-1deg);transform-style:preserve-3d;transition:transform .12s}
.floor{position:absolute;inset:0;background:#b99570;box-shadow:0 25px 40px #0006;border:8px solid #87684e}
.wall{position:absolute;background:#e8e1d5;border:2px solid #c8c0b2}
.back{left:0;top:-120px;width:900px;height:125px;transform:rotateX(90deg);transform-origin:bottom}
.left{left:-125px;top:0;width:125px;height:620px;transform:rotateY(90deg);transform-origin:right}
.right{right:-125px;top:0;width:125px;height:620px;transform:rotateY(-90deg);transform-origin:left}
.rug{position:absolute;left:250px;top:260px;width:390px;height:220px;background:#758a83;border-radius:18px;transform:translateZ(3px);box-shadow:inset 0 0 0 5px #66776f}
.sofa{position:absolute;left:300px;top:195px;width:270px;height:100px;background:#77736c;border-radius:18px;transform:translateZ(48px);box-shadow:0 13px 0 #5b5752;cursor:pointer}
.sofa:before,.sofa:after{content:"";position:absolute;top:10px;width:28px;height:80px;background:#625f5a;border-radius:10px}.sofa:before{left:-14px}.sofa:after{right:-14px}
.table{position:absolute;left:360px;top:355px;width:160px;height:85px;background:#8a5e3b;border-radius:10px;transform:translateZ(48px);box-shadow:0 7px 0 #68452d;cursor:pointer}
.leg{position:absolute;width:10px;height:55px;background:#5f402b;bottom:-55px}.l1{left:15px}.l2{right:15px}
.tv{position:absolute;left:650px;top:125px;width:150px;height:90px;background:#202124;border:7px solid #111;border-radius:6px;transform:translateZ(50px);cursor:pointer}
.tv:after{content:"";position:absolute;inset:10px;background:#111;transition:.25s}.tv.on:after{background:linear-gradient(135deg,#6fc4df,#d5a4ef,#f4d58c)}
.plant{position:absolute;left:80px;top:180px;width:60px;height:80px;cursor:pointer;transform:translateZ(10px)}
.pot{position:absolute;bottom:0;left:15px;width:32px;height:28px;background:#a95f43;border-radius:4px}
.leaf{position:absolute;width:32px;height:52px;background:#3e7d51;border-radius:100% 0 100% 0;transform-origin:bottom}
.leaf.a{left:4px;bottom:18px;transform:rotate(-28deg)}.leaf.b{left:25px;bottom:20px;transform:rotate(30deg)}.leaf.c{left:16px;bottom:30px;transform:rotate(2deg)}
.lamp{position:absolute;left:120px;top:55px;width:60px;height:150px;transform:translateZ(30px);cursor:pointer}
.shade{width:60px;height:42px;background:#d4b76f;border-radius:50% 50% 20% 20%;box-shadow:0 0 0 2px #9b824a}.pole{width:6px;height:75px;background:#55483a;margin:auto}.base{width:35px;height:8px;background:#55483a;margin:auto;border-radius:5px}
.window{position:absolute;left:300px;top:-112px;width:300px;height:112px;background:linear-gradient(#9dd1e7,#d9eef5);border:8px solid #735b47;transform:rotateX(90deg);transform-origin:bottom;cursor:pointer}
.window:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:5px solid #735b47}.window:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:5px solid #735b47}
.door{position:absolute;right:30px;top:-115px;width:85px;height:115px;background:#684936;border:5px solid #493225;transform:rotateX(90deg);transform-origin:bottom;cursor:pointer}
#hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px}.card{background:#fffffff0;backdrop-filter:blur(12px);border-radius:15px;padding:10px 13px;box-shadow:0 5px 20px #0002}.title{font-weight:800}.status{font-size:12px;color:#555}
.buttons{position:absolute;right:14px;bottom:18px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.buttons button{border:0;background:#fffffff0;width:48px;height:48px;border-radius:15px;box-shadow:0 5px 16px #0002;font-size:22px}
#message{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);padding:11px 15px;opacity:0;transition:.2s;white-space:nowrap}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#fff8;text-shadow:0 1px 5px #000;pointer-events:none}
#hint{position:absolute;left:14px;bottom:18px;max-width:270px;font-size:12px;line-height:1.3}
</style>
</head>
<body>
<div id="game">
<div class="scene" id="scene">
<div class="room" id="room">
<div class="floor"></div><div class="wall back"></div><div class="wall left"></div><div class="wall right"></div>
<div class="window" id="window"></div><div class="door" id="door"></div><div class="rug"></div>
<div class="sofa" data-name="Canapé" data-msg="Tu t'installes sur le canapé. Confort maximal."></div>
<div class="table" data-name="Table" data-msg="Sur la table : une tasse, un téléphone et quelques clés."><div class="leg l1"></div><div class="leg l2"></div></div>
<div class="tv" id="tv" data-name="Télévision" data-msg="La télévision s'allume."></div>
<div class="plant" data-name="Plante" data-msg="La plante a besoin d'un peu d'eau."><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div><div class="pot"></div></div>
<div class="lamp" id="lamp" data-name="Lampe" data-msg="La lumière du salon change."><div class="shade"></div><div class="pole"></div><div class="base"></div></div>
</div></div>
<div id="cross">+</div>
<div id="hud">
<div class="top"><div class="card title">🏠 MON APPARTEMENT</div><div class="card status" id="status">Exploration · Jour</div></div>
<div class="buttons"><button id="zoomIn">＋</button><button id="zoomOut">−</button><button id="night">🌙</button><button id="reset">⌖</button></div>
<div class="card" id="hint">👆 Glisse pour regarder autour de toi.<br>👆 Touche les objets pour les découvrir.</div>
<div class="card" id="message"></div>
</div></div>
<script>
const room=document.getElementById('room'), scene=document.getElementById('scene'), msg=document.getElementById('message'), status=document.getElementById('status');
let rx=57, rz=-1, scale=1;
function update(){room.style.transform=`translate(-50%,-46%) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${scale})`}
function say(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>msg.style.opacity=0,2200)}
document.querySelectorAll('[data-name]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();say('✨ '+el.dataset.name+' — '+el.dataset.msg)}));
document.getElementById('tv').onclick=()=>{tv.classList.toggle('on');say(tv.classList.contains('on')?'📺 Télévision allumée':'📺 Télévision éteinte')};
let night=false;document.getElementById('night').onclick=()=>{night=!night;document.body.style.background=night?'#10151e':'#17181b';document.querySelector('.scene').style.filter=night?'brightness(.58) saturate(.8)':'none';status.textContent=night?'Exploration · Nuit':'Exploration · Jour';say(night?'🌙 Les lumières de la ville apparaissent.':'☀️ Retour au jour.')};
document.getElementById('zoomIn').onclick=()=>{scale=Math.min(1.5,scale+.12);update()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.65,scale-.12);update()};document.getElementById('reset').onclick=()=>{rx=57;rz=-1;scale=1;update();say('📍 Vue réinitialisée')};
let drag=false,lx=0,ly=0;
scene.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;scene.setPointerCapture(e.pointerId)});
scene.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;rz+=dx*.10;rx=Math.max(35,Math.min(75,rx-dy*.08));lx=e.clientX;ly=e.clientY;update()});
scene.addEventListener('pointerup',()=>drag=false);
scene.addEventListener('pointercancel',()=>drag=false);
let wheel=(e)=>{scale=Math.max(.65,Math.min(1.5,scale*(e.deltaY>0?.94:1.06)));update()};scene.addEventListener('wheel',wheel,{passive:true});
update();
</script>
</body></html>
