<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Appartement 03</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --cream:#eee9dc;
    --dark:#18201d;
    --wood:#76543e;
    --green:#3f5b4d;
    --gold:#c79b55;
    --text:#17201d;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#101311;
}

body{
    color:var(--text);
}

/* =========================
   APP
========================= */

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#101311;
}

#topbar{
    position:absolute;
    z-index:100;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.pill{
    pointer-events:auto;
    border:0;
    background:rgba(244,241,230,.96);
    color:#17201d;
    border-radius:50px;
    padding:16px 25px;
    font-size:18px;
    font-weight:900;
    letter-spacing:.5px;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
    backdrop-filter:blur(12px);
}

#controls{
    display:flex;
    gap:8px;
}

.control{
    width:54px;
    height:54px;
    padding:0;
    display:grid;
    place-items:center;
    font-size:25px;
    cursor:pointer;
}

.control.active{
    background:#192a24;
    color:white;
}

/* =========================
   ROOM
========================= */

#viewport{
    position:absolute;
    inset:0;
    overflow:hidden;
    touch-action:none;
}

#world{
    position:absolute;
    width:1200px;
    height:850px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(1);
    transform-origin:center center;
    transition:transform .12s ease-out;
}

/* light atmosphere */

#room{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 72% 27%,rgba(255,211,132,.85),transparent 19%),
        linear-gradient(#b8c7c4 0%,#d7c7b0 45%,#d19d72 100%);
}

#room.night{
    background:
        radial-gradient(circle at 70% 28%,rgba(255,180,70,.15),transparent 20%),
        linear-gradient(#111d2b,#292b31 45%,#241d1b);
}

#room.sunset{
    background:
        radial-gradient(circle at 70% 30%,#ffd17a,transparent 18%),
        linear-gradient(#8b7582,#d69770 42%,#8d5748 100%);
}

/* wall */

.wall{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:570px;
    background:
        linear-gradient(90deg,rgba(255,255,255,.18),transparent 30%,rgba(0,0,0,.04)),
        #d9c5a9;
}

#room.night .wall{
    background:#30302d;
}

/* floor */

.floor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:310px;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 118px,
            rgba(83,53,37,.18) 119px 121px
        ),
        repeating-linear-gradient(
            0deg,
            #a87552 0 76px,
            #8e634a 77px 79px
        );
    transform:perspective(500px) rotateX(35deg);
    transform-origin:bottom;
}

#room.night .floor{
    background:
        repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.2) 119px 121px),
        repeating-linear-gradient(0deg,#604936 0 76px,#503b30 77px 79px);
}

/* =========================
   WINDOW
========================= */

.window{
    position:absolute;
    left:255px;
    top:105px;
    width:690px;
    height:390px;
    background:
        linear-gradient(to bottom,
        #9ac6d5 0%,
        #a7c8c8 52%,
        #dfaa7b 100%);
    border:18px solid #5b3c2d;
    box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.window:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(150deg,transparent 48%,rgba(255,255,255,.12) 49%,transparent 51%);
}

#room.night .window{
    background:
        radial-gradient(circle at 75% 22%,#eee3a1 0 7px,transparent 8px),
        linear-gradient(#172638,#263847 65%,#4a3532);
}

.window-frame-v{
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:14px;
    background:#5b3c2d;
    transform:translateX(-50%);
}

.window-frame-h{
    position:absolute;
    left:0;
    right:0;
    top:55%;
    height:13px;
    background:#5b3c2d;
}

/* mountains */

.mountain{
    position:absolute;
    bottom:0;
    width:0;
    height:0;
    border-left:120px solid transparent;
    border-right:120px solid transparent;
    border-bottom:180px solid #607879;
}

.m1{left:40px}
.m2{left:220px;border-bottom-color:#4c696d;border-left-width:150px;border-right-width:150px}
.m3{left:420px;border-bottom-color:#718080}
.m4{left:570px;border-bottom-color:#52696a;border-left-width:170px;border-right-width:170px}

.water{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:85px;
    background:linear-gradient(#809da0,#68878c);
}

/* =========================
   DECORATION
========================= */

.rug{
    position:absolute;
    left:370px;
    bottom:78px;
    width:460px;
    height:220px;
    background:
        repeating-linear-gradient(
            45deg,
            #8b5d48 0 15px,
            #bd906b 15px 30px,
            #725b4b 30px 42px
        );
    transform:skew(-5deg);
    border-radius:6px;
    box-shadow:0 20px 25px rgba(0,0,0,.2);
}

.sofa{
    position:absolute;
    left:385px;
    top:455px;
    width:475px;
    height:180px;
    background:#eee7d6;
    border-radius:28px 28px 18px 18px;
    box-shadow:0 20px 35px rgba(0,0,0,.2);
}

.sofa:before{
    content:"";
    position:absolute;
    left:20px;
    right:20px;
    top:-50px;
    height:105px;
    background:#eee7d6;
    border-radius:35px 35px 10px 10px;
}

.cushion{
    position:absolute;
    width:105px;
    height:75px;
    border-radius:18px;
    top:-23px;
    z-index:3;
}

.c1{left:45px;background:#536e60}
.c2{left:185px;background:#b86f50}
.c3{right:50px;background:#d6b47d}

.blanket{
    position:absolute;
    right:45px;
    top:510px;
    width:130px;
    height:170px;
    background:
        repeating-linear-gradient(45deg,#735b48 0 12px,#94735a 12px 24px);
    transform:rotate(12deg);
    border-radius:20px;
    z-index:5;
}

/* table */

.table{
    position:absolute;
    left:510px;
    top:585px;
    width:270px;
    height:120px;
    background:#795237;
    border-radius:18px;
    z-index:10;
    box-shadow:0 18px 30px rgba(0,0,0,.28);
}

.table:before,
.table:after{
    content:"";
    position:absolute;
    width:20px;
    height:145px;
    background:#5a3d2d;
    top:75px;
}

.table:before{left:35px}
.table:after{right:35px}

/* coffee */

.cup{
    position:absolute;
    left:55px;
    top:25px;
    width:42px;
    height:35px;
    border-radius:5px 5px 15px 15px;
    background:#eee5d3;
    cursor:pointer;
}

.cup:after{
    content:"";
    position:absolute;
    right:-15px;
    top:7px;
    width:17px;
    height:18px;
    border:5px solid #eee5d3;
    border-left:0;
    border-radius:0 12px 12px 0;
}

/* book stack */

.books{
    position:absolute;
    right:38px;
    top:28px;
    width:65px;
    height:60px;
    cursor:pointer;
}

.book{
    position:absolute;
    width:70px;
    height:18px;
    border-radius:3px;
    color:white;
    font-size:8px;
    font-weight:bold;
    padding:4px;
}

.b1{bottom:0;background:#344e45}
.b2{bottom:17px;background:#9b634c;transform:rotate(-3deg)}
.b3{bottom:34px;background:#c59c5e;transform:rotate(2deg)}

/* plant */

.plant{
    position:absolute;
    left:65px;
    top:445px;
    width:120px;
    height:190px;
    z-index:8;
}

.pot{
    position:absolute;
    bottom:0;
    left:30px;
    width:65px;
    height:70px;
    background:#b77d50;
    clip-path:polygon(10% 0,90% 0,75% 100%,25% 100%);
}

.leaf{
    position:absolute;
    width:70px;
    height:105px;
    background:#3f6550;
    border-radius:100% 0 100% 0;
    transform-origin:bottom;
}

.l1{left:45px;bottom:55px;transform:rotate(-30deg)}
.l2{left:65px;bottom:55px;transform:rotate(25deg)}
.l3{left:10px;bottom:60px;transform:rotate(-60deg)}
.l4{left:35px;bottom:75px;transform:rotate(10deg)}

/* lamp */

.lamp{
    position:absolute;
    right:90px;
    top:330px;
    width:100px;
    height:180px;
    z-index:20;
    cursor:pointer;
}

.lamp-shade{
    position:absolute;
    top:0;
    left:0;
    width:100px;
    height:55px;
    background:#343d32;
    clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
}

.lamp-stem{
    position:absolute;
    top:55px;
    left:47px;
    width:7px;
    height:100px;
    background:#4d4036;
}

.lamp-light{
    position:absolute;
    top:-45px;
    left:-60px;
    width:220px;
    height:220px;
    background:radial-gradient(circle,rgba(255,213,106,.65),transparent 65%);
    opacity:0;
    pointer-events:none;
}

.lamp.on .lamp-light{
    opacity:1;
}

/* =========================
   CAT
========================= */

.cat{
    position:absolute;
    left:760px;
    top:470px;
    width:145px;
    height:125px;
    z-index:30;
    cursor:pointer;
    transition:transform .35s;
}

.cat:hover{
    transform:translateY(-8px);
}

.cat-body{
    position:absolute;
    left:20px;
    bottom:5px;
    width:110px;
    height:80px;
    background:#413b39;
    border-radius:55% 55% 45% 45%;
}

.cat-head{
    position:absolute;
    left:18px;
    top:0;
    width:85px;
    height:80px;
    background:#4b4441;
    border-radius:50%;
}

.ear{
    position:absolute;
    top:-20px;
    width:34px;
    height:42px;
    background:#4b4441;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.ear.left{left:4px}
.ear.right{right:4px}

.eye{
    position:absolute;
    top:31px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#e8bd51;
}

.eye.left{left:22px}
.eye.right{right:22px}

.nose{
    position:absolute;
    top:49px;
    left:39px;
    width:10px;
    height:8px;
    border-radius:50%;
    background:#d88d86;
}

.tail{
    position:absolute;
    right:-38px;
    bottom:25px;
    width:75px;
    height:100px;
    border:17px solid #413b39;
    border-left:0;
    border-radius:0 70px 70px 0;
    transform:rotate(-15deg);
}

.cat.sleep .eye{
    height:2px;
    top:36px;
    border-radius:0;
}

.cat.happy{
    animation:catBounce .45s ease;
}

@keyframes catBounce{
    50%{transform:translateY(-25px) rotate(-3deg)}
}

/* =========================
   WALL ART
========================= */

.art{
    position:absolute;
    cursor:pointer;
    transition:transform .25s;
}

.art:hover{
    transform:scale(1.06) rotate(-1deg);
}

.art-frame{
    width:125px;
    height:150px;
    background:#704e3b;
    padding:9px;
    box-shadow:0 12px 20px rgba(0,0,0,.18);
}

.art-inner{
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 50% 70%,#d78a61 0 16%,transparent 17%),
        linear-gradient(150deg,#596e69,#e0a477);
    position:relative;
    overflow:hidden;
}

.art-inner:after{
    content:"BONHEUR";
    position:absolute;
    bottom:12px;
    left:0;
    right:0;
    text-align:center;
    font-family:Georgia,serif;
    font-weight:bold;
    color:#51382e;
    font-size:12px;
}

.art1{left:950px;top:160px}
.art2{left:95px;top:180px;transform:rotate(-4deg)}

/* shelf */

.shelf{
    position:absolute;
    left:40px;
    top:310px;
    width:190px;
    height:185px;
    z-index:15;
}

.shelf-board{
    position:absolute;
    left:0;
    width:190px;
    height:14px;
    background:#684936;
}

.sb1{top:0}
.sb2{top:72px}
.sb3{top:145px}

.book-small{
    position:absolute;
    bottom:14px;
    width:27px;
    height:65px;
    border-radius:2px 2px 0 0;
}

.bs1{left:12px;background:#9b634c}
.bs2{left:42px;height:75px;background:#b78c4e}
.bs3{left:73px;height:58px;background:#496254}
.bs4{left:105px;height:78px;background:#805c55}
.bs5{left:140px;height:68px;background:#b99d6b}

/* =========================
   UI
========================= */

#hint{
    position:absolute;
    z-index:90;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    width:min(90%,760px);
    background:rgba(244,241,230,.94);
    border-radius:28px;
    padding:16px 22px;
    text-align:center;
    font-weight:800;
    font-size:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
}

#toast{
    position:absolute;
    z-index:200;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.8);
    width:min(88%,420px);
    padding:28px;
    border-radius:25px;
    background:rgba(24,32,29,.95);
    color:white;
    box-shadow:0 25px 70px rgba(0,0,0,.4);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    text-align:center;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

#toast h2{
    margin:0 0 10px;
    font-size:24px;
}

#toast p{
    margin:0;
    line-height:1.5;
    color:#d7ddd8;
}

.close{
    position:absolute;
    top:12px;
    right:15px;
    border:0;
    background:none;
    color:white;
    font-size:25px;
}

/* mobile */

@media(max-width:700px){
    #topbar{
        top:16px;
        left:14px;
        right:14px;
    }

    .pill{
        padding:14px 18px;
        font-size:15px;
    }

    .control{
        width:45px;
        height:45px;
        font-size:20px;
    }

    #controls{
        gap:5px;
    }

    #hint{
        bottom:18px;
        font-size:14px;
        padding:14px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="topbar">
        <button class="pill" onclick="showInfo('Appartement 03','Bienvenue chez toi. Explore la pièce, touche les objets et change complètement l’ambiance.')">
            🏠 APPARTEMENT 03
        </button>

        <div id="controls">
            <button class="pill control active" id="dayBtn" onclick="setMood('day')">☀️</button>
            <button class="pill control" onclick="setMood('sunset')">🌅</button>
            <button class="pill control" onclick="setMood('night')">🌙</button>
            <button class="pill control" onclick="resetCamera()">🎥</button>
        </div>
    </div>

    <div id="viewport">

        <div id="world">

            <div id="room">

                <div class="wall"></div>

                <div class="window">
                    <div class="mountain m1"></div>
                    <div class="mountain m2"></div>
                    <div class="mountain m3"></div>
                    <div class="mountain m4"></div>
                    <div class="water"></div>
                    <div class="window-frame-v"></div>
                    <div class="window-frame-h"></div>
                </div>

                <div class="art art1" onclick="showInfo('Vue sur le lac','Une grande fenêtre ouverte sur les montagnes. Clique sur les modes ☀️ 🌅 🌙 pour changer la lumière.')">
                    <div class="art-frame">
                        <div class="art-inner"></div>
                    </div>
                </div>

                <div class="art art2" onclick="showInfo('Souvenir','Quelques photos et souvenirs donnent à l’appartement son caractère.')">
                    <div class="art-frame">
                        <div class="art-inner"></div>
                    </div>
                </div>

                <div class="shelf">
                    <div class="shelf-board sb1"></div>
                    <div class="shelf-board sb2"></div>
                    <div class="shelf-board sb3"></div>

                    <div class="book-small bs1"></div>
                    <div class="book-small bs2"></div>
                    <div class="book-small bs3"></div>
                    <div class="book-small bs4"></div>
                    <div class="book-small bs5"></div>
                </div>

                <div class="plant">
                    <div class="leaf l1"></div>
                    <div class="leaf l2"></div>
                    <div class="leaf l3"></div>
                    <div class="leaf l4"></div>
                    <div class="pot"></div>
                </div>

                <div class="sofa">
                    <div class="cushion c1"></div>
                    <div class="cushion c2"></div>
                    <div class="cushion c3"></div>
                </div>

                <div class="blanket"></div>

                <div class="rug"></div>

                <div class="table">

                    <div class="cup"
                         onclick="showInfo('Café','Un café fraîchement préparé. ☕')">
                    </div>

                    <div class="books"
                         onclick="showInfo('Livres','Voyage, cuisine, photographie… Quelques livres traînent sur la table.')">
                        <div class="book b1">VOYAGES</div>
                        <div class="book b2">CUISINE</div>
                        <div class="book b3">DESIGN</div>
                    </div>

                </div>

                <div class="lamp"
                     onclick="toggleLamp()">
                    <div class="lamp-light"></div>
                    <div class="lamp-shade"></div>
                    <div class="lamp-stem"></div>
                </div>

                <div class="cat"
                     id="cat"
                     onclick="catInteraction()">

                    <div class="tail"></div>

                    <div class="cat-body"></div>

                    <div class="cat-head">
                        <div class="ear left"></div>
                        <div class="ear right"></div>
                        <div class="eye left"></div>
                        <div class="eye right"></div>
                        <div class="nose"></div>
                    </div>

                </div>

                <div class="floor"></div>

            </div>

        </div>

    </div>

    <div id="hint">
        👆 Glisse pour regarder · 🤏 Pince pour zoomer · ✨ Touche les objets
    </div>

    <div id="toast">
        <button class="close" onclick="closeInfo()">×</button>
        <h2 id="toastTitle"></h2>
        <p id="toastText"></p>
    </div>

</div>

<script>

/* =====================================================
   CAMERA
===================================================== */

const world = document.getElementById("world");

let scale = 1;
let posX = 0;
let posY = 0;

let dragging = false;
let startX = 0;
let startY = 0;
let initialX = 0;
let initialY = 0;

function updateCamera(){

    scale = Math.max(.75,Math.min(1.7,scale));

    world.style.transform =
        `translate(calc(-50% + ${posX}px),calc(-50% + ${posY}px)) scale(${scale})`;
}

const viewport = document.getElementById("viewport");

viewport.addEventListener("pointerdown",e=>{

    if(e.target.closest("button,.cat,.cup,.books,.lamp,.art")) return;

    dragging=true;

    startX=e.clientX;
    startY=e.clientY;

    initialX=posX;
    initialY=posY;

    viewport.setPointerCapture(e.pointerId);
});

viewport.addEventListener("pointermove",e=>{

    if(!dragging)return;

    posX=initialX+(e.clientX-startX);
    posY=initialY+(e.clientY-startY);

    updateCamera();
});

viewport.addEventListener("pointerup",()=>{
    dragging=false;
});

viewport.addEventListener("wheel",e=>{

    e.preventDefault();

    scale += e.deltaY < 0 ? .08 : -.08;

    updateCamera();

},{passive:false});


/* =====================================================
   PINCH ZOOM MOBILE
===================================================== */

let pinchDistance=null;
let pinchScale=1;

viewport.addEventListener("touchstart",e=>{

    if(e.touches.length===2){

        pinchDistance=Math.hypot(
            e.touches[0].clientX-e.touches[1].clientX,
            e.touches[0].clientY-e.touches[1].clientY
        );

        pinchScale=scale;
    }

},{passive:true});


viewport.addEventListener("touchmove",e=>{

    if(e.touches.length!==2)return;

    const distance=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY
    );

    if(pinchDistance){

        scale=pinchScale*(distance/pinchDistance);

        updateCamera();
    }

},{passive:true});


viewport.addEventListener("touchend",()=>{
    pinchDistance=null;
});


function resetCamera(){

    scale=1;
    posX=0;
    posY=0;

    updateCamera();

    showInfo(
        "Mode caméra",
        "La vue est revenue au centre. Sur ordinateur, utilise la molette. Sur téléphone, pince pour zoomer et glisse pour explorer."
    );
}


/* =====================================================
   AMBIANCE
===================================================== */

const room=document.getElementById("room");
const dayBtn=document.getElementById("dayBtn");

function setMood(mood){

    room.classList.remove("night","sunset");

    document.querySelectorAll(".control").forEach(b=>{
        b.classList.remove("active");
    });

    if(mood==="night"){
        room.classList.add("night");
        document.querySelectorAll(".control")[2].classList.add("active");
    }

    if(mood==="sunset"){
        room.classList.add("sunset");
        document.querySelectorAll(".control")[1].classList.add("active");
    }

    if(mood==="day"){
        dayBtn.classList.add("active");
    }
}


/* =====================================================
   LAMPE
===================================================== */

function toggleLamp(){

    const lamp=document.querySelector(".lamp");

    lamp.classList.toggle("on");

    if(lamp.classList.contains("on")){

        showInfo(
            "Lampe allumée",
            "La lumière chaude change l’ambiance de la pièce."
        );

    }else{

        showInfo(
            "Lampe éteinte",
            "La pièce retrouve uniquement sa lumière naturelle."
        );
    }
}


/* =====================================================
   CHAT
===================================================== */

let catClicks=0;

function catInteraction(){

    const cat=document.getElementById("cat");

    cat.classList.remove("happy");

    void cat.offsetWidth;

    cat.classList.add("happy");

    catClicks++;

    const messages=[
        "Miaou. 🐈",
        "Le chat te regarde.",
        "Il vient de bouger.",
        "Bon… apparemment il veut des caresses.",
        "Miaou encore. 😼"
    ];

    showInfo(
        "Le chat",
        messages[Math.min(catClicks-1,messages.length-1)]
    );

    setTimeout(()=>{
        cat.classList.remove("happy");
    },600);
}


/* =====================================================
   POPUPS
===================================================== */

function showInfo(title,text){

    document.getElementById("toastTitle").textContent=title;
    document.getElementById("toastText").textContent=text;

    document.getElementById("toast").classList.add("show");
}

function closeInfo(){

    document.getElementById("toast").classList.remove("show");
}


/* =====================================================
   AUTO LIGHT
===================================================== */

setInterval(()=>{

    const cat=document.getElementById("cat");

    if(Math.random()>.65){

        cat.style.transform="translateX(5px)";

        setTimeout(()=>{
            cat.style.transform="";
        },700);
    }

},4500);


/* =====================================================
   DOUBLE CLICK RESET
===================================================== */

world.addEventListener("dblclick",()=>{

    scale=1.15;
    posX=0;
    posY=0;

    updateCamera();

});


/* =====================================================
   INITIAL
===================================================== */

updateCamera();

</script>
