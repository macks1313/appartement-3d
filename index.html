<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Mon Appartement</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
    background:#dce8ed;
}


/* =========================
   APPARTEMENT
========================= */

.apartment{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #b9d8e8 0%,
        #dceaf0 46%,
        #c7a77f 46%,
        #c7a77f 100%
    );
}


/* =========================
   FENÊTRE
========================= */

.window{

    position:absolute;

    left:8%;
    top:8%;

    width:34%;
    height:38%;

    background:
    linear-gradient(
        135deg,
        #91c9e7,
        #d9f0fa
    );

    border:14px solid #eee9df;

    box-shadow:
    inset 0 0 0 4px #b6b1a7,
    0 15px 35px rgba(0,0,0,.22);
}

.window:before{

    content:"";

    position:absolute;

    top:0;
    bottom:0;

    left:50%;

    width:7px;

    background:#eee9df;

    transform:translateX(-50%);
}

.window:after{

    content:"";

    position:absolute;

    left:0;
    right:0;

    top:50%;

    height:7px;

    background:#eee9df;

    transform:translateY(-50%);
}


/* =========================
   MUR
========================= */

.wall{

    position:absolute;

    right:0;
    top:0;

    width:52%;
    height:48%;

    background:
    linear-gradient(
        145deg,
        #f7f4ed,
        #ddd8ce
    );

    box-shadow:
    -12px 10px 35px rgba(0,0,0,.08);
}


/* =========================
   SOL
========================= */

.floor{

    position:absolute;

    left:0;
    right:0;

    bottom:0;

    height:54%;

    background:

    repeating-linear-gradient(
        90deg,
        rgba(80,45,20,.08) 0px,
        rgba(80,45,20,.08) 3px,
        transparent 3px,
        transparent 120px
    ),

    linear-gradient(
        135deg,
        #caa982,
        #a9845d
    );

    transform-origin:bottom;

}


/* =========================
   TAPIS
========================= */

.rug{

    position:absolute;

    left:30%;
    bottom:18%;

    width:43%;
    height:24%;

    background:
    linear-gradient(
        135deg,
        #718d8d,
        #506d70
    );

    border-radius:12px;

    box-shadow:
    0 15px 25px rgba(0,0,0,.22);

    transform:rotate(-3deg);
}


/* =========================
   CANAPÉ
========================= */

.sofa{

    position:absolute;

    left:7%;
    bottom:24%;

    width:38%;
    height:22%;

    background:#596767;

    border-radius:18px 18px 10px 10px;

    box-shadow:
    0 16px 25px rgba(0,0,0,.3);
}


/* assise */

.sofa:before{

    content:"";

    position:absolute;

    left:5%;
    right:5%;

    bottom:12%;

    height:46%;

    background:#687777;

    border-radius:12px;
}


/* dossier */

.sofa:after{

    content:"";

    position:absolute;

    left:4%;
    right:4%;

    top:-24%;

    height:55%;

    background:#526060;

    border-radius:18px 18px 5px 5px;
}


/* accoudoirs */

.arm-left,
.arm-right{

    position:absolute;

    bottom:0;

    width:13%;
    height:95%;

    background:#4e5b5b;

    border-radius:14px;

    z-index:3;
}

.arm-left{
    left:-3%;
}

.arm-right{
    right:-3%;
}


/* =========================
   COUSSINS
========================= */

.cushion{

    position:absolute;

    width:25%;
    height:32%;

    top:7%;

    background:#9daaaa;

    border-radius:8px;

    z-index:5;
}

.cushion.one{
    left:24%;
}

.cushion.two{
    right:20%;
}


/* =========================
   TABLE
========================= */

.table{

    position:absolute;

    left:38%;
    bottom:22%;

    width:25%;
    height:10%;

    background:#855633;

    border-radius:10px;

    box-shadow:
    0 15px 20px rgba(0,0,0,.3);

    z-index:8;
}

.table-leg{

    position:absolute;

    top:90%;

    width:9%;
    height:130%;

    background:#634027;
}

.table-leg.one{
    left:12%;
}

.table-leg.two{
    right:12%;
}


/* =========================
   TÉLÉVISION
========================= */

.tv{

    position:absolute;

    right:7%;
    top:16%;

    width:30%;
    height:25%;

    background:#111;

    border:8px solid #202020;

    border-radius:5px;

    box-shadow:
    0 15px 30px rgba(0,0,0,.35);

    z-index:5;
}


/* écran */

.tv-screen{

    width:100%;
    height:100%;

    background:

    radial-gradient(
        circle at 50% 50%,
        #496b7d,
        #182936 70%
    );
}


/* meuble TV */

.tv-unit{

    position:absolute;

    right:5%;
    top:41%;

    width:34%;
    height:8%;

    background:#65472f;

    box-shadow:
    0 10px 20px rgba(0,0,0,.25);
}


/* =========================
   PLANTE
========================= */

.plant{

    position:absolute;

    right:43%;
    bottom:31%;

    width:8%;
    height:22%;

    z-index:10;
}

.pot{

    position:absolute;

    bottom:0;

    left:20%;

    width:60%;
    height:32%;

    background:#b46d4b;

    border-radius:5px 5px 14px 14px;
}

.leaf{

    position:absolute;

    width:45%;
    height:45%;

    background:#3f7049;

    border-radius:
    50% 10% 50% 10%;
}

.leaf:nth-child(1){
    left:0;
    top:10%;
    transform:rotate(-30deg);
}

.leaf:nth-child(2){
    right:0;
    top:0;
    transform:rotate(30deg);
}

.leaf:nth-child(3){
    left:28%;
    top:-15%;
    transform:rotate(5deg);
}


/* =========================
   LAMPE
========================= */

.lamp{

    position:absolute;

    right:15%;
    bottom:30%;

    width:7%;
    height:35%;

    z-index:10;
}

.lamp-base{

    position:absolute;

    bottom:0;

    left:40%;

    width:20%;
    height:65%;

    background:#343434;
}

.lamp-head{

    position:absolute;

    top:0;
    left:5%;

    width:90%;
    height:25%;

    background:#e7d19c;

    clip-path:
    polygon(
    20% 0,
    80% 0,
    100% 100%,
    0 100%
    );
}


/* =========================
   CUISINE
========================= */

.kitchen{

    position:absolute;

    right:0;
    bottom:0;

    width:25%;
    height:36%;

    background:#755039;

    box-shadow:
    -10px 0 25px rgba(0,0,0,.15);

    z-index:3;
}


/* plan de travail */

.counter{

    position:absolute;

    left:-5%;

    top:0;

    width:110%;
    height:10%;

    background:#e9e5dc;
}


/* placards */

.cabinet{

    position:absolute;

    top:17%;

    width:42%;
    height:33%;

    background:#8c6244;

    border:3px solid #69482f;
}

.cabinet.one{
    left:5%;
}

.cabinet.two{
    right:5%;
}


/* frigo */

.fridge{

    position:absolute;

    right:5%;

    bottom:5%;

    width:37%;
    height:45%;

    background:
    linear-gradient(
        90deg,
        #d9dee1,
        #f2f4f4,
        #cbd0d3
    );

    border-radius:5px;

    box-shadow:
    0 8px 15px rgba(0,0,0,.2);
}

.fridge:after{

    content:"";

    position:absolute;

    right:8%;

    top:10%;

    width:4px;
    height:80%;

    background:#8c9396;
}


/* =========================
   PLAFON
========================= */

.ceiling-light{

    position:absolute;

    top:3%;

    left:50%;

    transform:translateX(-50%);

    width:90px;
    height:35px;

    background:#f4e6b7;

    border-radius:
    50%;

    box-shadow:
    0 0 35px #fff2bb;

}


/* =========================
   TITRE
========================= */

.title{

    position:absolute;

    left:50%;
    top:4%;

    transform:translateX(-50%);

    z-index:30;

    padding:12px 22px;

    background:
    rgba(255,255,255,.9);

    border-radius:18px;

    font-size:18px;

    font-weight:900;

    color:#17212b;

    box-shadow:
    0 8px 25px rgba(0,0,0,.18);

    white-space:nowrap;
}


/* =========================
   INFO
========================= */

.info{

    position:absolute;

    left:50%;
    bottom:4%;

    transform:translateX(-50%);

    z-index:40;

    padding:12px 20px;

    background:
    rgba(255,255,255,.92);

    border-radius:15px;

    font-size:14px;

    font-weight:700;

    color:#26343d;

    box-shadow:
    0 8px 20px rgba(0,0,0,.18);

    text-align:center;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .title{

        top:3%;

        font-size:15px;

        padding:10px 15px;
    }

    .window{

        left:5%;
        top:11%;

        width:42%;
        height:30%;
    }

    .wall{

        height:48%;
        width:55%;
    }

    .sofa{

        left:5%;
        bottom:26%;

        width:43%;
        height:18%;
    }

    .rug{

        left:25%;
        bottom:17%;

        width:50%;
        height:20%;
    }

    .table{

        left:36%;
        bottom:21%;

        width:29%;
    }

    .tv{

        right:5%;
        top:17%;

        width:34%;
        height:19%;
    }

    .tv-unit{

        right:3%;
        top:36%;

        width:38%;
    }

    .kitchen{

        width:29%;
        height:32%;
    }

    .plant{

        right:40%;
        bottom:28%;
    }

    .lamp{

        right:12%;
        bottom:29%;
    }

    .info{

        bottom:3%;

        max-width:90%;

        font-size:12px;
    }
}

</style>
</head>


<body>


<div class="apartment">


    <div class="wall"></div>

    <div class="floor"></div>


    <!-- FENÊTRE -->

    <div class="window"></div>


    <!-- LUMIÈRE -->

    <div class="ceiling-light"></div>


    <!-- TITRE -->

    <div class="title">
        🏠 MON APPARTEMENT
    </div>


    <!-- TAPIS -->

    <div class="rug"></div>


    <!-- CANAPÉ -->

    <div class="sofa">

        <div class="arm-left"></div>
        <div class="arm-right"></div>

        <div class="cushion one"></div>
        <div class="cushion two"></div>

    </div>


    <!-- TABLE -->

    <div class="table">

        <div class="table-leg one"></div>
        <div class="table-leg two"></div>

    </div>


    <!-- TV -->

    <div class="tv">

        <div class="tv-screen"></div>

    </div>

    <div class="tv-unit"></div>


    <!-- PLANTE -->

    <div class="plant">

        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>

        <div class="pot"></div>

    </div>


    <!-- LAMPE -->

    <div class="lamp">

        <div class="lamp-head"></div>
        <div class="lamp-base"></div>

    </div>


    <!-- CUISINE -->

    <div class="kitchen">

        <div class="counter"></div>

        <div class="cabinet one"></div>
        <div class="cabinet two"></div>

        <div class="fridge"></div>

    </div>


    <!-- TEXTE -->

    <div class="info">

        Salon · Cuisine · Coin TV · Fenêtre

    </div>


</div>


</body>
</html>
